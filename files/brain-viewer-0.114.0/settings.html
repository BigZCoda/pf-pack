<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings</title>
<link rel="stylesheet" href="/static/viewer-tokens.css">
<link rel="icon" type="image/png" href="/static/sun-favicon.png">
<style>
  /* layout only; every color and font comes from viewer-tokens.css */
  body { min-height: 100vh; }
  main { padding: 18px 34px 80px; max-width: 820px; }
  .st-title { margin: 4px 0 6px; font-size: 28px; line-height: 1.2; color: var(--ink); }
  .st-state { margin: 0 0 18px; font-size: 15px; color: var(--ink-soft); max-width: 72ch; overflow-wrap: anywhere; }
  section.st-group { margin: 0 0 16px; padding: 14px 18px 16px; }
  section.st-group h2 { margin: 0 0 10px; font-family: var(--font-display); font-size: 19px; font-weight: normal; color: var(--ink); }
  .st-row { margin: 0 0 12px; }
  .st-row:last-child { margin-bottom: 0; }
  .st-row label { display: inline-flex; align-items: baseline; gap: 9px; cursor: pointer; font-size: 15.5px; color: var(--ink); }
  .st-row label.off { color: var(--muted); cursor: default; }
  .st-row input[type=checkbox] { flex: none; width: 18px; height: 18px; margin: 0; position: relative; top: 3px; accent-color: var(--accent); }
  .st-row input[type=number] { width: 4.2em; padding: 3px 6px; font: inherit; font-size: 15px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); color: var(--ink); }
  .st-row input[type=number]:focus { outline: none; border-color: var(--accent); }
  .st-help { margin: 4px 0 0 27px; font-size: 13.5px; color: var(--ink-soft); max-width: 66ch; }
  .st-say { margin: 10px 0 0; font-size: 13px; }
  .st-say:empty { display: none; }
  /* 0.95.0: the Studio's connections, read only */
  .st-conn { display: grid; grid-template-columns: minmax(130px, max-content) 1fr; gap: 5px 14px; margin: 0; font-size: 14.5px; }
  .st-conn dt { color: var(--ink-soft); }
  .st-conn dd { margin: 0; color: var(--ink); overflow-wrap: anywhere; min-width: 0; }
  .st-conn dd .meta { font-size: 12.5px; }
  .st-conn .on { color: var(--done, var(--ink)); }
  .st-conn .off { color: var(--muted); }
  .st-conn code { font-size: 13px; }
  /* 0.109.0: who this brain shares with, one row per person or team */
  .st-shares { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .st-share { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
  .st-share .who { font-family: var(--font-display); font-size: 16.5px; color: var(--ink); }
  .st-share .who a { color: inherit; }
  .st-share .what { flex: 1 1 16em; min-width: 0; font-size: 14.5px; color: var(--ink-soft); overflow-wrap: anywhere; }
  .st-share .go { flex: none; font-size: 14.5px; }
  /* 0.111.0: turning sharing on, adding a partner, the employer's computer; every press says what it did beside it */
  .st-sub { margin: 0 0 16px; }
  .st-sub:last-child { margin-bottom: 0; }
  .st-sub h3 { margin: 0 0 6px; font-size: 15.5px; font-weight: 600; color: var(--ink); }
  .st-sub.rule { border-top: 1px solid var(--rule); padding-top: 12px; }
  .st-form { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0; }
  .st-form input[type=email], .st-form input[type=text], .st-form input[type=date], .st-form textarea {
    flex: 1 1 12em; min-width: 0; padding: 5px 8px; font: inherit; font-size: 15px; border: 1px solid var(--rule);
    border-radius: var(--radius); background: var(--surface); color: var(--ink); }
  .st-form input.short { flex: 0 1 8em; }
  .st-form input:focus, .st-form textarea:focus { outline: none; border-color: var(--accent); }
  .st-form .btn { flex: none; }
  .st-quiet { background: none; border: 0; padding: 2px 0; font: inherit; font-size: 14px; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .st-quiet:hover { color: var(--ink); }
  .st-said { display: block; margin: 6px 0 0; font-size: 13.5px; color: var(--ink-soft); overflow-wrap: anywhere; }
  .st-said:empty { display: none; }
  .st-sent { width: 100%; margin: 8px 0 0; }
  .st-sent textarea { width: 100%; box-sizing: border-box; min-height: 5.6em; resize: vertical; field-sizing: content; font-size: 14px; }
  .st-share .mail { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .st-share .acts { flex: none; display: inline-flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
  .st-share .more { flex: 1 1 100%; min-width: 0; }
  .st-held { font-size: 14px; color: var(--ink); overflow-wrap: anywhere; }
  .st-probs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--ink-soft); }
  .st-probs li { overflow-wrap: anywhere; }
  .st-invites { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .st-invites li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; font-size: 15px; color: var(--ink); }
  .st-invites li span { flex: 1 1 16em; min-width: 0; overflow-wrap: anywhere; }
  @media (max-width: 700px) {
    main { padding: 14px 16px 60px; }
    .st-title { font-size: 24px; }
    section.st-group { padding: 12px 14px 14px; }
    .st-help { margin-left: 0; }
    .st-conn { grid-template-columns: 1fr; gap: 1px 0; }
    .st-conn dd { margin-bottom: 7px; }
  }
</style>
</head>
<body>
<header class="bar">
  <img class="mark" src="/static/sun-mark.png" alt="" width="36" height="28">
  <h1>Settings</h1>
  <span class="spacer"></span>
  <nav class="panels" data-page="settings"></nav>
</header>
<main id="main" class="no-gloss"><p class="meta">Reading your settings…</p></main>
<script src="/static/viewer-common.js"></script>
<script>
// /settings (0.92.0): the settings a person changes in the viewer, saved in viewer/settings.json through PUT
// /api/settings, which writes only the keys this page shows and keeps every other key as it was. The first group is
// how answers reach the main session (brain-viewer T-0359): held until the Send answers press, leaving the viewer or
// the quiet minutes, or sent at each press. A change holds at once; nothing to restart. 0.103.0 (brain-viewer T-0403): two
// more in the same group, whether a file dropped on a page waits for Send (drop_hold) and whether every Send press opens
// a box for a note (send_note_box).
const esc = BV.esc;
const $ = s => document.querySelector(s);
let S = null;
let P = null;             // 0.95.0: GET /api/studio/providers, for the Studio's connections (read only)
let P_ERR = "";

// 0.95.0: the Studio's connections: which providers are ready, and where the local one connects (the ComfyUI address,
// its folder, the four model files and the time a picture may take, each with the setting that changes it). Read only;
// the settings live in the person's own settings file and the Studio reads them at each picture.
function studioGroup() {
  if (!P && !P_ERR) return `<section class="st-group card" id="studio" aria-labelledby="st-studio"><h2 id="st-studio">The Studio's connections</h2><p class="st-help" style="margin-left:0">Asking which providers are ready…</p></section>`;
  if (P_ERR) return `<section class="st-group card" id="studio" aria-labelledby="st-studio"><h2 id="st-studio">The Studio's connections</h2><p class="st-help" style="margin-left:0">${esc(P_ERR)}</p></section>`;
  const rows = (P.providers || []).map(p => `<dt>${esc(p.name || p.id)}</dt><dd>${p.ready ? `<span class="on">ready</span>`
    : p.checking ? `<span class="off">checking…</span>` : `<span class="off">off:</span> <span class="meta">${esc(p.reason || p.howTo || "")}</span>`}</dd>`);
  const c = (P.providers || []).map(p => p.connection).find(Boolean);
  if (c) {
    rows.push(`<dt>${esc(c.label || "Address")}</dt><dd><code>${esc(c.value || "")}</code> <span class="meta">${esc(c.from || "")}</span></dd>`);
    if (c.folder) rows.push(`<dt>ComfyUI folder</dt><dd><code>${esc(c.folder)}</code> <span class="meta">(<code>comfy_dir</code>)</span></dd>`);
    if ((c.models || []).length) rows.push(`<dt>Model files</dt><dd>${c.models.map(m => `${esc(m.role)} <code>${esc(m.file)}</code>${m.set ? ` <span class="meta">yours</span>` : ""}`).join("<br>")}<br><span class="meta">(<code>${esc(c.modelsSetting || "comfy_models")}</code>; the ones not set are the defaults)</span></dd>`);
    if (c.timeout) rows.push(`<dt>Time a picture may take</dt><dd>${esc(String(c.timeout))} seconds at ${esc(String(c.steps || 20))} steps <span class="meta">(<code>${esc(c.timeoutSetting || "comfy_timeout_seconds")}</code>; ${c.timeoutSet ? "yours" : "the default, which grows with the steps"})</span></dd>`);
  }
  const where = c && c.settingsFile ? `<p class="st-help" style="margin-left:0">The settings named in brackets are kept in <code>${esc(c.settingsFile)}</code> at your brain root, and the Studio reads them at each picture.</p>` : "";
  return `<section class="st-group card" id="studio" aria-labelledby="st-studio">
      <h2 id="st-studio">The Studio's connections</h2>
      <dl class="st-conn">${rows.join("")}</dl>
      ${where}
      <p class="st-help" style="margin-left:0">Pictures land in <code>${esc(P.root || "")}</code>. <a href="/studio">Open the Studio</a></p>
    </section>`;
}

// 0.109.0 (brain-viewer T-0404, round one of sharing between any two people who use the viewer): who this brain shares
// with, read from the sharing register (GET /api/sharing/state). One row per person or team: the name (a link to the
// card), what is on their Today from here and when it last went, and one press to the page that shows what they hold.
// Nobody to share with draws nothing; a server older than this page answers no such route and draws nothing either.
let SH = null;
const shCount = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
// a stamp as a person reads it, in this computer's own time (the export stamps in UTC)
const shWhen = iso => {
  const d = new Date(String(iso || ""));
  if (isNaN(d)) return "";
  return `${d.getMonth() + 1}/${d.getDate()} at ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
};
// ---- sharing, round two (0.111.0) ----
// With sharing set up on this computer, the group also turns it on (an email, then the code sent to it), says
// who is signed in, lists the invitations waiting, adds a share partner (the answer is the three lines to send, with a
// copy press), joins with a code, makes a team brain, detaches (one line on what happens, then a second press) and marks a
// computer as an employer's. Every press goes to a route under /api/sharing/, says what it did in one line beside it, and the
// group repaints from the state in the answer. Nothing is drawn that cannot be pressed.
const SHU = { sent: false, email: "", inv: false, add: false, addTeam: "", made: null, says: {}, confirm: {}, people: null, invites: null, busy: false };
const shSaid = k => `<span class="st-said" data-shsaid="${esc(k)}" aria-live="polite">${esc(SHU.says[k] || "")}</span>`;
const shMd = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || "")); return m ? `${+m[2]}/${+m[3]}` : ""; };
const shCard = (card, label) => card ? `<a href="/people?open=${encodeURIComponent(card)}">${esc(label)}</a>` : esc(label);
function shSignIn() {
  const me = SH.me || {};
  if (me.signedIn) return `<div class="st-sub"><p class="st-form" style="margin:0">Sharing as <b>${esc(me.email || "")}</b>
      <button type="button" class="st-quiet" data-sh="signout">sign out</button></p>${shSaid("me")}</div>`;
  return `<div class="st-sub"><h3>Turn sharing on</h3>
    <form class="st-form" data-shform="signin">
      <input type="email" name="email" required autocomplete="email" placeholder="your email address" aria-label="your email address" value="${esc(SHU.email)}">
      ${SHU.inv && !SHU.sent ? `<input type="text" name="invitation" class="short" placeholder="invitation code" aria-label="your invitation code">` : ""}
      ${SHU.sent ? `<input type="text" name="code" class="short" inputmode="numeric" autocomplete="one-time-code" maxlength="10" required placeholder="the code" aria-label="the code from the email">` : ""}
      <button class="btn primary" type="submit">${SHU.sent ? "Sign in" : "Send me a code"}</button>
    </form>
    <p class="st-form" style="margin:6px 0 0">${SHU.sent ? `<button type="button" class="st-quiet" data-sh="again">send a new code</button>`
      : SHU.inv ? "" : `<button type="button" class="st-quiet" data-sh="inv">I have an invitation code</button>`}</p>${shSaid("signin")}</div>`;
}
function shInvites() {
  const rows = SHU.invites || [];
  if (!(SH.me || {}).signedIn || !rows.length) return "";
  return `<div class="st-sub rule"><h3>Invitations for you</h3><ul class="st-invites">${rows.map(r => {
    const who = `${esc(r.from_display || "Someone")}${r.from_email ? ` (${esc(r.from_email)})` : ""}`;
    return `<li><span>${who} invited you ${r.space_kind === "team" ? `into the team brain ${esc(r.space_label || "")}` : "to share"}</span>
      <button type="button" class="btn primary" data-sh="accept" data-invite="${esc(r.id)}">Accept</button></li>`;
  }).join("")}</ul>${shSaid("accept")}</div>`;
}
// the person box offers the people cards as you type; the email is theirs to give
function shPersonForm(team) {
  const list = (SHU.people || []).map(p => `<option value="${esc(p.name)}"></option>`).join("");
  return `<form class="st-form" data-shform="invite"${team ? ` data-team="${esc(team)}"` : ""}>
      <input type="text" name="name" required list="sh-people" autocomplete="off" placeholder="their name" aria-label="the person's name">
      <input type="email" name="email" required autocomplete="off" placeholder="their email address" aria-label="the person's email address">
      <button class="btn primary" type="submit">Invite</button></form><datalist id="sh-people">${list}</datalist>`;
}
function shMade(key) {
  const m = SHU.made;
  if (!m || m.key !== key) return "";
  // the engine's line ("Send <name> the text below; the code is shown only now") sits above the text it points at
  return `<div class="st-sent"><p class="st-said" style="margin:0 0 6px" aria-live="polite">${esc(m.line || "")}</p><textarea readonly aria-label="the text to send">${esc(m.text)}</textarea>
    <p class="st-form" style="margin:4px 0 0"><button type="button" class="btn" data-sh="copy">copy</button></p></div>`;
}
function shRow(s) {
  const people = (s.people || []).filter(p => p.label);
  const mail = people.length === 1 && people[0].email ? ` <span class="mail">${esc(people[0].email)}</span>` : "";
  let who = s.kind === "team" || people.length !== 1
    ? `${esc(s.label)}${people.length ? ` <span class="meta">${people.map(p => `${shCard(p.card, p.label)}${p.email ? ` <span class="mail">${esc(p.email)}</span>` : ""}`).join(", ")}</span>` : ""}`
    : `${shCard(people[0].card, s.label)}${mail}`;
  // the same person through a team copy and on the sharing service: the copy's row says which it is
  if (s.shown && s.shown !== s.label) who += ` <span class="meta">team copy</span>`;
  // 0.112.0: a space the service carries has its own page; its name is the link there (the people stay links to their cards)
  if (s.carrier === "service") {
    const page = `<a href="/share?space=${encodeURIComponent(s.name)}">${esc(s.label)}</a>`;
    who = s.kind === "team" || people.length !== 1
      ? `${page}${people.length ? ` <span class="meta">${people.map(p => `${shCard(p.card, p.label)}${p.email ? ` <span class="mail">${esc(p.email)}</span>` : ""}`).join(", ")}</span>` : ""}`
      : `${page}${mail}`;
  }
  // the engine's counts keep tasks and questions apart; a row from an older engine falls back to `to`
  const to = s.to || {}, c = s.counts || { tasks: to.tasks, questions: 0, threads: to.threads };
  const bitsAll = [["tasks", "task"], ["questions", "question"], ["threads", "thread"], ["files", "file"], ["drawings", "drawing"], ["sections", "card section"]]
    .map(([k, w]) => c[k] ? shCount(c[k], w) : "").filter(Boolean);
  const bits = bitsAll.length > 1 ? [bitsAll.slice(0, -1).join(", "), bitsAll[bitsAll.length - 1]] : bitsAll;
  let what;
  if (s.state === "detached") what = `stopped sharing${s.left ? ` on ${esc(shMd(s.left))}` : ""}; what each of you shared stays as it was`;
  else {
    // a team brain has no Today of its own: what went is "shared with" it; a pair keeps "on <name>'s Today"
    const parts = [s.kind === "team"
      ? (bits.length ? `${bits.join(" and ")} shared with ${esc(s.label)}` : `nothing shared with ${esc(s.label)} yet`)
      : (bits.length ? `${bits.join(" and ")} on ${esc(s.label)}'s Today from here` : `nothing on ${esc(s.label)}'s Today yet`)];
    for (const f of s.from || []) parts.push(`${shCount(f.count, "item")} waiting from ${esc(f.label)}`);
    if (s.lastSent) parts.push(`last went ${esc(shWhen(s.lastSent))}`);
    for (const n of s.invited || []) parts.push(`invited, waiting for ${esc(n)} to accept`);
    // round four: the projects shared whole, each a link to its page
    if ((s.projects || []).length) parts.push(`${s.projects.length === 1 ? "the project" : "the projects"} ${s.projects.map(p => `<a href="/projects?id=${encodeURIComponent(p.id)}">${esc(p.label)}</a>`).join(", ")}`);
    what = parts.join("; ");
  }
  // changes of this person's held back by the gate: said in plain words, with the newest reason from the last check
  const why = s.heldWhy || ((SH.sync || {}).problems || []).slice(-1)[0] || "";
  const held = s.held > 0 ? `<span class="more st-held">${s.held === 1 ? "1 change of yours is held back" : `${s.held} changes of yours are held back`}: ${s.held === 1 ? "it" : "they"} did not pass what may be shared.${why ? `<span class="st-said">${esc(why)}</span>` : ""}</span>` : "";
  const acts = [];
  if (s.kind === "team" && s.maker && s.state !== "detached" && (SH.me || {}).signedIn)
    acts.push(`<button type="button" class="st-quiet" data-sh="addto" data-space="${esc(s.name)}" aria-expanded="${SHU.addTeam === s.name}">Add a person</button>`);
  // 0.112.0: one computer keeps a space in step; on any other the row says which, with one press to move it here
  const away = s.carrier === "service" && s.state !== "detached" && s.here === false;
  if (away && (SH.me || {}).signedIn) acts.push(`<button type="button" class="st-quiet" data-sh="move-here" data-space="${esc(s.name)}">Move it here</button>`);
  if (away) what += `. Kept in step from ${esc(s.hostName || "another computer")}.`;
  if (s.canDetach && !SHU.confirm[s.name]) acts.push(`<button type="button" class="st-quiet" data-sh="detach" data-space="${esc(s.name)}">Detach</button>`);
  if (s.carrier !== "service" && s.page) acts.push(`<a class="go" href="${esc(s.page)}">what ${esc(s.label)} gets</a>`);
  const conf = SHU.confirm[s.name] ? `<div class="more"><p class="st-form" style="margin:4px 0 0"><span>${esc(SHU.confirm[s.name])}</span>
      <button type="button" class="btn primary" data-sh="detach-yes" data-space="${esc(s.name)}">Yes, stop sharing</button>
      <button type="button" class="btn" data-sh="detach-no" data-space="${esc(s.name)}">Keep sharing</button></p></div>` : "";
  const made = shMade("team:" + s.name);
  const add = (SHU.addTeam === s.name ? `<div class="more">${shPersonForm(s.name)}</div>` : "") + (made ? `<div class="more">${made}</div>` : "");
  return `<li class="st-share"><span class="who">${who}</span><span class="what">${what}</span>${held}${acts.length ? `<span class="acts">${acts.join("")}</span>` : ""}${conf}${add}<span class="more">${shSaid("row:" + s.name)}</span></li>`;
}
// 0.114.0: a brain that runs a program has a mailbox for each person in it: a private space between the people who
// run it and that one person. This lists them and makes one; sending is in the Share box (Send to mailboxes).
function shMailboxes() {
  const rows = (SH.mailboxes || []).map(b => `<li class="st-share"><span class="who"><a href="/share?space=${encodeURIComponent(b.space)}">${esc(b.person)}</a></span>
      <span class="what">${b.joined ? "has joined" : "invited, has not joined yet"}${b.open ? `; ${b.open} open in it` : ""}</span></li>`).join("");
  return `<div class="st-sub rule"><h3>Mailboxes</h3>
    <p class="meta" style="margin:2px 0 8px">A mailbox is a private space between you and one person. What you send them lands there, and what they do with it comes back there. To send, press Share on a task, a question or a file and choose Send to mailboxes.</p>
    ${rows ? `<ul class="st-shares" style="margin-bottom:10px">${rows}</ul>` : ""}
    <form class="st-form" data-shform="mailbox"><input type="text" name="name" required placeholder="their name" aria-label="the person's name">
      <input type="email" name="email" required placeholder="their email address" aria-label="the person's email address"><button class="btn" type="submit">Make a mailbox</button></form>
    ${shMade("mailbox")}${shSaid("mailbox")}</div>`;
}
function shClient() {
  const c = SH.client || {}, ag = c.agreed;
  return `<div class="st-sub rule"><div class="st-row"><label><input type="checkbox" id="sh-client"${c.on ? " checked" : ""}> <span>My employer owns this computer</span></label>
      <p class="st-help">${c.on ? esc(c.line || "") : "Leave this unticked on a computer that is yours. When it is ticked, what is shared with you still arrives and you can answer it; sharing something of your own waits until your employer agrees in writing."}</p></div>
    ${c.on ? `<form class="st-form" data-shform="client">
      <input type="text" name="client" required placeholder="your employer's name" aria-label="your employer's name" value="${esc(ag ? ag.client : "")}">
      <input type="date" name="date" required aria-label="the day they agreed in writing" value="${esc(ag ? ag.date : "")}">
      <button class="btn" type="submit">Save</button></form>` : ""}
    ${c.on && ag ? `<p class="st-form" style="margin:8px 0 0"><button type="button" class="btn primary" data-sh="sync">Check for what was shared</button></p>` : ""}
    ${shSaid("client")}</div>`;
}
function sharingGroup() {
  if (!SH || !SH.mode) return "";
  const svc = !!(SH.service && SH.service.setUp) && SH.mode !== "member";
  if (SH.mode === "none" && !svc) return "";
  const head = `<section class="st-group card" id="sharing" aria-labelledby="st-sharing"><h2 id="st-sharing">Sharing</h2>`;
  if (SH.mode === "member") {
    if (!SH.with) return "";
    return `${head}<ul class="st-shares"><li class="st-share"><span class="who">${esc(SH.with)}</span>
      <span class="what">${SH.shared ? "the files you share go both ways" : "your changes go as requests"}</span></li></ul></section>`;
  }
  if (svc) {
    // an employer's computer no longer hides the group: what is shared arrives there; only sharing out waits (2026-11-11)
    const on = (SH.me || {}).signedIn, blocked = false;
    // a mailbox is listed once, under Mailboxes, not a second time among the team brains
    const boxNames = new Set(SH.admin ? (SH.mailboxes || []).map(b => b.space) : []);
    const rows = (SH.spaces || []).filter(s => !boxNames.has(s.name)).map(shRow).join("");
    // what the last check found to look at: newest first, at most three, one line each; nothing when there are none
    // a reason already drawn under a row's held-back line is not drawn twice
    const onRows = new Set((SH.spaces || []).filter(s => s.held > 0).map(s => s.heldWhy || ((SH.sync || {}).problems || []).slice(-1)[0] || ""));
    const probs = ((SH.sync || {}).problems || []).filter(p => !onRows.has(p)).slice(-3).reverse();
    const found = probs.length ? `<div class="st-sub"><h3>From the last check</h3><ul class="st-probs">${probs.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>` : "";
    return `${head}${blocked ? "" : shSignIn()}${blocked ? "" : shInvites()}${rows ? `<div class="st-sub rule"><ul class="st-shares">${rows}</ul></div>` : ""}${found}
      ${on && !blocked ? `<div class="st-sub rule"><button type="button" class="btn" data-sh="add" aria-expanded="${SHU.add}">Add a share partner</button>
        ${SHU.add ? `<div style="margin-top:8px">${shPersonForm("")}</div>` : ""}${shMade("pair")}${shSaid("add")}</div>
      <div class="st-sub"><h3>Join with a code</h3><form class="st-form" data-shform="join"><input type="text" name="code" required placeholder="the code you were sent" aria-label="the code you were sent"><button class="btn" type="submit">Join</button></form>${shSaid("join")}</div>
      <div class="st-sub"><h3>Make a team brain</h3><form class="st-form" data-shform="team"><input type="text" name="name" required placeholder="the team's name" aria-label="the team brain's name"><button class="btn" type="submit">Make</button></form>${shSaid("team")}</div>` : ""}
      ${on && SH.admin ? shMailboxes() : ""}
      ${shClient()}</section>`;
  }
  const rows = (SH.spaces || []).map(s => {
    const people = (s.people || []).filter(p => p.label);
    const who = s.kind === "team" || people.length !== 1
      ? `${esc(s.label)}${people.length ? ` <span class="meta">${people.map(p => p.card ? `<a href="/people?open=${encodeURIComponent(p.card)}">${esc(p.label)}</a>` : esc(p.label)).join(", ")}</span>` : ""}`
      : (people[0].card ? `<a href="/people?open=${encodeURIComponent(people[0].card)}">${esc(s.label)}</a>` : esc(s.label));
    const to = s.to || {}, bits = [to.tasks ? shCount(to.tasks, "task") : "", to.threads ? shCount(to.threads, "thread") : ""].filter(Boolean);
    const what = `${bits.length ? `${bits.join(" and ")} on ${esc(s.label)}'s Today` : `nothing on ${esc(s.label)}'s Today yet`}${s.lastSent ? `, last sent ${esc(shWhen(s.lastSent))}` : ""}`;
    return `<li class="st-share"><span class="who">${who}</span><span class="what">${what}</span>${s.page ? `<a class="go" href="${esc(s.page)}">what ${esc(s.label)} gets</a>` : ""}</li>`;
  });
  return rows.length ? `${head}<ul class="st-shares">${rows.join("")}</ul></section>` : "";
}

function paint() {
  const a = S.answers, dr = S.drops || { hold: true }, sn = S.sendNote || { box: false };
  if (a.teamCopy) {
    $("#main").innerHTML = `<h2 class="st-title">Settings</h2>
      <p class="st-state">This copy sends no answers to a main session, so the answers have nothing to set here.</p>${sharingGroup()}${studioGroup()}`;
    return;
  }
  $("#main").innerHTML = `<h2 class="st-title">Settings</h2>
    <p class="st-state">A change here is saved at once, in <code>${esc(S.path)}</code>.</p>
    <section class="st-group card" aria-labelledby="st-answers">
      <h2 id="st-answers">Sending your answers</h2>
      <div class="st-row">
        <label><input type="checkbox" id="hold"${a.hold ? " checked" : ""}> <span>Hold my answers until I send them</span></label>
        <p class="st-help">${a.hold
          ? "On: an answer, done, hold or note is saved the moment you press it, and goes to the main agent when you press <b>Send</b> at the bottom right, when you leave the viewer, or after the minutes below with no new press."
          : "Off: each answer, done, hold or note goes to the main agent the moment you press it."}</p>
      </div>
      <div class="st-row">
        <label class="${a.hold ? "" : "off"}"><span>Send on their own after</span>
          <input type="number" id="mins" min="1" max="60" step="1" value="${a.quietMinutes}"${a.hold ? "" : " disabled"} aria-label="minutes with no new press">
          <span>minute${a.quietMinutes === 1 ? "" : "s"} with no new press</span></label>
      </div>
      <div class="st-row">
        <label class="${a.hold ? "" : "off"}"><input type="checkbox" id="drophold"${dr.hold ? " checked" : ""}${a.hold ? "" : " disabled"}> <span>Hold a file I drop on a page until I send it</span></label>
        <p class="st-help">${!a.hold
          ? "Your answers go at each press, so a file you drop on a page goes to the main agent at once too."
          : dr.hold
          ? "On: a file you drop on a page, or add with the file press in the notepad, waits with your answers and goes with the next <b>Send</b>."
          : "Off: a file you drop on a page goes to the main agent the moment you add it, on its own; your answers keep waiting."}</p>
      </div>
      <div class="st-row">
        <label class="${a.hold ? "" : "off"}"><input type="checkbox" id="notebox"${sn.box ? " checked" : ""}${a.hold ? "" : " disabled"}> <span>Ask for a note every time I press Send</span></label>
        <p class="st-help">${sn.box
          ? "On: pressing <b>Send</b> opens a box for a note on everything it sends. Enter, or an empty box, sends as before."
          : "Off: <b>Send</b> sends at once. Right-click it, or hold it on a phone, to add a note first."}</p>
      </div>
      <p class="st-say meta" id="say" aria-live="polite"></p>
    </section>${updateGroup()}${backupGroup()}${sharingGroup()}${studioGroup()}`;
}
// 0.112.0: whether Today says a newer viewer is ready in the pack (read once a day at most, nothing sent)
function updateGroup() {
  const u = S.updateNotice || { on: true };
  return `<section class="st-group card" id="updates" aria-labelledby="st-updates"><h2 id="st-updates">Updates</h2>
      <div class="st-row"><label><input type="checkbox" id="updnotice"${u.on ? " checked" : ""}> <span>Tell me on Today when a newer viewer is ready</span></label>
        <p class="st-help">${u.on ? "On: once a day at most the viewer looks at the list of published versions and, when a newer one is there, Today says so in one line. Nothing is downloaded or sent."
          : "Off: Today says nothing about newer versions."}</p></div>
      <p class="st-say meta" id="updsay" aria-live="polite"></p></section>`;
}

// 0.114.0: the nightly backup. A brain made from the kit saves itself each night and sends the save to the person's own
// GitHub repository; this is where they turn the sending off. Drawn only for a brain that has such a repository.
function backupGroup() {
  const b = S.backup || {};
  if (!b.repo) return "";
  const last = b.last ? ` The last nightly save here was on ${esc(b.last.slice(5).replace("-", "/").replace(/^0/, "").replace("/0", "/"))}.`
    : " No nightly save has run on this computer in the past week.";
  return `<section class="st-group card" id="backup" aria-labelledby="st-backup"><h2 id="st-backup">Backup</h2>
      <div class="st-row"><label><input type="checkbox" id="bakpush"${b.on ? " checked" : ""}> <span>Send this brain to my GitHub each night</span></label>
        <p class="st-help">${b.on ? `On: each night this brain is saved and sent to your own GitHub repository, ${esc(b.repo)}.${last}`
          : `Off: this brain is still saved on this computer each night, and nothing is sent to ${esc(b.repo)}.`}</p></div>
      <p class="st-say meta" id="baksay" aria-live="polite"></p></section>`;
}

async function save(change, said, where) {
  const say = $(where || "#say"); say.textContent = "saving…";
  let r, j;
  try { r = await fetch("/api/settings", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(change) }); j = await r.json(); }
  catch (e) { say.textContent = "Not saved: " + e.message; return; }
  if (!r.ok) { say.textContent = "Not saved: " + (j.error || "the server answered " + r.status); return; }
  S = j.settings; paint(); $(where || "#say").textContent = said;
  if (BV.outbox && BV.outbox.refresh) BV.outbox.refresh();
}

document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "hold") return save({ answers_hold: t.checked }, t.checked
    ? "Saved: your answers wait for you to send them."
    : "Saved: each press goes to the main agent at once, and anything that was waiting goes now.");
  if (t.id === "drophold") return save({ drop_hold: t.checked }, t.checked
    ? "Saved: a file you drop on a page waits for your next Send."
    : "Saved: a file you drop on a page goes to the main agent at once.");
  if (t.id === "updnotice") return save({ update_notice: t.checked }, t.checked
    ? "Saved: Today says when a newer viewer is ready."
    : "Saved: Today says nothing about newer versions.", "#updsay");
  if (t.id === "bakpush") return save({ nightly_backup: t.checked }, t.checked
    ? "Saved: each night this brain is sent to your GitHub."
    : "Saved: nothing is sent; this brain is still saved on this computer each night.", "#baksay");
  if (t.id === "notebox") return save({ send_note_box: t.checked }, t.checked
    ? "Saved: Send opens a box for a note each time."
    : "Saved: Send sends at once; right-click it for a note.");
  if (t.id === "mins") {
    const n = Math.round(+t.value);
    if (!(n >= 1 && n <= 60)) { $("#say").textContent = "Pick a number of minutes from 1 to 60."; t.value = S.answers.quietMinutes; return; }
    return save({ answers_quiet_minutes: n }, `Saved: held answers go after ${n} minute${n === 1 ? "" : "s"} with no new press.`);
  }
});

async function load() {
  let r, j;
  try { r = await fetch("/api/settings"); j = await r.json(); }
  catch (e) { $("#main").innerHTML = `<p class="note">Could not read your settings: ${esc(e.message)}</p>`; return; }
  if (!r.ok) { $("#main").innerHTML = `<p class="note">${esc(j.error || ("The server answered " + r.status))}</p>`; return; }
  S = j; paint();
  loadSharing();
  loadStudio();
}
// 0.109.0: who this brain shares with; the group is drawn in place once the read lands
async function loadSharing() {
  try {
    const r = await fetch("/api/sharing/state");
    SH = r.ok ? await r.json() : null;
  } catch (e) { SH = null; }
  if (!SH) return;
  shRepaint();
  if (location.hash === "#sharing") { const el = document.getElementById("sharing"); if (el) el.scrollIntoView({ block: "start" }); }
  shInvitesLoad();
}
// 0.111.0: the group drawn again in place, keeping what was typed in its boxes and where the cursor was
function shRepaint(focus, fresh) {
  const old = document.getElementById("sharing"), html = sharingGroup();
  const typed = {};
  if (old && !fresh) for (const el of old.querySelectorAll("form[data-shform] input[name]")) if (el.value) typed[`${el.form.dataset.shform}:${el.form.dataset.team || ""}:${el.name}`] = el.value;
  if (old) old.outerHTML = html;
  else if (html) {
    const studio = document.getElementById("studio");
    if (studio) studio.insertAdjacentHTML("beforebegin", html); else $("#main").insertAdjacentHTML("beforeend", html);
  }
  const now = document.getElementById("sharing");
  if (!now) return;
  for (const el of now.querySelectorAll("form[data-shform] input[name]")) {
    const k = `${el.form.dataset.shform}:${el.form.dataset.team || ""}:${el.name}`;
    if (typed[k] && !el.value) el.value = typed[k];
  }
  if (focus) { const el = now.querySelector(focus); if (el) el.focus(); }
}
// the invitations waiting for this person: a call to the service, read after the page paints
async function shInvitesLoad() {
  if (!SH || !(SH.service || {}).setUp || !(SH.me || {}).signedIn) return;
  try { const r = await fetch("/api/sharing/invites"), j = await r.json(); SHU.invites = j.ok ? (j.invites || []) : []; if (j.state) SH = j.state; }
  catch (e) { SHU.invites = []; }
  shRepaint();
}
async function shPeopleLoad() {
  if (SHU.people) return;
  try { const j = await (await fetch("/api/people")).json(); SHU.people = (j.people || []).map(p => ({ name: p.name, slug: p.slug })).filter(p => p.name); }
  catch (e) { SHU.people = []; }
  const dl = document.getElementById("sh-people");
  if (dl) dl.innerHTML = SHU.people.map(p => `<option value="${esc(p.name)}"></option>`).join("");
}
// one press: the route, the line beside the press, the group repainted from the state in the answer
async function shPost(verb, body, sayKey) {
  if (SHU.busy) return null;
  SHU.busy = true;
  const say = document.querySelector(`[data-shsaid="${CSS.escape(sayKey)}"]`);
  if (say) say.textContent = verb === "sync" ? "checking…" : "working…";
  let j = {};
  try { const r = await fetch("/api/sharing/" + verb, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) }); j = await r.json(); }
  catch (e) { j = { ok: false, line: "The viewer did not answer: " + e.message }; }
  SHU.busy = false;
  if (j.state) SH = j.state;
  SHU.says[sayKey] = j.line || (j.ok ? "" : (j.error || "That did not go through."));
  return j;
}
document.addEventListener("submit", async e => {
  const f = e.target.closest && e.target.closest("form[data-shform]");
  if (!f) return;
  e.preventDefault();
  const v = n => ((f.elements[n] || {}).value || "").trim();
  const kind = f.dataset.shform;
  if (kind === "signin") {
    SHU.email = v("email");
    const body = { email: SHU.email };
    if (SHU.sent) body.code = v("code"); else if (v("invitation")) body.invitation = v("invitation");
    const j = await shPost("signin", body, "signin");
    if (!j) return;
    if (j.ok && !SHU.sent) { SHU.sent = true; shRepaint('input[name="code"]'); return; }
    if (j.ok) { SHU.sent = false; SHU.inv = false; SHU.says.me = j.line; shRepaint(); shInvitesLoad(); return; }
    shRepaint(SHU.sent ? 'input[name="code"]' : 'input[name="email"]');
    return;
  }
  if (kind === "invite") {
    const team = f.dataset.team || "", name = v("name");
    const hit = (SHU.people || []).find(p => p.name.toLowerCase() === name.toLowerCase());
    const body = { name, email: v("email") };
    if (hit) body.card = hit.slug;
    if (team) body.team = team;
    const key = team ? "row:" + team : "add";
    const j = await shPost("invite", body, key);
    if (!j) return;
    if (j.ok && j.text) {
      SHU.made = { key: team ? "team:" + team : "pair", text: j.text, line: j.line };
      SHU.says[key] = "";
      if (team) SHU.addTeam = ""; else SHU.add = false;
    }
    shRepaint(j.ok ? ".st-sent textarea" : null, j.ok);
    return;
  }
  if (kind === "join") { const j = await shPost("accept", { code: v("code") }, "join"); if (j) { if (j.ok && j.space) SHU.says["row:" + j.space] = j.line; shRepaint(); if (j.ok) shInvitesLoad(); } return; }
  if (kind === "team") { const j = await shPost("team", { name: v("name") }, "team"); if (j) shRepaint(); return; }
  if (kind === "mailbox") {
    const j = await shPost("mailbox", { name: v("name"), email: v("email") }, "mailbox");
    if (!j) return;
    if (j.ok && j.text) { SHU.made = { key: "mailbox", text: j.text, line: j.line }; SHU.says.mailbox = ""; }
    shRepaint(j.ok ? ".st-sent textarea" : null, j.ok);
    return;
  }
  if (kind === "client") { const j = await shPost("client", { on: true, client: v("client"), date: v("date") }, "client"); if (j) shRepaint(); return; }
});
document.addEventListener("click", async e => {
  const b = e.target.closest && e.target.closest("#sharing [data-sh]");
  if (!b) return;
  e.preventDefault();
  const a = b.dataset.sh, sp = b.dataset.space || "";
  if (a === "inv") { SHU.inv = true; shRepaint('input[name="invitation"]'); return; }
  if (a === "again") { SHU.sent = false; SHU.says.signin = ""; shRepaint('input[name="email"]'); return; }
  if (a === "add") { SHU.add = !SHU.add; shRepaint(SHU.add ? 'form[data-shform="invite"] input[name="name"]' : null); if (SHU.add) shPeopleLoad(); return; }
  if (a === "addto") { SHU.addTeam = SHU.addTeam === sp ? "" : sp; shRepaint(SHU.addTeam ? `form[data-team="${CSS.escape(sp)}"] input[name="name"]` : null); if (SHU.addTeam) shPeopleLoad(); return; }
  if (a === "detach-no") { delete SHU.confirm[sp]; SHU.says["row:" + sp] = "Still sharing."; shRepaint(); return; }
  if (a === "copy") {
    const t = document.querySelector("#sharing .st-sent textarea");
    if (!t) return;
    let ok = false;
    try { await navigator.clipboard.writeText(t.value); ok = true; } catch (err) { t.select(); try { ok = document.execCommand("copy"); } catch (e2) { ok = false; } }
    b.textContent = ok ? "copied" : "select and copy";
    return;
  }
  let j = null;
  if (a === "signout") { j = await shPost("signout", {}, "signin"); SHU.invites = null; }
  else if (a === "accept") j = await shPost("accept", { invite: b.dataset.invite }, "accept");
  else if (a === "detach") { j = await shPost("detach", { space: sp }, "row:" + sp); if (j && j.ok && j.confirm) SHU.confirm[sp] = j.confirm; }
  else if (a === "detach-yes") { j = await shPost("detach", { space: sp, sure: true }, "row:" + sp); delete SHU.confirm[sp]; }
  else if (a === "sync") j = await shPost("sync", {}, "client");
  else if (a === "move-here") j = await shPost("move-here", { space: sp }, "row:" + sp);
  if (!j) return;
  if (a === "accept" && j.ok) {
    SHU.invites = (SHU.invites || []).filter(x => x.id !== b.dataset.invite);
    if (j.space) SHU.says["row:" + j.space] = j.line;          // the invitations list may be gone: the line goes on the new row
  }
  shRepaint(a === "detach" && SHU.confirm[sp] ? `[data-sh="detach-yes"][data-space="${CSS.escape(sp)}"]` : null);
});
document.addEventListener("change", async e => {
  if (!e.target || e.target.id !== "sh-client") return;
  const on = e.target.checked;
  const j = await shPost("client", { on }, "client");
  if (j) shRepaint(on ? 'form[data-shform="client"] input[name="client"]' : null);
});
// the providers paint at once from ?probe=0, then the probed list fills in the one that has to be asked (the local ComfyUI)
async function loadStudio() {
  for (const qs of ["?probe=0", ""]) {
    try {
      const r = await fetch("/api/studio/providers" + qs), j = await r.json();
      if (!r.ok) { P = null; P_ERR = j.error || ("The Studio answered " + r.status); }
      else { P = j; P_ERR = ""; }
    } catch (e) { P = null; P_ERR = "Could not ask the Studio: " + e.message; }
    const old = document.getElementById("studio");
    if (old) old.outerHTML = studioGroup();
    if (P_ERR || !(P.providers || []).some(p => p.checking)) break;
  }
  if (location.hash === "#studio") { const el = document.getElementById("studio"); if (el) el.scrollIntoView({ block: "start" }); }
}
load();
</script>
</body>
