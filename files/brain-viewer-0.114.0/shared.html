<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared</title>
<link rel="stylesheet" href="/static/viewer-tokens.css">
<link rel="icon" type="image/png" href="/static/sun-favicon.png">
<style>
  /* layout only; every color and font comes from viewer-tokens.css */
  body { min-height: 100vh; }
  main { padding: 18px 34px 80px; max-width: 1180px; }
  .sd-title { margin: 4px 0 10px; font-size: 28px; line-height: 1.2; color: var(--ink); }
  .sd-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 18px; align-items: start; }
  .sd-tabs { display: flex; gap: 6px; margin: 0 0 10px; }
  .sd-tabs button[aria-selected=true] { background: var(--accent); color: var(--surface); border-color: var(--accent); }
  .sd-filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; font-size: 14px; color: var(--ink-soft); align-items: center; }
  .sd-filters select { font: inherit; font-size: 14px; padding: 3px 6px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); color: var(--ink); }
  ul.sd-rows { list-style: none; margin: 0; padding: 0; }
  li.sd-row { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; padding: 8px 2px; border-top: 1px solid var(--rule-soft); }
  li.sd-row:first-child { border-top: 0; }
  .sd-kind { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .sd-name { color: var(--ink); overflow-wrap: anywhere; min-width: 0; }
  .sd-meta { display: block; font-size: 13px; color: var(--ink-soft); overflow-wrap: anywhere; }
  .sd-acts { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: baseline; justify-content: flex-end; }
  .sd-say { font-size: 13px; color: var(--ink-soft); }
  .sd-say:empty { display: none; }
  aside.sd-side { padding: 12px 14px; }
  aside.sd-side h2 { margin: 0 0 8px; font-family: var(--font-display); font-size: 17px; font-weight: normal; }
  aside.sd-side ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  aside.sd-side li { overflow-wrap: anywhere; }
  .sd-empty { color: var(--ink-soft); font-size: 15px; margin: 8px 0; }
  @media (max-width: 760px) {
    main { padding: 14px 16px 60px; }
    .sd-title { font-size: 24px; }
    .sd-wrap { grid-template-columns: minmax(0, 1fr); }
    li.sd-row { grid-template-columns: minmax(0, 1fr); }
    .sd-acts { justify-content: flex-start; }
  }
</style>
</head>
<body>
<header class="bar">
  <img class="mark" src="/static/sun-mark.png" alt="" width="36" height="28">
  <h1>Shared</h1>
  <span class="spacer"></span>
  <nav class="panels" data-page="shared"></nav>
</header>
<main id="main" class="no-gloss"><p class="meta">Reading what is shared…</p></main>
<script src="/static/viewer-common.js"></script>
<script>
// /shared (0.113.0): everything shared with this person and everything they shared, across every person and team brain,
// from GET /api/sharing/all (the engine's view of each space, and the team copy's rows). Shared with me: newest first, one
// row each, new until opened, one press to open it where it lives; filter by person and by kind. Shared by me: with whom,
// when, whether a change is held back, and Stop sharing (the Share box's route). The team brains sit at the side.
const esc = BV.esc, $ = s => document.querySelector(s);
let D = null, TAB = (location.hash === "#by-me") ? "by" : "with", WHO = "", KIND = "", SAY = {}, LAST = "";
const KINDS = { task: "task", question: "question", file: "file", thread: "thread", drawing: "drawing", "card-section": "card section" };
// a day with no time (2026-11-10) is that day here, never midnight in London, which drew the day before (found 2026-11-10)
const md = iso => { const s = String(iso || ""), m = /^([0-9]{4})-([0-9]{2})-([0-9]{2})$/.exec(s); const d = m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(s);
  return isNaN(d) ? "" : d.toLocaleDateString([], { month: "short", day: "numeric" }); };
const keyOf = r => `${r.space}|${r.kind}|${r.path || (r.project + "/" + r.id)}`;
function openHref(r) {
  if ((r.kind === "task" || r.kind === "question") && r.project && r.id) return `/thread?item=${encodeURIComponent(r.project)}/${encodeURIComponent(r.id)}`;
  if (r.kind === "file" && r.path) return BV.readerHref(r.path);
  if (r.kind === "thread" && r.path) return `/thread?subject=${encodeURIComponent(r.path)}`;
  if (r.kind === "drawing" && r.path) return BV.forgeHref(r.path);
  if (r.kind === "card-section" && r.path) return `/people?open=${encodeURIComponent(String(r.path).split("#")[0].replace(/^people\//, "").replace(/\.md$/, ""))}`;
  return "";
}
function rowsWith() {
  return (D.withMe || []).filter(r => !r.taken_back && (!WHO || r.with === WHO) && (!KIND || r.kind === KIND)).map(r => {
    const h = openHref(r), fresh = r.id && !r.opened && ["file", "thread", "drawing"].includes(r.kind);
    return `<li class="sd-row"><span class="sd-kind">${esc(KINDS[r.kind] || r.kind)}</span>
      <span class="sd-name">${fresh ? `<span class="badge new">new</span> ` : ""}${esc(r.title || "(untitled)")}<span class="sd-meta">from <a href="/share?space=${encodeURIComponent(r.space)}">${esc(r.from || r.with)}</a>${r.from && r.with && r.from !== r.with ? ` in ${esc(r.with)}` : ""}${r.at ? " · " + esc(md(r.at)) : ""}</span></span>
      <span class="sd-acts">${h ? `<a class="btn" href="${esc(h)}"${fresh ? ` data-opened="${esc(r.id)}" data-space="${esc(r.space)}"` : ""}>open</a>` : ""}</span></li>`;
  });
}
function rowsBy() {
  return (D.byMe || []).filter(r => (!WHO || r.with === WHO) && (!KIND || r.kind === KIND)).map(r => {
    const h = openHref(r), k = keyOf(r);
    return `<li class="sd-row"><span class="sd-kind">${esc(KINDS[r.kind] || r.kind)}</span>
      <span class="sd-name">${esc(r.title || "(untitled)")}<span class="sd-meta">with <a href="/share?space=${encodeURIComponent(r.space)}">${esc(r.with)}</a>${r.at ? " · " + esc(md(r.at)) : ""}${r.held ? ` · a change is held back: ${esc(r.why || "it did not pass what may be shared")}` : ""}</span><span class="sd-say" data-say="${esc(k)}" aria-live="polite">${esc(SAY[k] || "")}</span></span>
      <span class="sd-acts">${h ? `<a class="btn" href="${esc(h)}">open</a>` : ""}${r.detached ? "" : `<button type="button" class="btn" data-stop="${esc(k)}">Stop sharing</button>`}</span></li>`;
  });
}
function paint() {
  const list = TAB === "with" ? (D.withMe || []) : (D.byMe || []);
  const people = [...new Set(list.map(r => r.with).filter(Boolean))].sort();
  const kinds = [...new Set(list.map(r => r.kind))];
  if (WHO && !people.includes(WHO)) WHO = "";
  if (KIND && !kinds.includes(KIND)) KIND = "";
  const rows = TAB === "with" ? rowsWith() : rowsBy();
  const teams = D.teams || [];
  $("#main").innerHTML = `<h2 class="sd-title">Shared</h2>
    <div class="sd-wrap"><div>
      <div class="sd-tabs" role="tablist"><button type="button" class="btn" role="tab" data-tab="with" aria-selected="${TAB === "with"}">Shared with me <span class="meta">${(D.withMe || []).filter(r => !r.taken_back).length}</span></button><button type="button" class="btn" role="tab" data-tab="by" aria-selected="${TAB === "by"}">Shared by me <span class="meta">${(D.byMe || []).length}</span></button></div>
      <p class="sd-say" aria-live="polite">${esc(LAST)}</p>
      ${list.length ? `<div class="sd-filters"><label>person <select data-f="who"><option value="">everyone</option>${people.map(p => `<option${p === WHO ? " selected" : ""}>${esc(p)}</option>`).join("")}</select></label>
        <label>kind <select data-f="kind"><option value="">everything</option>${kinds.map(k => `<option value="${esc(k)}"${k === KIND ? " selected" : ""}>${esc(KINDS[k] || k)}</option>`).join("")}</select></label></div>` : ""}
      <section class="card" style="padding:8px 14px">${rows.length ? `<ul class="sd-rows">${rows.join("")}</ul>`
        : `<p class="sd-empty">${TAB === "with" ? "Nothing has been shared with you yet." : "You have not shared anything yet. The Share press on a task, a file, a thread or a drawing starts it."}</p>`}</section>
    </div>
    ${teams.length ? `<aside class="card sd-side"><h2>Team brains</h2><ul>${teams.map(t => `<li><a href="/share?space=${encodeURIComponent(t.space)}">${esc(t.label)}</a><span class="sd-meta">${esc((t.people || []).join(", ") || "nobody yet")}</span></li>`).join("")}</ul></aside>` : ""}
    </div>`;
}
async function load() {
  let r, j = {};
  try { r = await fetch("/api/sharing/all"); j = await r.json(); } catch (e) { $("#main").innerHTML = `<p class="note">Could not read what is shared: ${esc(e.message)}</p>`; return; }
  if (!r.ok || j.ok === false) { $("#main").innerHTML = `<p class="note">${esc(j.line || j.error || "Nothing is shared from this copy.")}</p>`; return; }
  D = j; paint();
}
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab]");
  if (t) { TAB = t.dataset.tab; history.replaceState(null, "", TAB === "by" ? "#by-me" : location.pathname); return paint(); }
  const s = e.target.closest("[data-stop]");
  if (!s) return;
  e.preventDefault();
  const r = (D.byMe || []).find(x => keyOf(x) === s.dataset.stop);
  if (!r) return;
  const kind = r.kind === "card-section" ? "section" : r.kind;
  const body = { action: "stop", space: r.space, kind };
  if (kind === "task" || kind === "question") Object.assign(body, { project: r.project, id: r.id });
  else if (kind === "section") Object.assign(body, { card: String(r.path || "").split("#")[0], heading: String(r.path || "").split("#").slice(1).join("#") });
  else body.path = r.path;
  s.disabled = true;
  let j = {};
  try { const res = await fetch("/api/sharing/access", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); j = await res.json(); }
  catch (err) { j = { ok: false, line: err.message }; }
  SAY[s.dataset.stop] = LAST = j.line || (j.ok ? "Stopped." : "That did not go through.");
  if (j.ok) await load(); else paint();
});
document.addEventListener("change", e => {
  const f = e.target.closest("select[data-f]");
  if (!f) return;
  if (f.dataset.f === "who") WHO = f.value; else KIND = f.value;
  paint();
});
load();
</script>
</body>
</html>
