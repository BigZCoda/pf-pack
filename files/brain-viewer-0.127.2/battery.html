<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battery</title>
<link rel="stylesheet" href="/static/viewer-tokens.css">
<link rel="icon" type="image/png" href="/static/sun-favicon.png">
<style>
  /* layout only; every color and font comes from viewer-tokens.css */
  body { min-height: 100vh; }
  main { padding: 14px 34px 80px; max-width: 1240px; }
  .bt-title { margin: 4px 0 2px; font-size: 28px; line-height: 1.2; color: var(--ink); }
  .bt-sub { margin: 0 0 12px; font-size: 14px; color: var(--ink-soft); }
  /* 0.116.0: the turn line, at the top while the page scrolls */
  .bt-turn { position: sticky; top: 0; z-index: 5; margin: 0 0 16px; background: var(--surface); border: 1px solid var(--rule-soft);
    border-left: 4px solid var(--accent); border-radius: var(--radius-lg); padding: 10px 14px; box-shadow: 0 1px 0 var(--rule-soft); }
  .bt-turn.late { border-left-color: var(--danger); }
  .bt-turn.none { border-left-color: var(--rule); }
  .bt-turn .ln { font-family: var(--font-display); font-size: 18px; line-height: 1.3; color: var(--ink); overflow-wrap: anywhere; }
  .bt-turn .pl { font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
  .bt-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
  .bt-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .bt-card { background: var(--surface); border: 1px solid var(--rule-soft); border-radius: var(--radius-lg); padding: 12px 16px 12px; min-width: 0; }
  .bt-card h2 { margin: 0 0 6px; font-family: var(--font-display); font-size: 19px; font-weight: normal; }
  .bt-card .meta { margin: 0 0 8px; }
  ul.bt-rows { list-style: none; margin: 0; padding: 0; }
  ul.bt-rows > li { padding: 8px 0; border-top: 1px solid var(--rule-soft); }
  ul.bt-rows > li:first-child { border-top: 0; }
  /* 0.122.0: a question to you is answered here, its choices and a box, never only a link to its thread. 0.127.0: it is
     the task card (BV.card, styled in viewer-tokens.css), in its own list under the requests for you */
  .bt-foryou ul.tcs { margin: 8px 0 0; }
  .bt-foryou .bt-say { margin: 6px 0 0; }
  .bt-req { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; cursor: pointer; }
  .bt-req .what { color: var(--ink); overflow-wrap: anywhere; min-width: 0; }
  .bt-req .how { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-soft); overflow-wrap: anywhere; }
  .bt-req.on .what { color: var(--accent); }
  .bt-id { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-right: 6px; }
  .bt-badge { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--rule); border-radius: 3px; padding: 0 5px; color: var(--muted); white-space: nowrap; }
  .bt-badge.wait { border-color: var(--accent); color: var(--accent); }
  .bt-badge.late, .bt-badge.you { border-color: var(--danger); color: var(--danger); }
  .bt-badge.ok { border-color: var(--done); color: var(--done); }
  ol.bt-talk { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  li.bt-note { background: var(--surface); border: 1px solid var(--rule-soft); border-radius: var(--radius-lg); padding: 10px 14px 12px; max-width: 88%; }
  li.bt-note.from-claude { align-self: flex-end; border-color: color-mix(in srgb, var(--accent) 35%, var(--rule-soft)); }
  li.bt-note.from-owner { align-self: center; max-width: 94%; border-style: dashed; }
  .bt-head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: 13px; color: var(--ink-soft); margin: 0 0 6px; }
  .bt-who { font-family: var(--font-display); font-size: 15px; color: var(--ink); }
  .bt-re { color: var(--ink); overflow-wrap: anywhere; }
  .bt-body { font-size: 14.5px; line-height: 1.5; color: var(--ink); overflow-wrap: anywhere; }
  .bt-body.folded { max-height: 15.5em; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent); mask-image: linear-gradient(to bottom, #000 70%, transparent); }
  .bt-body pre, .bt-body code { white-space: pre-wrap; overflow-wrap: anywhere; }
  .bt-more { margin-top: 4px; font-size: 13px; }
  .bt-notes-h { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; margin: 6px 0 10px; }
  .bt-notes-h h2 { margin: 0; font-family: var(--font-display); font-size: 19px; font-weight: normal; }
  .bt-board { font-size: 13px; overflow-x: auto; }
  .bt-board table { border-collapse: collapse; width: 100%; }
  .bt-board th, .bt-board td { border-top: 1px solid var(--rule-soft); padding: 4px 6px; text-align: left; vertical-align: top; }
  .bt-write { margin-top: 18px; background: var(--surface); border: 1px solid var(--rule-soft); border-radius: var(--radius-lg); padding: 12px 14px 14px; }
  .bt-write h2 { margin: 0 0 8px; font-family: var(--font-display); font-size: 17px; font-weight: normal; }
  .bt-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 0 0 8px; font-size: 14px; color: var(--ink-soft); }
  .bt-row select, .bt-row input { font: inherit; font-size: 14px; padding: 3px 6px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); color: var(--ink); max-width: 100%; }
  .bt-row input[name=re] { flex: 1 1 220px; min-width: 0; }
  .bt-write textarea { width: 100%; box-sizing: border-box; min-height: 6.5em; font: inherit; font-size: 14.5px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); color: var(--ink); }
  .bt-say { font-size: 13px; color: var(--ink-soft); min-height: 1.2em; }
  .bt-say.err { color: var(--danger); }
  .bt-empty { color: var(--ink-soft); font-size: 14.5px; margin: 0; }
  /* what the battery made: the register (0.117.0), newest first */
  li.bt-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: baseline; }
  .bt-iname { color: var(--ink); overflow-wrap: anywhere; min-width: 0; }
  .bt-imeta { display: block; font-size: 12.5px; color: var(--ink-soft); overflow-wrap: anywhere; }
  .bt-ititle { font-family: var(--font-display); font-size: 16px; color: var(--ink); }
  .bt-iparts { display: block; font-size: 13px; margin-top: 3px; }
  .bt-iparts a { margin-right: 10px; }
  .bt-iline { display: block; font-size: 13.5px; color: var(--ink); margin-top: 1px; overflow-wrap: anywhere; }
  .bt-new.wait { color: var(--danger); border-color: var(--danger); }
  .bt-imeta code { font-size: 11.5px; }
  .bt-new { font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 0 4px; margin-right: 6px; vertical-align: 1px; }
  .bt-drawer { margin: 10px 0 0; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--bg); padding: 10px 12px; max-height: 60vh; overflow: auto; }
  .bt-drawer .dh { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; margin: 0 0 8px; font-size: 13px; color: var(--ink-soft); }
  .bt-drawer pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; margin: 0; }
  details.bt-fold { margin-top: 16px; }
  /* 0.119.0: the run */
  .bt-runname { margin: 0 0 4px; font-family: var(--font-display); font-size: 16px; }
  .bt-runline { margin: 0 0 4px; font-size: 13.5px; color: var(--ink); overflow-wrap: anywhere; }
  .bt-runline .kicker { margin-right: 4px; font-size: 10px; }
  details.bt-fold > summary { cursor: pointer; font-family: var(--font-display); font-size: 17px; color: var(--ink); }
  @media (max-width: 860px) {
    main { padding: 10px 16px 60px; }
    .bt-title { font-size: 24px; }
    .bt-grid { grid-template-columns: minmax(0, 1fr); }
    .bt-turn { padding: 7px 11px; margin-bottom: 12px; }
    .bt-turn .ln { font-size: 14.5px; line-height: 1.3; }
    .bt-turn .pl { font-size: 12px; margin-top: 2px; }
    li.bt-note, li.bt-note.from-claude, li.bt-note.from-owner { max-width: 100%; align-self: stretch; }
    .bt-made { order: 2; } .bt-foryou { order: 1; } .bt-open { order: 3; } .bt-run { order: 4; }
    .bt-col { display: contents; }
  }
</style>
</head>
<body>
<header class="bar">
  <img class="mark" src="/static/sun-mark.png" alt="" width="36" height="28">
  <h1>Battery</h1>
  <span class="spacer"></span>
  <nav class="panels" data-page="battery"></nav>
</header>
<main id="main" class="no-gloss"><p class="meta">Reading the battery…</p></main>
<script src="/static/viewer-common.js"></script>
<script src="/static/attach.js"></script>
<script>
// /battery (0.115.0; 0.116.0 round one of the battery's design, 0.117.0 round two: what it made from the register, brain-viewer-holon/design-directions/battery-2026-11-12.md).
// Two agents lined up on one file: this brain's Claude sessions and a partner agent on its own machine, on one mailbox.
// Top to bottom: whose turn it is (one line, computed from the open requests, the warning color when one is late) with
// the partner's state; what waits on you; what the battery made, newest first; the open requests, each a press that shows
// only its notes; then everything they wrote each other, the box to write to either, and the old board folded.
// From GET /api/battery, every 15 seconds while the box is empty.
const esc = BV.esc, $ = s => document.querySelector(s);
let D = null, OPEN = new Set(), SAY = "", SAYERR = false, ONLY = "", THREAD = null, ALLMADE = false, DRAWER = null, QSAY = "";
const who = k => !D ? (k || "someone") : k === "claude" ? "Claude" : k === D.partner ? (D.partnerName || "your partner agent") : k === D.owner ? "you" : (k || "someone");
const Who = k => { const w = who(k); return w.charAt(0).toUpperCase() + w.slice(1); };
const when = iso => { const d = new Date(iso); if (isNaN(d)) return "";
  const today = new Date().toDateString() === d.toDateString();
  const t = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }).toLowerCase().replace(" ", "");
  return today ? t : d.toLocaleDateString([], { month: "short", day: "numeric" }) + ", " + t; };
const STATE_WORDS = { submitted: "waiting", working: "being worked on", "input-required": "waits on you", completed: "answered",
  failed: "failed", canceled: "canceled", rejected: "turned down" };
// the note's own words without its header lines (from, to, re, needs, by, request, state), which the card already says
function bodyOf(text) {
  const lines = String(text || "").replace(/\r\n/g, "\n").split("\n");
  let i = 0;
  while (i < lines.length && (!lines[i].trim() || lines[i].trim().startsWith("```"))) i++;
  while (i < lines.length && /^\s*[a-z]+\s*:/i.test(lines[i]) && lines[i].trim()) i++;
  while (i < lines.length && (!lines[i].trim() || lines[i].trim().startsWith("```"))) i++;
  return lines.slice(i).join("\n");
}
function turnHTML() {
  const T = D.turn || {};
  const cls = !T.turn ? " none" : T.late ? " late" : "";
  return `<section class="bt-turn${cls}" aria-live="polite"><div class="ln">${esc(T.line || "Nothing is waiting on either side.")}</div>
    <div class="pl">${esc(T.partnerLine || "")}</div></section>`;
}
// what waits on you: a request that needs your answer, and the battery's open questions to you on its thread
function forYouHTML() {
  const mine = ((D.turn || {}).open || []).filter(r => r.holder === D.owner);
  const qs = THREAD ? (THREAD.items || []).filter(r => r.kind === "question" && r.mark === "?" && String(r.to || "").replace("@", "") === D.owner) : [];
  if (!mine.length && !qs.length) return "";
  const href = D.thread && D.thread.href;
  // 0.122.0 (the owner's note on this page that day: "can they please show up as question objects rather than just
  // links?"): each question is answered here, its named choices as presses and a box for his own words, the same press
  // the thread page makes (PUT /api/tasks, action answer). 0.127.0: each is the task card every page draws (BV.card), its
  // presses BV.card.wire's: no raw id on its face (the id is in its corner menu), its pictures on its choices, and its
  // workspace press, which opens the item with its thread; what a press did is said under the list, never in an alert
  const qrow = r => BV.card(r, { project: r.project });
  const rrow = r => `<li class="bt-req" data-req="${esc(r.id)}"><span class="what"><span class="bt-id">${esc(r.id)}</span>${esc(r.re)}</span><span class="bt-badge you">for you</span>
    <span class="how">${r.question ? `answer it as ${esc(r.question)} · ` : ""}waiting ${esc(r.age)}</span></li>`;
  // at phone width three, so what the battery made is not pushed a screen down
  const lim = window.matchMedia("(max-width: 860px)").matches ? 3 : 8;
  return `<section class="bt-card bt-foryou"><h2>For you</h2>
    <p class="meta">${qs.length ? `${qs.length} question${qs.length === 1 ? "" : "s"} on the battery wait on you; answer each here.` : ""}</p>
    ${mine.length ? `<ul class="bt-rows">${mine.map(rrow).join("")}</ul>` : ""}${qs.length ? `<ul class="tcs">${qs.slice(0, lim).map(qrow).join("")}</ul>` : ""}
    ${QSAY ? `<p class="bt-say" aria-live="polite">${esc(QSAY)}</p>` : ""}
    ${qs.length > lim && href ? `<p class="meta" style="margin-top:6px"><a href="${esc(href)}">all ${qs.length} on the thread</a></p>` : ""}</section>`;
}
function openHTML() {
  const T = D.turn || {}, open = (T.open || []).filter(r => r.holder !== D.owner), closed = T.closed || [];
  const row = r => {
    const st = STATE_WORDS[r.state] || r.state;
    const badge = r.late ? `<span class="bt-badge late">late</span>` : r.state === "working" ? `<span class="bt-badge ok">working</span>` : `<span class="bt-badge wait">${esc(who(r.holder))}</span>`;
    return `<li class="bt-req${ONLY === r.id ? " on" : ""}" data-req="${esc(r.id)}" title="show only the notes on ${esc(r.id)}"><span class="what"><span class="bt-id">${esc(r.id)}</span>${esc(r.re)}</span>${badge}
      <span class="how">${esc(Who(r.from))} asked ${esc(who(r.to))} for ${esc(r.needs.startsWith("decision-for-") ? "a decision for you" : "a" + (/^[aeiou]/.test(r.needs) ? "n " : " ") + r.needs)}, ${esc(when(r.createdAt))} · ${esc(st)}, ${esc(r.age)}${r.filed ? " · filed but not answered" : ""}${r.owner ? " · with the session " + esc(r.owner) : ""}</span></li>`;
  };
  const crow = r => `<li class="bt-req${ONLY === r.id ? " on" : ""}" data-req="${esc(r.id)}"><span class="what"><span class="bt-id">${esc(r.id)}</span>${esc(r.re)}</span><span class="bt-badge">${esc(STATE_WORDS[r.state] || r.state)}</span>
      <span class="how">${esc(Who(r.to))}, ${esc(when(r.closedAt || r.createdAt))}</span></li>`;
  return `<section class="bt-card bt-open"><h2>Open requests</h2>
    ${open.length ? `<ul class="bt-rows">${open.map(row).join("")}</ul>` : `<p class="bt-empty">None open. Every request either side made is answered.</p>`}
    ${closed.length ? `<details class="bt-fold" style="margin-top:10px"><summary class="meta" style="font-family:inherit;font-size:13px">Closed lately (${closed.length})</summary><ul class="bt-rows">${closed.map(crow).join("")}</ul></details>` : ""}</section>`;
}
// The run (0.119.0): the open run's brief (its goal in your words, what done means, its parts and who has each), what
// was made in it, and where its minutes went, from the request records; earlier runs folded, each opening its file.
function runHTML() {
  const R = D.runs || {}, cur = R.current, earlier = R.earlier || [];
  if (!cur && !earlier.length) return "";
  const mins = m => m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`;
  const went = cur && cur.minutes ? cur.minutes.held.filter(h => h.minutes > 0).map(h => `${esc(h.who)} ${mins(h.minutes)}`).join(" · ") : "";
  const late = cur && cur.minutes && cur.minutes.lateMinutes ? `, ${mins(cur.minutes.lateMinutes)} of it past its time` : "";
  const parts = cur && cur.parts ? `<p class="bt-runline"><span class="kicker">parts</span> ${esc(cur.parts)}</p>` : "";
  const madeList = cur && cur.madeRows && cur.madeRows.length
    ? `<ul class="bt-rows">${cur.madeRows.map(m => `<li><span class="bt-id">${esc(m.id)}</span>${esc(m.title || "")} <span class="meta">${esc(m.maker || "")}</span></li>`).join("")}</ul>`
    : "";
  const now = cur ? `<p class="bt-runname"><a href="${esc(BV.readerHref(cur.path))}">${esc(cur.title)}</a></p>
      <p class="bt-runline"><span class="kicker">goal</span> ${esc(cur.goal || "")}</p>
      <p class="bt-runline"><span class="kicker">done means</span> ${esc(cur.done || "")}</p>
      ${parts}
      <p class="meta">Opened ${esc(when(cur.opened))} · ${cur.made} made in it${went ? ` · held: ${went}${late}` : ""}</p>
      ${madeList}`
    : `<p class="bt-empty">No run is open.</p>`;
  const prev = earlier.length ? `<details class="bt-fold" style="margin-top:8px"><summary class="meta" style="font-family:inherit;font-size:13px">Earlier runs (${earlier.length})</summary>
      <ul class="bt-rows">${earlier.map(r => `<li><a href="${esc(BV.readerHref(r.path))}">${esc(r.title)}</a> <span class="meta">${esc(when(r.opened))} to ${esc(when(r.closed))} · ${r.made} made</span></li>`).join("")}</ul></details>` : "";
  return `<section class="bt-card bt-run"><h2>The run</h2>${now}${prev}</section>`;
}
function noteHTML(n) {
  const waiting = n.folder !== "done", body = bodyOf(n.text), long = body.split("\n").length > 14 || body.length > 1400, open = OPEN.has(n.file);
  const fromCls = n.from === "claude" ? "claude" : n.from === D.owner ? "owner" : "partner";
  const badge = (n.needs || "").startsWith("decision-for-") ? `<span class="bt-badge you">for you</span>` : n.needs ? `<span class="bt-badge">${esc(n.needs)}</span>` : "";
  const to = n.to || (n.folder === "to-claude" ? "claude" : n.folder === "to-" + D.partner ? D.partner : "");
  return `<li class="bt-note from-${fromCls}" data-file="${esc(n.file)}">
    <div class="bt-head"><span class="bt-who">${esc(Who(n.from))} to ${esc(who(to))}</span>
      <span>${esc(when(n.at))}</span>${n.request ? `<span class="bt-id" title="the request this note is on">${esc(n.request)}${n.state ? " · " + esc(STATE_WORDS[n.state] || n.state) : ""}</span>` : ""}${badge}${waiting ? `<span class="bt-badge wait" title="still in ${esc(n.folder)}/, not filed yet">unread</span>` : ""}
      ${n.re ? `<span class="bt-re">${esc(n.re)}</span>` : ""}</div>
    <div class="bt-body${long && !open ? " folded" : ""}">${BV.md(body)}</div>
    ${long ? `<div class="bt-more"><button type="button" class="btn quiet" data-fold="${esc(n.file)}">${open ? "less" : "the whole note"}</button></div>` : ""}</li>`;
}
// What the battery made (0.117.0): the register, newest first, read from context/battery-register.jsonl. Each row: its
// title (a press opens it in the Reader; a release row points at the what's-new page), one line on what it is, who made
// it, its review and where it was tested, and new since you last looked. A file the partner offered and no Claude session
// has landed yet reads waiting to be landed, and opens in the drawer here.
const KIND_WORDS = { document: "document", draft: "draft", review: "review", patch: "patch", release: "viewer release", "test-run": "test run", research: "research" };
const REVIEW_WORDS = { none: "", asked: "review asked", passed: "reviewed", changes: "changes asked" };
let LASTLOOK = null;
try { LASTLOOK = localStorage.getItem("battery-last-look"); } catch (e) { LASTLOOK = null; }
function lookedNow() { try { localStorage.setItem("battery-last-look", new Date().toISOString().slice(0, 19)); } catch (e) { /* a private window keeps no mark */ } }
function madeHTML() {
  const rows = D.made || [], prop = D.proposed || [];
  const lim = window.matchMedia("(max-width: 860px)").matches ? 6 : 12;   // a phone shows six, so the open requests are not pages down
  const shown = ALLMADE ? rows : rows.slice(0, lim);
  const isNew = r => LASTLOOK && String(r.at || "") > LASTLOOK;
  const row = r => {
    // 0.120.0: every part of a piece one press away: the file, its notes, its run, its release note
    const runs = [(D.runs || {}).current].concat((D.runs || {}).earlier || []).filter(Boolean);
    const run = r.run ? runs.find(x => x.id === r.run) : null;
    const parts = [r.exists && r.path ? `<a href="${esc(BV.readerHref(r.path))}">open it</a>` : "",
      r.request ? `<a href="#notes" data-req="${esc(r.request)}">its notes</a>` : "",
      run ? `<a href="${esc(BV.readerHref(run.path))}">the run</a>` : "",
      r.kind === "release" ? `<a href="${esc(BV.readerHref("brain-viewer-holon/brain-viewer-whats-new.md"))}">the release note</a>` : ""].filter(Boolean);
    const open = r.exists && r.path ? `<button type="button" class="btn" data-go="${esc(BV.readerHref(r.path))}">open</button>` : "";
    const checker = r.maker === "claude" ? (D.partnerName || "your partner agent") : "Claude";
    const bits = [`made by ${who(r.maker)}`, when(r.at), KIND_WORDS[r.kind] || r.kind, r.review === "passed" ? `checked by ${checker}` : REVIEW_WORDS[r.review] || "",
      r.tested && r.tested !== "not tested" ? r.tested + (r.evidence ? ` (${r.evidence})` : "") : "",
      r.request ? r.request : ""].filter(Boolean);
    return `<li class="bt-item"><span class="bt-iname">${isNew(r) ? `<span class="bt-new">new</span>` : ""}<span class="bt-ititle">${esc(r.title)}</span>
      <span class="bt-iline">${esc(r.line || "")}</span>
      <span class="bt-imeta">${bits.map(esc).join(" · ")}${r.version ? ` · viewer ${esc(r.version)}` : ""}</span>
      ${parts.length ? `<span class="bt-iparts">${parts.join("")}</span>` : ""}</span>
      <span>${open}</span></li>`;
  };
  const prow = p => `<li class="bt-item"><span class="bt-iname"><span class="bt-new wait">to land</span><span class="bt-ititle">${esc(p.title)}</span>
      <span class="bt-imeta">offered by ${esc(who(p.maker))} · ${esc(when(p.at))} · waiting for Claude to land it in the brain · <code>${esc("mailbox/" + p.from)}</code></span></span>
      <span><button type="button" class="btn" data-mailbox="${esc(p.from)}">open</button></span></li>`;
  const drawer = DRAWER ? `<div class="bt-drawer"><div class="dh"><code>${esc(DRAWER.path)}</code><button type="button" class="btn quiet" data-close>close</button></div>${DRAWER.kind === "patch" ? `<pre>${esc(DRAWER.text)}</pre>` : `<div class="bt-body">${BV.md(DRAWER.text)}</div>`}</div>` : "";
  const fresh = rows.filter(isNew).length;
  return `<section class="bt-card bt-made"><h2>What got done</h2>
    <p class="meta">${rows.length ? `${rows.length} thing${rows.length === 1 ? "" : "s"}, newest first${fresh ? `; ${fresh} new since you last looked` : ""}. Each says who made it, whether the other checked it, and where it was tested.` : "Nothing on the list yet."}</p>
    ${prop.length ? `<ul class="bt-rows">${prop.map(prow).join("")}</ul>` : ""}
    ${rows.length ? `<ul class="bt-rows">${shown.map(row).join("")}</ul>` : ""}${rows.length > lim ? `<p class="meta" style="margin-top:6px"><button type="button" class="btn quiet" data-allmade>${ALLMADE ? "only the newest" : `all ${rows.length}`}</button></p>` : ""}${drawer}</section>`;
}
function wire() {
  const $$ = sel => $("#main").querySelectorAll(sel);   // 0.127.0: the page's own parts only, never a card's or a dialog's
  $$("[data-mailbox]").forEach(b => b.onclick = async () => {
    try { const j = await (await fetch("/api/battery/file?path=" + encodeURIComponent(b.dataset.mailbox))).json(); DRAWER = j.error ? { path: b.dataset.mailbox, text: j.error, kind: "text" } : j; }
    catch (e) { DRAWER = { path: b.dataset.mailbox, text: "the viewer did not answer", kind: "text" }; }
    paint(); const d = document.querySelector(".bt-drawer"); if (d) d.scrollIntoView({ block: "nearest" });
  });
  $$("[data-go]").forEach(b => b.onclick = () => { location.href = b.dataset.go; });
  const c = document.querySelector("[data-close]"); if (c) c.onclick = () => { DRAWER = null; paint(); };
  const a = document.querySelector("[data-allmade]"); if (a) a.onclick = () => { ALLMADE = !ALLMADE; paint(); };
  $$("[data-req]").forEach(li => li.onclick = () => {
    ONLY = ONLY === li.dataset.req ? "" : li.dataset.req; paint();
    if (ONLY) toNotes();
  });
  const all = document.querySelector("[data-allnotes]"); if (all) all.onclick = () => { ONLY = ""; paint(); };
  $$("[data-fold]").forEach(b => b.onclick = () => { const f = b.dataset.fold; OPEN.has(f) ? OPEN.delete(f) : OPEN.add(f); paint(); });
}
function paint() {
  if (!D) return;
  if (!D.enabled) { $("#main").innerHTML = `<h2 class="bt-title">Battery</h2><p class="bt-empty">There is no battery on this computer: ${esc(D.why || "")}.</p>`; return; }
  const draft = document.querySelector(".bt-write textarea"), keep = draft ? { to: $("[name=to]").value, re: $("[name=re]").value, needs: $("[name=needs]").value, text: draft.value } : null;
  // newest first, like what they made: the latest exchange is what you came to read; one request's notes read in order
  const notes = (D.notes || []).filter(n => !ONLY || n.request === ONLY).slice();
  if (!ONLY) notes.reverse();
  const desk = D.desk || {}, pname = D.partnerName || "your partner agent";
  const deskLine = desk.on ? `The battery desk session is on (checked ${esc(when(desk.at))}): it passes each note from ${esc(pname)} to the session that holds the task.`
    : `The battery desk session is off${desk.at ? ` (last seen ${esc(when(desk.at))})` : ""}, so a note to Claude goes to the main session.`;
  $("#main").innerHTML = `<h2 class="bt-title">Battery</h2>
    <p class="bt-sub">${esc(pname)} and Claude, lined up on one file. ${deskLine}${D.thread ? ` The battery's thread: <a href="${esc(D.thread.href)}">where it stands</a>.` : ""}</p>
    ${turnHTML()}
    <div class="bt-grid"><div class="bt-col">${madeHTML()}</div><div class="bt-col side">${forYouHTML()}${openHTML()}${runHTML()}</div></div>
    <div id="notes"><div class="bt-notes-h"><h2>${ONLY ? `The notes on ${esc(ONLY)}, in order` : "What they wrote each other, newest first"}</h2>${ONLY ? `<button type="button" class="btn quiet" data-allnotes>every note</button>` : ""}</div>
      ${notes.length ? `<ol class="bt-talk">${notes.map(noteHTML).join("")}</ol>` : `<p class="bt-empty">No notes yet.</p>`}
      <form class="bt-write" autocomplete="off"><h2>Write to either</h2>
        <div class="bt-row"><label>to <select name="to"><option value="claude">Claude</option><option value="${esc(D.partner)}">${esc(pname)}</option></select></label>
          <label>needs <select name="needs"><option value="fyi">fyi</option><option value="answer">an answer</option><option value="review">a review</option><option value="build">a build</option></select></label>
          <input name="re" placeholder="what it is about" maxlength="160"></div>
        <textarea name="text" class="grow" placeholder="Plain words. Link a brain file by its path."></textarea>
        <div class="bt-row"><button type="submit" class="press go">Send</button><span class="bt-say${SAYERR ? " err" : ""}" aria-live="polite">${esc(SAY)}</span></div>
      </form>
      ${D.board ? `<details class="bt-fold"><summary>The board, as the two agents kept it by hand</summary><div class="bt-board">${BV.md(D.board.replace(/^#[^\n]*\n/, ""))}</div></details>` : ""}
      <details class="bt-fold"><summary>Where it lives</summary><ul class="meta"><li><code>${esc(D.folder)}</code></li><li>The rules: <a href="${BV.readerHref("skills/battery/readme.md")}">skills/battery/readme.md</a></li></ul></details>
    </div>`;
  if (keep) { $("[name=to]").value = keep.to; $("[name=re]").value = keep.re; $("[name=needs]").value = keep.needs; $(".bt-write textarea").value = keep.text; }
  wire();
  $(".bt-write").onsubmit = async e => {
    e.preventDefault();
    const body = { to: $("[name=to]").value, needs: $("[name=needs]").value, re: $("[name=re]").value.trim(), text: $(".bt-write textarea").value.trim() };
    if (!body.text) { SAY = "Write the note first."; SAYERR = true; paint(); return; }
    try {
      const r = await fetch("/api/battery/note", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || ("answered " + r.status));
      SAY = `Sent to ${who(body.to)}.`; SAYERR = false; $(".bt-write textarea").value = ""; $("[name=re]").value = "";
      load();
    } catch (err) { SAY = err.message; SAYERR = true; paint(); }
  };
}
let LOOKED = false;
// one request's notes, scrolled to with their heading clear of the sticky bar and turn line, which otherwise sit over it
function toNotes() {
  const t = document.querySelector("#notes"); if (!t) return;
  const cover = [...document.querySelectorAll("header.bar, .bt-turn")].reduce((m, el) => {
    const s = getComputedStyle(el);
    return s.position === "sticky" || s.position === "fixed" ? Math.max(m, (parseFloat(s.top) || 0) + el.offsetHeight) : m; }, 0);
  t.style.scrollMarginTop = Math.ceil(cover + 8) + "px";
  t.scrollIntoView({ block: "start" });
}
// 0.120.0: /battery?request=R-0007 opens on that request's notes (Today's band links its pieces' notes this way)
{ const m = /^\s*R-?(\d{1,6})\s*$/i.exec(new URLSearchParams(location.search).get("request") || "");   // R-0007, r-7, R7
  if (m) ONLY = "R-" + String(parseInt(m[1], 10)).padStart(4, "0"); }
async function load() {
  try { D = await (await fetch("/api/battery")).json(); } catch (e) { D = { enabled: false, why: "the viewer did not answer" }; }
  if (D && D.enabled && D.thread && D.thread.subject) {
    try { const r = await fetch("/api/thread?subject=" + encodeURIComponent(D.thread.subject)); THREAD = r.ok ? await r.json() : null; } catch (e) { THREAD = null; }
  }
  paint();
  if (!LOOKED && D && D.enabled) { LOOKED = true; lookedNow(); if (ONLY) toNotes(); }
}
// 0.122.0: a question to the owner answered on this page, by a choice press or in his own words. 0.127.0: the card's
// presses (a choice, the answer box, Share, attach) are BV.card.wire's, one write each; a refusal is said under the list
BV.card.wire(document, { status: m => { QSAY = m || ""; const el = document.querySelector(".bt-foryou .bt-say"); if (el) el.textContent = QSAY; },
                         after: async () => { await load(); } });
load();
// the 15-second refresh waits while a box is being written in (the note to the partner, or an answer to a question) and
// while a dialog the page opened is up (a card's Share box)
setInterval(() => {
  const busy = [...document.querySelectorAll(".bt-write textarea, .bt-foryou textarea")].some(t => t.value.trim() || document.activeElement === t)
    || !!document.querySelector(".sharebox");
  if (!busy) load();
}, 15000);
</script>
</body>
