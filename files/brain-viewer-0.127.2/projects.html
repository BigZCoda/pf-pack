  #holons .hrow:first-of-type { border-top: 0; }
  #holons .hrow > summary { cursor: pointer; list-style: none; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  #holons .hrow > summary::-webkit-details-marker { display: none; }
  #holons .hrow .nm { font-family: var(--font-display); font-size: 15.5px; }
  #holons .hrow .m { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #holons .hrow.d1 { margin-left: 18px; } #holons .hrow.d2 { margin-left: 36px; }

<body>
<header class="bar">
  <img class="mark" src="/static/sun-mark.png" alt="" width="36" height="28">
  <h1>Projects</h1>
  <span class="spacer"></span>
  <nav class="panels" data-page="projects"></nav>
</header>
<div class="pstage">
  <main id="main"><div class="pwrap">
    <div class="ftop"><div class="filters" id="filters"></div><div id="outbox"></div></div>
    <p class="pstatus" id="status" aria-live="polite"></p>
    <div id="body"></div>
    <section class="blk" id="holons" hidden></section>
  </div></main>
  <aside class="drawer" id="drawer" hidden></aside>
</div>
<script src="/static/viewer-common.js"></script>
<script src="/static/attach.js"></script>
<script>BVAttach.watch(document.getElementById("main"));   // pictures on an item: the card's attach press and paste into its answer box (T-0219)</script>
<script>
// ---- the projects page, round 1a (2026-10-02; direction deliverables/viewer-direction-projects-page-2026-10-02.md) ----
// The owner, 9/21: this page is where questions get answered and shows why they matter. 9/25: blocked things show
// first. One list across every ledger, the ledgers a filter above it: Waiting on you
// (what holds other work, then due today, then past its date), Questions answered with one press, then the rest
// folded one line each. Milestones stay in the files and are not drawn. Every write goes through PUT /api/tasks
// (tasks.py behind it), the same route this page always used.
// 0.127.0: every task and question here is the task card (BV.card) with its compact option, and every press on it is
// BV.card.wire's: the page's own rows (rowHTML, qHTML, 0.56.0 to 0.126.0) are gone.
const { esc, ledgerAct, refreshBadges, showAll, mountShowAll } = BV;
const $ = s => document.querySelector(s);
const ME = BV.owner;
let DATA = null, FILTER = "all";
const OPENROWS = new Set();

// a ledger is named for what it is about, never its registry name (direction, label rules). The short names and the
// order are this brain's own, so they are settings (viewer/settings.json `project_labels` {id: name} and
// `project_order` [id, ...], read in load()); with none, the registry's name without its bracket, in registry order.
let SHORT = {}, ORDER = [];
const short = p => SHORT[p.id] || String(p.name || p.id).replace(/\s*\(.*\)\s*$/, "");
const FILTER_KEY = "bv.projects.filter";
const pref = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };
const prefSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

const back = (iso, n) => { const [y, m, d] = String(iso || "").split("-").map(Number); return y ? new Date(Date.UTC(y, m - 1, d - n)).toISOString().slice(0, 10) : ""; };
const newest = (a, b) => String(b.created || "").localeCompare(String(a.created || "")) || String(b.id || "").localeCompare(String(a.id || ""));
const isTest = i => (i.tags || []).some(t => t === "test" || /^test-/.test(t));
const isCold = i => /cold storage/i.test(String(i.note || ""));
const forMe = i => i.kind === "task" ? i.owner === ME : (i.to || ME) === ME;
const REF = /\b[TQ]-\d{4}\b/g;
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

// ---- the one model the page draws, from the one read (GET /api/projects) ----
function model() {
  const today = DATA.today, week = back(today, 6);
  const items = [];
  for (const p of DATA.projects) {
    if (!p.exists) continue;
    if (FILTER !== "all" && p.id !== FILTER) continue;
    for (const g of p.groups || []) for (const i of g.items || [])
      items.push(Object.assign({}, i, { project: p.id, pname: short(p), ledger: p.path }));
  }
  const byKey = new Map(items.map(i => [i.project + "/" + i.id, i]));
  const isOpen = i => i.kind === "task" ? i.mark !== "x" : i.mark === "?";
  // what holds other work: an open item that an OPEN task on its own ledger names in `blocked:` (ids run from 0001 on
  // every file, so only the same ledger is looked at). The relation BV.day.model reads for questions, widened to tasks,
  // because a task can hold a task (the extended circle holds Claude's build of it). A block whose blocker is already
  // closed is not drawn: it is cleaned at rounds.
  const holds = new Map();
  for (const t of items) {
    if (t.kind !== "task" || t.mark === "x" || !t.blocked) continue;
    for (const id of String(t.blocked).match(REF) || []) {
      const b = byKey.get(t.project + "/" + id); if (!b || !isOpen(b)) continue;
      const k = b.project + "/" + b.id; if (!holds.has(k)) holds.set(k, []); holds.get(k).push(t);
    }
  }
  const holdsOf = i => holds.get(i.project + "/" + i.id) || [];
  // what an open item waits on: the open items on its own ledger its blocked: names (the card's waiting-on line)
  const waitsOf = t => !t.blocked || !isOpen(t) ? [] : (String(t.blocked).match(REF) || []).map(id => byKey.get(t.project + "/" + id)).filter(b => b && isOpen(b));
  const held = i => BV.holds.is(i, today);
  const myOpen = items.filter(i => i.kind === "task" && i.mark !== "x" && i.owner === ME);
  const work = myOpen.filter(i => !isTest(i) && !held(i));
  const blocking = work.filter(i => holdsOf(i).length).sort((a, b) => holdsOf(b).length - holdsOf(a).length || newest(a, b));
  const qOpen = items.filter(i => i.kind === "question" && i.mark === "?" && forMe(i) && !isCold(i));
  const qBlocking = qOpen.filter(q => holdsOf(q).length).sort((a, b) => holdsOf(b).length - holdsOf(a).length || newest(a, b));
  const dueToday = work.filter(i => !holdsOf(i).length && (i.due === today || (i.until && i.until <= today && !(i.due && i.due < today)))).sort(newest);
  const late = work.filter(i => !holdsOf(i).length && i.due && i.due < today)
    .sort((a, b) => String(b.due).localeCompare(String(a.due)) || newest(a, b));
  const waitingKeys = new Set([...blocking, ...dueToday, ...late].map(i => i.project + "/" + i.id));
  const questions = qOpen.filter(q => !holdsOf(q).length).sort((a, b) => {
    const da = a.due && a.due <= today ? "0" + a.due : "1", db = b.due && b.due <= today ? "0" + b.due : "1";
    return da.localeCompare(db) || newest(a, b);
  });
  const others = myOpen.filter(i => !isTest(i) && !waitingKeys.has(i.project + "/" + i.id))
    .sort((a, b) => (held(a) - held(b)) || String(a.due || "9999").localeCompare(String(b.due || "9999")) || newest(a, b));
  const tests = myOpen.filter(isTest).sort(newest);
  // the questions you asked someone else, still open: drawn in the Questions block under your own, not in the rest
  const asked = items.filter(i => i.kind === "question" && i.mark === "?" && i.owner === ME && !forMe(i) && !isCold(i)).sort(newest);
  const theirs = {};
  for (const i of items) {
    const open = i.kind === "task" ? i.mark !== "x" && i.owner !== ME : i.mark === "?" && !forMe(i) && i.owner !== ME;
    if (!open) continue;
    const o = i.kind === "task" ? i.owner : i.to; (theirs[o] = theirs[o] || []).push(i);
  }
  for (const o in theirs) theirs[o].sort(newest);
  const done = items.filter(i => (i.kind === "task" && i.mark === "x" && i.done && i.done >= week) || (i.kind === "question" && i.mark === "a" && i.answered && i.answered >= week))
    .sort((a, b) => String(b.done || b.answered).localeCompare(String(a.done || a.answered)) || newest(a, b));
  return { today, items, holdsOf, waitsOf, blocking, qBlocking, dueToday, late, questions, asked, others, tests, theirs, done, held };
}

// ---- the filter row: a ledger's open total for you on its chip, the one count that stays ----
function openForMe(p) {
  if (!p.exists) return 0;
  let n = 0;
  for (const g of p.groups || []) for (const i of g.items || []) {
    if (i.kind === "task" && i.mark !== "x" && i.owner === ME && !isTest(i) && !BV.holds.is(i, DATA.today)) n++;
    else if (i.kind === "question" && i.mark === "?" && forMe(i) && !isCold(i)) n++;
  }
  return n;
}
function ledgers() {
  return DATA.projects.slice().sort((a, b) => {
    const ia = ORDER.indexOf(a.id), ib = ORDER.indexOf(b.id);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
}
function paintFilters() {
  $("#filters").innerHTML = `<button type="button" data-f="all" class="${FILTER === "all" ? "on" : ""}">Everything</button>` +
    ledgers().map(p => `<button type="button" data-f="${esc(p.id)}" class="${FILTER === p.id ? "on" : ""}" title="${esc(p.name)}">${esc(short(p))}${p.exists ? ` <span class="n">${openForMe(p)}</span>` : ""}</button>`).join("");
}

// ---- one item: the task card, compact (0.127.0) ----
// The checkbox closes a task or reopens a done one, the words are clipped to two lines until they are pressed (OPENROWS
// keeps a row open across repaints), the one day that matters sits at the right, and the project's name shows only under
// Everything. Everything else is the card every page draws: its files open the side panel, what it holds up and waits on
// are presses, a question answers with its named choices (pictures included) or in its box, a task replies, holds for
// three days or until a day picked, and ticks its steps.
const rel = x => ({ id: x.id, project: x.project, text: x.text });
function card(i, M) {
  const it = Object.assign({}, i, { holdsUp: M.holdsOf(i).map(rel), waitsOn: M.waitsOf(i).map(rel) });
  return BV.card(it, { project: i.project, today: M.today, label: FILTER === "all" ? () => i.pname : () => false,
                       compact: { open: OPENROWS.has(i.project + "/" + i.id) } });
}
const list = (items, M) => items.length ? `<ul class="tcs">${items.map(i => card(i, M)).join("")}</ul>` : "";

// ---- the page ----
const LIMIT = 10, QSHOW = 6;
// the add box at the bottom files a task for you or a question for Claude, on the ledger chosen above (2026-10-02)
let ADDMODE = "task";
const addPlaceholder = p => { const where = FILTER === "all" ? "the ledger you pick here" : short(p || {});
  return ADDMODE === "ask" ? `ask Claude a question (it goes on ${where})` : `add a task (it goes on ${where})`; };
// a contact's handle is their card's file name (@lena-ortiz): the label reads it as a name, "Lena Ortiz's work" (2026-10-28)
const ownerWord = o => o === "@claude" ? "Claude's work" : `${String(o || "").replace(/^@/, "").split("-").filter(Boolean).map(cap).join(" ")}'s work`;
function paint() {
  paintFilters();
  const M = model(), everything = showAll("projects"), body = $("#body");
  const p = FILTER === "all" ? null : DATA.projects.find(x => x.id === FILTER);
  const head = [];
  for (const x of DATA.projects) if (x.exists && x.errors && x.errors.length && (!p || p === x))
    head.push(`<p class="pnote">${esc(short(x))} has lines that do not parse (fix by hand, then reload): ${x.errors.map(esc).join(" · ")}</p>`);
  if (p && !p.exists) head.push(`<p class="pnote">The registry names <code>${esc(p.path)}</code> but no such file exists. Create it from the brain root: <code>python skills/brain-tasks/tasks.py init --project ${esc(p.id)} --name "${esc(p.name)}"</code></p>`);
  // with one ledger chosen, its build-order line (where it has one) sits above the list; with Everything, none shows
  const hasStages = p && p.exists && (p.groups || []).some(g => g.name.trim().toLowerCase() === "straight-line");
  if (p && p.exists) head.push(`<div class="ledgerline">${hasStages ? `<div class="stagerow"></div>` : ""}<a class="btn" href="/chat?project=${encodeURIComponent(p.id)}" style="text-decoration:none" title="talk to this ledger's agent">chat about this project</a><span class="projshare" data-project="${esc(p.id)}"></span><div class="propose"></div></div>`);
  // 1. Waiting on you, in Today's order (0.65.0; blocking first since 0.65.1, the owner 9/16, G13: "the primary ones
  // blocking"): what holds other work first, most held up first; then what is due today or earlier, the oldest date
  // first; ten, the rest folded
  const lateOldest = M.late.slice().sort((a, b) => String(a.due).localeCompare(String(b.due)) || String(a.created || "").localeCompare(String(b.created || "")));
  const all = [...M.qBlocking.map(q => ({ q, kind: "blocking" })), ...M.blocking.map(i => ({ i, kind: "blocking" })),
               ...lateOldest.map(i => ({ i, kind: "late" })), ...M.dueToday.map(i => ({ i, kind: "today" }))];
  const shown = everything ? all : all.slice(0, LIMIT), folded = everything ? [] : all.slice(LIMIT);
  const drawSet = set => list(set.map(x => x.q || x.i), M);   // in the order given, questions and tasks in one list
  const waiting = `<section class="blk hero"><h2>Waiting on you</h2>${all.length ? drawSet(shown) : `<p class="none">Nothing holds other work, and nothing is due today or past its date.</p>`}
    ${folded.length ? `<details class="fold" data-fold="late"><summary>${folded.length} more, in the same order</summary>${drawSet(folded)}</details>` : ""}</section>`;
  // 2. Questions: the first six, the rest behind one fold
  const qs = M.questions;
  const questions = `<section class="blk"><h2>Questions</h2>${qs.length ? list(qs.slice(0, everything ? qs.length : QSHOW), M) : `<p class="none">No question is waiting on you.</p>`}
    ${!everything && qs.length > QSHOW ? `<details class="fold" data-fold="moreq"><summary>${qs.length - QSHOW} more questions</summary>${list(qs.slice(QSHOW), M)}</details>` : ""}
    ${M.asked.length ? `<h3 class="asked">You asked</h3>${list(M.asked, M)}` : ""}</section>`;
  // 3. The rest, one line each
  const fold = (key, label, n, inner) => n ? `<details class="fold" data-fold="${esc(key)}"${everything ? " open" : ""}><summary>${esc(label)}<span class="n">${n}</span></summary>${inner}</details>` : "";
  const mixed = xs => list(xs.filter(i => i.kind === "question").concat(xs.filter(i => i.kind === "task")), M);   // its questions first
  const owners = Object.keys(M.theirs).sort((a, b) => (a === "@claude" ? -1 : b === "@claude" ? 1 : a.localeCompare(b)));
  const rest = [
    fold("others", "Your other tasks", M.others.length, list(M.others, M)),
    ...owners.map(o => fold("own:" + o, ownerWord(o), M.theirs[o].length, mixed(M.theirs[o]))),
    fold("done", "Done this week", M.done.length, mixed(M.done)),
  ].filter(Boolean).join("");
  const ledgerPick = FILTER === "all"
    ? `<select name="project" title="the ledger it goes on">${ledgers().filter(x => x.exists).map(x => `<option value="${esc(x.id)}">${esc(short(x))}</option>`).join("")}</select>` : "";
  const restBlk = `<section class="blk"><h2>The rest</h2>${rest ? `<div class="rest">${rest}</div>` : `<p class="none">Nothing else is open here.</p>`}
    <form class="addline" data-form="add" data-mode="${ADDMODE}"><span class="mode" role="group" aria-label="what the box adds"><button type="button" class="btn${ADDMODE === "task" ? " on" : ""}" data-addmode="task">task</button><button type="button" class="btn${ADDMODE === "ask" ? " on" : ""}" data-addmode="ask">question</button></span><input name="text" placeholder="${esc(addPlaceholder(p))}" required>${ledgerPick}<button class="btn primary" type="submit">${ADDMODE === "ask" ? "Ask" : "Add"}</button></form></section>`;
  const keepOpen = new Set([...body.querySelectorAll("details.fold[open]")].map(d => d.dataset.fold));
  body.innerHTML = linkedHTML(M) + head.join("") + waiting + questions + restBlk;
  for (const d of body.querySelectorAll("details.fold")) if (keepOpen.has(d.dataset.fold)) d.open = true;
  if (p && p.exists) {
    const sl = body.querySelector(".stagerow"); if (sl) BV.stages.mount(sl, { label: "the build order on this ledger" });
    const pb = BV.proposeBox(p.path, { label: "propose a change to this ledger" }); if (pb) body.querySelector(".propose").appendChild(pb);
    projShare();
  }
}

// ---- share this project (0.112.0, sharing round four; the Share box since 0.113.0) ----
// One press on a project's page: Share, or Shared with <names> once it is, opening the same Share box as every other
// thing (BV.shareBox: who has access, Stop sharing, which first says how many things come back). It is drawn when a
// person or a team brain that takes a press from this computer can take a project.
async function projShare() {
  const slot = document.querySelector(".projshare");
  if (!slot) return;
  const proj = slot.dataset.project;
  let st = {};
  try { st = await BV.shareItem.load(); } catch (e) { st = {}; }
  const ps = ((st && st.partners) || []).filter(p => (p.kinds || {}).project);
  if (!ps.length || /^shared-/.test(proj)) { slot.innerHTML = ""; return; }
  const on = ps.filter(p => (p.projects || []).includes(proj));
  slot.dataset.sharekind = "project";
  slot.innerHTML = `<button type="button" class="btn sharebtn${on.length ? " shared" : ""}" data-sharebox="1" aria-haspopup="dialog" title="${on.length ? "who has access to this project, and share it with someone else" : "share this project with a person or a team brain"}">${on.length ? `Shared with ${on.map(p => BV.esc(p.with)).join(", ")}` : "Share this project"}</button>`;
}
// the press says who has access again once the box closes (BV.shareBox sends bv:shared)
document.addEventListener("bv:shared", projShare);

// ---- a link from elsewhere (a chip's "open in its ledger", an old bookmark) names a row: it is shown and marked ----
// A row not drawn in any block (closed weeks ago, cold storage, another ledger) is drawn on its own at the top, so no
// link that reached this page before the rebuild lands on nothing.
let LINKED = "";
function linkedHTML(M) {
  if (!LINKED) return "";
  const m = /^([tq])-(.+)-([TQ]-\d{4})$/.exec(LINKED); if (!m) return "";
  const pr = DATA.projects.find(x => x.id === m[2]); if (!pr || !pr.exists) return "";
  let it = null;
  for (const g of pr.groups || []) for (const i of g.items || []) if (i.id === m[3]) it = i;
  if (!it) return "";
  const k = pr.id + "/" + it.id;
  const drawn = (FILTER === "all" || FILTER === pr.id) && !(it.kind === "question" && isCold(it)) && (
    it.kind === "question" ? (it.mark === "?" || (it.answered && it.answered >= back(DATA.today, 6)))
                           : (it.mark !== "x" || (it.done && it.done >= back(DATA.today, 6))));
  if (drawn) return "";
  const i = Object.assign({}, it, { project: pr.id, pname: short(pr), ledger: pr.path });
  return `<section class="blk" data-linked="${esc(k)}"><h2>The item you followed</h2>${list([i], M)}</section>`;
}
function jumpTo(frag) {
  if (!frag) return;
  if (LINKED !== frag) { LINKED = frag; paint(); }
  const el = document.getElementById(frag); if (!el) return;
  BV.land(el);   // 10/28: its folds opened, under the header, flashed, and outlined until the page is left
}

// ---- writes: the same PUT /api/tasks route (tasks.py) the page always used; a card's presses are BV.card.wire's ----
const say = m => { $("#status").textContent = m || ""; };
async function act(project, payload) {
  const res = await ledgerAct(project, payload);
  if (!res.ok) { say(res.message); return null; }
  await load(false); refreshBadges(); paint();
  return res;
}
function setFilter(f, moved) {
  FILTER = f === "all" || DATA.projects.some(p => p.id === f) ? f : "all";
  prefSet(FILTER_KEY, FILTER);
  const u = FILTER === "all" ? "/projects" : `/projects?id=${encodeURIComponent(FILTER)}`;
  // 0.71.0, the Now band: a project chosen here is the one Today leads with for the rest of the day (this browser only)
  if (FILTER !== "all") { try { const d = new Date(); localStorage.setItem("bv.now", JSON.stringify({ kind: "project", id: FILTER,
    day: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}` })); } catch (e) {} }
  if (moved) { BV.back.push(`Projects · ${FILTER === "all" ? "Everything" : short(DATA.projects.find(p => p.id === FILTER))}`); LINKED = ""; history.replaceState(null, "", u); }
  else history.replaceState(null, "", u + location.hash);
  paint();
}

document.addEventListener("click", async e => {
  if (e.target.closest("#closeDrawer")) { $("#drawer").hidden = true; return; }
  const am = e.target.closest("button[data-addmode]");
  if (am) {   // task / question: switched in place, so what is typed stays
    ADDMODE = am.dataset.addmode; const f = am.closest("form.addline"), p = FILTER === "all" ? null : DATA.projects.find(x => x.id === FILTER);
    f.dataset.mode = ADDMODE; for (const b of f.querySelectorAll("button[data-addmode]")) b.classList.toggle("on", b === am);
    const inp = f.querySelector("input[name=text]"); inp.placeholder = addPlaceholder(p); inp.focus();
    f.querySelector("button[type=submit]").textContent = ADDMODE === "ask" ? "Ask" : "Add";
    return;
  }
  const fb = e.target.closest("#filters button[data-f]"); if (fb) { setFilter(fb.dataset.f, true); return; }
  // 0.127.0: a card's checkbox, its choices, its answer box, reopen and a press on its words are BV.card.wire's, below
  const pc = e.target.closest(".badge.person"); if (pc) { location.href = `/people?open=${encodeURIComponent(pc.dataset.person)}`; return; }
  const w = e.target.closest("a.wikilink"); if (w) { e.preventDefault(); const tt = w.dataset.wikilink.split("#")[0].trim(); if (tt.endsWith(".canvas")) location.href = BV.forgeHref(tt); else BV.drawer.open(tt, w.dataset.wikilink.split("#")[1]); return; }
  // ONLY a real file link opens the drawer (T-0065)
  const o = e.target.closest(".filelink[data-open]"); if (o) { BV.drawer.open(o.dataset.open, o.dataset.frag); return; }
});
document.addEventListener("submit", async e => {
  const f = e.target;
  if (f.dataset.form !== "add") return;        // a card's answer and reply boxes are BV.card.wire's
  e.preventDefault(); const fd = new FormData(f);
  {
    const pid = FILTER === "all" ? fd.get("project") : FILTER;
    const where = short(DATA.projects.find(p => p.id === pid) || { id: pid });
    if (f.dataset.mode === "ask") {
      const r = await act(pid, { action: "ask", text: fd.get("text"), from: ME, to: "@claude", milestone: null, links: [] });
      if (r) say(`Asked Claude, on ${where}. It sits under You asked, in Questions.`);
    } else {
      const r = await act(pid, { action: "add", text: fd.get("text"), owner: ME, due: null, milestone: null, links: [] });
      if (r) say(`Added to ${where}.`);
    }
  }
});
document.addEventListener("keydown", e => { if (BV.typing(e)) return; if (e.key === "Escape") $("#drawer").hidden = true; });
window.addEventListener("hashchange", () => jumpTo(decodeURIComponent(location.hash.replace(/^#/, ""))));

mountShowAll("projects", () => paint());
// Clear what's settled beside the filters (0.60.0, renamed 0.60.1 and 0.60.2). With one ledger chosen the check looks at that
// ledger alone; with Everything, at every ledger. A finished check reads the ledgers again and the page is drawn from them.
// The send press is the round one at the bottom right, drawn by viewer-common.js on every page.
BV.outbox.mount($("#outbox"), { project: () => FILTER === "all" ? null : FILTER,
                                onSweepDone: async () => { await load(false); paint(); } });
// 0.127.0: the one handler for every card's presses (done, reopen, a choice, an answer, a reply, a hold, a tick), then
// the page reads the ledgers back; after a done or an answer the status line says what it freed
BV.card.wire(document, { status: say, after: async () => { await load(false); paint(); },
                         opened: (k, on) => { if (on) OPENROWS.add(k); else OPENROWS.delete(k); } });
BV.undo.onChange(async () => { await load(false); paint(); });   // 0.71.0: an undo reads the ledgers back

async function load(render = true) {
  const pr = await BV.prefs();
  SHORT = (pr.project_labels && typeof pr.project_labels === "object") ? pr.project_labels : {};
  ORDER = Array.isArray(pr.project_order) ? pr.project_order : [];
  const r = await fetch("/api/projects"); DATA = await r.json();
  if (DATA.error) throw new Error(DATA.error);
  BV.ledger.learn(DATA);            // a T-#### / Q-#### in any body reads as the item it names (viewer Q-0028)
  if (!render) return;
  // /projects?id=<ledger> is a deep link that selects that filter; without one, the filter left on last time
  const want = new URLSearchParams(location.search).get("id");
  setFilter(want || pref(FILTER_KEY, "all"), false);
  jumpTo(decodeURIComponent(location.hash.replace(/^#/, "")));
}
load().catch(e => { $("#body").innerHTML = `<div class="pnote">Could not load the ledgers: ${esc(e.message)}</div>`; });

// ---- every part of the brain (0.66.0, the menu folds: the Holons page folded in; /holons redirects here) ----
// The registry (context/holon-registry.json, GET /api/holons) drawn as its tree, one row a part, folded under one heading
// at the foot of the page: its kind, whether its folder is there, whether its stamp matches, the age of its status file,
// and, opened, what it is, its rules, its runbook and its list. ?holon=<id> opens that row. Read-only, as the page was.
const ageWords = h => h == null ? "" : h < 1 ? "under an hour old" : h < 48 ? `${Math.round(h)} hours old` : `${Math.round(h / 24)} days old`;
const HOLON_WANT = new URLSearchParams(location.search).get("holon") || "", HOLON_HASH = location.hash === "#holons";   // read before the page rewrites its address
async function holonsLoad() {
  let reg;
  try { const r = await fetch("/api/holons"); reg = await r.json(); if (!r.ok || reg.error) throw new Error(reg.error || r.status); }
  catch (e) { return; }
  const by = Object.fromEntries((reg.holons || []).map(h => [h.id, h])), want = HOLON_WANT;
  const rows = [], seen = new Set();
  const add = (h, d) => { if (seen.has(h.id)) return; seen.add(h.id); rows.push([h, d]); (h.children || []).map(id => by[id]).filter(Boolean).forEach(k => add(k, d + 1)); };
  (reg.holons || []).filter(h => !h.parent || !by[h.parent]).forEach(h => add(h, 0));
  const link = (rel, label) => rel ? `<span class="filelink" data-open="${esc(rel)}">${esc(label || rel)}</span>` : "";
  const row = ([h, d]) => {
    const marks = [`<span class="badge type">${esc(h.type || "part")}</span>`];
    if (h.exists === false) marks.push(`<span class="badge missing">its folder is not there</span>`);
    if (h.stamp && h.stamp !== "match") marks.push(`<span class="badge blocked">its stamp disagrees</span>`);
    if (h.status) marks.push(h.statusError ? `<span class="badge blocked">status unreadable</span>` : `<span class="badge done">status ${esc(ageWords(h.statusAgeHours))}</span>`);
    if (h.tasks) marks.push(`<a href="/projects?id=${encodeURIComponent(h.id)}">its list</a>`);
    const facts = [["where", h.isDir ? `<code>${esc(h.path)}</code>${h.readme ? " \u00b7 " + link(h.readme, "readme") : ""}` : link(h.path)],
      h.rules ? ["rules", link(h.rules)] : null, h.agent ? ["runbook", link(h.agent)] : null, h.status ? ["status file", link(h.status)] : null,
      h.sharing && h.sharing !== "private" ? ["shared", esc(h.sharing)] : null].filter(Boolean);
    return `<details class="hrow d${Math.min(d, 2)}${h.id === want ? " on" : ""}" data-holon="${esc(h.id)}"${h.id === want ? " open" : ""}><summary><span class="nm">${esc(h.name)}</span><span class="m">${marks.join("")}</span></summary>
      ${h.description ? `<p class="what">${esc(h.description)}</p>` : ""}<table>${facts.map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join("")}</table></details>`;
  };
  const sec = $("#holons");
  sec.innerHTML = `<details class="fold" data-fold="holons"${want || HOLON_HASH ? " open" : ""}><summary>Every part of the brain<span class="n">${rows.length}</span></summary>
    <p class="none">The registry: every folder and file the brain treats as one unit of work, nested as it nests. A part with a list is a project above.</p>${rows.map(row).join("")}</details>`;
  sec.hidden = false;
  if (want || HOLON_HASH) { const el = (want && sec.querySelector(`[data-holon="${CSS.escape(want)}"]`)) || sec; el.scrollIntoView({ block: "start" }); }
}
holonsLoad();
</script>
