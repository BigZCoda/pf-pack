<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<link rel="stylesheet" href="/static/viewer-tokens.css">
<link rel="icon" type="image/png" href="/static/sun-favicon.png">
<style>
  /* layout only; every color and font comes from viewer-tokens.css */
  body { min-height: 100vh; display: flex; flex-direction: column; }
  .stage { flex: 1; min-height: 0; display: flex; }
  main { flex: 1; overflow: auto; padding: 16px 26px 110px; }
  .sheet { max-width: 1400px; margin: 0 auto; }

  /* ---- the board: twelve columns, and a size IS a column span ---- */
  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; align-items: start; }
  section.w { grid-column: span 4; min-width: 0; padding: 0; }
  section.w[data-span="4"]  { grid-column: span 4; }
  section.w[data-span="6"]  { grid-column: span 6; }
  section.w[data-span="8"]  { grid-column: span 8; }
  section.w[data-span="12"] { grid-column: span 12; }
  section.w.wide            { grid-column: span 12; }      /* expanded in place, whatever its size */
  /* ...and a HEIGHT is a row span (0.39.0), so one tall instrument can stand beside two short ones with no hole under
     them: the deck runs two rows while Next and the chat fill the same two rows beside it. */
  section.w[data-rows="2"]  { grid-row: span 2; }
  @media (max-width: 1100px) {
    section.w[data-span="4"] { grid-column: span 6; }
    section.w[data-span="8"] { grid-column: span 12; }
    section.w[data-rows="2"] { grid-row: auto; }           /* the columns have been re-dealt; a row span would hole it */
  }
  @media (max-width: 760px) { .grid { grid-template-columns: minmax(0, 1fr); gap: 22px; } section.w { grid-column: span 1 !important; grid-row: auto !important; } }

  /* an instrument with nothing to report draws nothing at all, and comes back in edit mode so it can still be moved */
  body:not(.editing) section.w.whidden { display: none; }
  body.editing section.w.whidden { opacity: .5; }

  /* ---- the two shapes a widget can wear ---- */
  /* plain: a hairline over it and nothing else, so the page is instruments on one ground, not a wall of boxes */
  section.w.plain { border-top: 1px solid var(--rule-soft); padding-top: 9px; }
  section.w.bare { border-top: 0; padding-top: 0; }        /* the masthead and the strips carry their own edge */
  /* the notepad's look, which the owner likes: surface, the rule frame, the open-gold left edge. The deck and the command
     line are the only two things on this page that read as a card. */
  section.w.iscard { background: var(--surface); border: 1px solid var(--rule); border-left: 3px solid var(--open);
                     border-radius: var(--radius); padding: 11px 13px 12px; }

  /* ---- the head: a small-caps label, a mono count, the widget's own control, then the edit tools ---- */
  .whead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin: 0 0 7px; }
  .whead h2 { font-family: var(--font-ui); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
              color: var(--muted); font-weight: 400; margin: 0; }
  .whead .wcount { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  .whead .wctl { margin-left: auto; display: flex; gap: 3px; align-items: center; flex-wrap: wrap; }
  .whead .wtools { display: none; gap: 4px; align-items: center; }
  .whead .wtools .btn { font-size: 11px; padding: 1px 6px; }
  .whead button.wfold { border: 0; background: none; cursor: pointer; padding: 0 2px; color: var(--muted); font-size: 11px; line-height: 1; }
  .whead button.wfold:hover { color: var(--accent); }
  section.w.folded .wbody { display: none; }
  /* a widget's own toggles: quiet until the one that is on */
  .wtab { border: 0; background: none; cursor: pointer; font-family: var(--font-ui); font-size: 10.5px; letter-spacing: .1em;
          text-transform: uppercase; color: var(--muted); padding: 2px 5px; border-bottom: 1px solid transparent; }
  .wtab:hover { color: var(--ink); }
  .wtab.on { color: var(--accent); border-bottom-color: var(--accent); }

  .wbody { font-size: 14px; min-width: 0; }

  /* ---- the small shared shapes a widget may reach for ---- */
  ul.wlines { list-style: none; margin: 2px 0 0; padding: 0; }
  ul.wlines li { padding: 4px 0; border-top: 1px solid var(--rule-soft); display: flex; gap: 8px; align-items: baseline; min-width: 0; }
  ul.wlines li:first-child { border-top: 0; }
  ul.wlines li > a, ul.wlines li > span.wl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul.wlines li .wt { color: var(--muted); font-family: var(--font-mono); font-size: 11px; white-space: nowrap; }
  ul.wlines li.live { font-weight: 700; }
  ul.wlines li.past { opacity: .6; }
  p.wsay { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  a.wmore { display: inline-block; margin-top: 7px; font-size: 12.5px; }
  .wgrid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 3px 14px; margin-top: 3px; }
  .wgrid2 a { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wgrid2 a .wt { color: var(--muted); font-size: 12px; }
  .wrow { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
  .wrow input { flex: 1; min-width: 0; padding: 5px 8px; border: 1px solid var(--rule-soft); border-radius: var(--radius); background: var(--bg); font: inherit; font-size: 13px; }
  .wrow input:focus { outline: none; border-color: var(--accent); }
  .wframe { width: 100%; height: 460px; border: 1px solid var(--rule-soft); border-radius: var(--radius); background: var(--surface); }
  .wbig { font-family: var(--font-title); font-weight: 500; color: var(--accent); line-height: .95; }
  .wcaps { font-family: var(--font-ui); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .wnum { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

  /* ---- a broken instrument says so on its own tile (T-0217) ---- */
  section.w.wbroken { border-left: 3px solid var(--danger); padding-left: 12px; }
  section.w.wbroken .wbody { display: none; }
  .wbroke { background: var(--danger-tint); border-radius: var(--radius); padding: 8px 11px; margin-top: 4px; }
  .wbroke .wbroke-say { margin: 0; color: var(--danger); font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
  .wbroke .wbroke-do { margin: 6px 0 0; font-size: 12.5px; display: flex; gap: 14px; flex-wrap: wrap; }

  /* edit mode */
  body.editing section.w { cursor: grab; outline: 1px dashed var(--rule-soft); outline-offset: 5px; }
  body.editing .whead .wtools { display: flex; }
  body.editing section.w.drag { opacity: .45; }
  body.editing section.w.over { outline: 2px dashed var(--accent); outline-offset: 4px; }
  .editbar { display: none; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 16px; padding: 8px 14px; }
  body.editing .editbar { display: flex; }
  .editbar .add { display: flex; gap: 5px; flex-wrap: wrap; }
  .editbar .add button { font-size: 12px; padding: 2px 8px; }
  .headbtn { border: 1px solid var(--rule); background: var(--surface); color: var(--ink); border-radius: var(--radius); cursor: pointer; font: inherit; font-size: 13px; padding: 3px 10px; }
  .headbtn:hover { background: var(--hover); }
  .headbtn.on { background: var(--accent); color: var(--surface); border-color: var(--accent); }
  /* the add strip, again, as a window of its own once it has scrolled off the top (0.39.0: once the strip scrolls
     past the top, the available widgets become a window on the side to drag from; 0.40.0: that sidebar is movable
     and appears in its own resizable window). The notepad's
     look, a bar across its top to carry it by, and its own corner to pull it bigger. Where it was left is saved with
     the board, so it opens in the same place on the next reload and on the other machine. */
  .addrail { position: fixed; right: 12px; top: 96px; z-index: 40; width: 168px; height: 300px;
             min-width: 132px; min-height: 120px; max-width: calc(100vw - 20px); max-height: calc(100vh - 20px);
             background: var(--surface); border: 1px solid var(--rule); border-left: 3px solid var(--open);
             border-radius: var(--radius); padding: 0; display: none; flex-direction: column; overflow: hidden;
             resize: both; box-shadow: 0 2px 14px rgba(43, 41, 37, .12); }
  body.editing .addrail.up { display: flex; }
  .addrail .railgrab { flex: none; height: 17px; cursor: grab; touch-action: none; background: var(--bg);
                       border-bottom: 1px solid var(--rule-soft); display: flex; align-items: center;
                       justify-content: center; gap: 3px; }
  .addrail .railgrab i { display: block; width: 16px; height: 1px; background: var(--rule); }
  .addrail.moving { box-shadow: 0 6px 22px rgba(43, 41, 37, .2); }
  .addrail.moving .railgrab { cursor: grabbing; }
  .addrail .raillist { flex: 1; min-height: 0; overflow: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
  .addrail button { text-align: left; cursor: grab; }
  .addrail button.drag { opacity: .45; }
  @media (max-width: 760px) { .addrail { display: none !important; } }

  /* ---- the look, and a tile's own style (2026-09-22, T-0208) ----
     The look picker and its import sit in the edit bar. A tile's style is applied as custom properties inline on the
     tile, so they override the look's tokens for that tile only and a widget that reads the tokens follows with no
     change of its own. --w-edge is the tile's edge, --w-scale its text size; the rest are the look's own names. */
  .editbar .lookpick { display: flex; gap: 6px; align-items: center; margin-left: auto; }
  .editbar .lookpick select, .wstyle select { font: inherit; font-size: 12.5px; padding: 2px 6px; border: 1px solid var(--rule-soft);
                                              border-radius: var(--radius); background: var(--bg); color: var(--ink); }
  .editbar .lookpick input[type=file] { display: none; }
  section.w { font-family: var(--font-ui); }
  section.w[style*="--w-scale"] .wbody { font-size: calc(14px * var(--w-scale)); }
  section.w[style*="--w-scale"] .whead h2 { font-size: calc(10.5px * var(--w-scale)); }
  section.w.iscard[style*="--w-edge"] { border-left-color: var(--w-edge); }
  section.w.plain[style*="--w-edge"] { border-top-color: var(--w-edge); }
  .wstyle { display: none; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin: 0 0 9px; padding: 7px 9px;
            background: var(--bg); border: 1px dashed var(--rule); border-radius: var(--radius); font-family: var(--font-ui);
            font-size: 12px; color: var(--muted); cursor: default; }
  body.editing section.w.styling .wstyle { display: flex; }
  .wstyle label, .wstyle .slab { display: flex; gap: 5px; align-items: center; }
  .wstyle .btn { font-size: 11px; padding: 1px 6px; }
  .wstyle input[type=color] { width: 26px; height: 20px; padding: 0; border: 1px solid var(--rule-soft); border-radius: var(--radius); background: none; cursor: pointer; }
  .wstyle .sgroup { display: flex; gap: 3px; align-items: center; }
  /* ---- a widget's rules, as settings (T-0214) ----
     The filter row is the style panel's twin: the same dashed box under the head, opened from the same edit strip, one
     control per filter the widget declares, then save as view, and the prompt box for what no filter can say. */
  .wfilt { display: none; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin: 0 0 9px; padding: 7px 9px;
           background: var(--bg); border: 1px dashed var(--rule); border-radius: var(--radius); font-family: var(--font-ui);
           font-size: 12px; color: var(--muted); cursor: default; }
  body.editing section.w.filtering .wfilt { display: flex; }
  .wfilt label { display: flex; gap: 5px; align-items: center; }
  .wfilt select, .wfilt input[type=text] { font: inherit; font-size: 12.5px; padding: 2px 6px; border: 1px solid var(--rule-soft);
                                           border-radius: var(--radius); background: var(--bg); color: var(--ink); max-width: 190px; }
  .wfilt input[type=range] { width: 90px; accent-color: var(--accent); }
  .wfilt .btn { font-size: 11px; padding: 1px 6px; }
  .wfilt .fask { flex: 1 1 100%; }
  .wfilt .fask input { flex: 1; max-width: none; min-width: 0; }
  .wfilt .fask input:focus, .wfilt select:focus { outline: none; border-color: var(--accent); }
  .editbar .add .wview, .addrail .wview { display: inline-flex; gap: 2px; align-items: center; }
  .addrail .wview { display: flex; flex-wrap: wrap; }
  .wview .wvsub { color: var(--muted); font-size: 10.5px; }
  .wview .wvx { font-size: 10.5px; padding: 1px 4px; color: var(--muted); }

  /* ---- free mode (T-0213): the same twelve columns, each tile at an explicit cell ----
     A tile's place is x, y, w, h in its row of the layout, drawn as grid lines on a fine row unit (20px, 2026-09-22) with
     no row gap: the tile's own bottom margin is the gap, so a tile's height can follow its content to within a unit.
     A tile that fits its content (.fauto) lets its body stand at its natural height; a fixed or filling one scrolls. */
  .grid.free { grid-auto-rows: var(--free-row, 20px); row-gap: 0; align-items: stretch; }
  .grid.free section.w { display: flex; flex-direction: column; min-height: 0; margin-bottom: 18px; }
  .grid.free section.w > .wbody { flex: 1 1 auto; min-height: 0; overflow: auto; }
  .grid.free section.w.fauto > .wbody { flex: none; overflow: visible; }
  body.editing .grid.free section.w.wsel, body.editing section.w.wsel { outline: 1.5px solid var(--accent); outline-offset: 4px; }
  .grid.free section.w.folded { align-self: start; }
  body.editing .grid.free section.w { cursor: default; position: relative; }
  body.editing .grid.free section.w .whead { cursor: move; touch-action: none; }
  .grid.free .wtools [data-size], .grid.free .wtools [data-tall] { display: none; }   /* the handles do what these did */
  .grid.free section.w.fmoving { z-index: 30; opacity: .82; box-shadow: 0 6px 22px rgba(43, 41, 37, .2); }
  .fh { display: none; position: absolute; z-index: 6; width: 10px; height: 10px; box-sizing: border-box;
        background: var(--surface); border: 1.5px solid var(--accent); border-radius: 2px; touch-action: none; }
  body.editing .grid.free .fh { display: block; }
  .fh[data-fh="nw"] { left: -6px; top: -6px; cursor: nwse-resize; }
  .fh[data-fh="ne"] { right: -6px; top: -6px; cursor: nesw-resize; }
  .fh[data-fh="sw"] { left: -6px; bottom: -6px; cursor: nesw-resize; }
  .fh[data-fh="se"] { right: -6px; bottom: -6px; cursor: nwse-resize; }
  .fh[data-fh="n"] { left: calc(50% - 5px); top: -6px; cursor: ns-resize; }
  .fh[data-fh="s"] { left: calc(50% - 5px); bottom: -6px; cursor: ns-resize; }
  .fh[data-fh="e"] { top: calc(50% - 5px); right: -6px; cursor: ew-resize; }
  .fh[data-fh="w"] { top: calc(50% - 5px); left: -6px; cursor: ew-resize; }
  .fghost { border: 2px dashed var(--accent); border-radius: var(--radius); background: color-mix(in srgb, var(--accent) 7%, transparent);
            pointer-events: none; z-index: 1; }
  .ffill { height: 1px; pointer-events: none; }                /* room under the last tile to drag into, edit mode only */
  body:not(.editing) .ffill { display: none; }
  /* a run of rows no tile covers, in edit mode: a hairline band with its caption; a click selects it and Delete takes it out */
  .fband { display: flex; align-items: center; gap: 8px; padding: 0 10px; z-index: 0; min-height: 0; overflow: hidden;
           margin-bottom: 4px; cursor: pointer; box-sizing: border-box;
           border: 1px dashed color-mix(in srgb, var(--muted) 45%, transparent); border-radius: var(--radius);
           background: color-mix(in srgb, var(--muted) 4%, transparent); }
  .fband .fbcap { font-family: var(--font-ui); font-size: 11px; letter-spacing: .06em; color: var(--muted); line-height: 1; }
  .fband.sel { border: 1.5px solid var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .fband.sel .fbcap { color: var(--accent); }
  body:not(.editing) .fband { display: none; }
  .editbar .modepick { display: flex; gap: 6px; align-items: center; }
  .editbar .modepick .btn.on { background: var(--accent); color: var(--surface); border-color: var(--accent); }
  .editbar .modepick label { display: flex; gap: 4px; align-items: center; font-size: 12.5px; color: var(--muted); }
  @media (max-width: 760px) {
    .grid.free { grid-auto-rows: auto; }
    .grid.free { row-gap: 22px; }
    .grid.free section.w { display: block; margin-bottom: 0; }
    .grid.free section.w > .wbody { overflow: visible; }
    .fh, .fghost, .ffill, .fband { display: none !important; }
  }
</style>
</head>
<body>
<header class="bar">
  <img class="mark" src="/static/sun-mark.png" alt="" width="36" height="28">
  <h1>Home</h1>
  <span class="sub" id="crumb"></span>
  <span class="spacer"></span>
  <nav class="panels" data-page="home"></nav>
  <button class="headbtn" type="button" id="edit" title="move the instruments around, resize them, switch them on and off">edit</button>
</header>
<div class="stage">
  <main id="main">
    <div class="sheet">
      <section class="card editbar" id="editbar">
        <span class="kicker">edit</span>
        <span class="meta">drag to move · the widths set how much of the row it takes · the switch takes it off the board · click a head or an empty band, then Delete</span>
        <span class="add" id="addlist"></span>
        <button class="btn" type="button" id="undo" disabled title="nothing to undo">undo</button>
        <button class="btn" type="button" id="redo" disabled title="nothing to redo">redo</button>
        <button class="btn" type="button" id="reset" title="forget the layout saved for you and go back to the default board">reset to default</button>
        <span class="lookpick" id="lookpick">
          <span class="meta">look</span>
          <select id="looksel" title="the fonts, colors and box shapes of every page: a file in skills/brain-viewer/looks/"></select>
          <button class="btn" type="button" id="lookimp" title="add a look from a .css file: one :root block of the tokens named in looks/readme.md">import a look</button>
          <input type="file" id="lookfile" accept=".css,text/css">
        </span>
        <span class="modepick" id="modepick">
          <span class="meta">board</span>
          <button class="btn" type="button" data-mode="grid" title="the tiles flow in order across the twelve columns">grid</button>
          <button class="btn" type="button" data-mode="free" title="place each tile at its own cell: drag it by its head, pull its corners and edges">free</button>
          <label class="fsnap" title="tiles land on the twelve-column cells as they are let go of"><input type="checkbox" id="freesnap" checked disabled> snap to cells</label>
          <span class="meta fsnap">snapping off comes later</span>
          <label class="fsnap" title="close the gaps after every drop and resize, so no empty row can form"><input type="checkbox" id="freegrav"> keep closed</label>
        </span>
      </section>
      <div class="grid" id="grid"></div>
      <p class="status-line" id="status"></p>
    </div>
  </main>
</div>
<div class="addrail" id="addrail" aria-label="instruments off the board">
  <div class="railgrab" data-grab><i></i><i></i><i></i></div>
  <div class="raillist" id="raillist"></div>
</div>
<script src="/static/viewer-common.js"></script>
<script>
// /  -- the home page (0.40.0, 2026-09-21: the add list is a window you can carry and pull bigger, and People is the
// week drawn with the map's own physics). Before that (0.39.0): the chat took the room under Next, a widget may stand
// two rows tall, one instrument can say something the others hear, and edit mode keeps the add list in reach.
// Before that (0.38.0): the masthead carries the day, the brain is a flow map, the lamps replaced the red strip, and
// every instrument with a pick keeps it in the layout.
// The owner asked for this opening page to look striking: the old one was static and uniform, and it needed
// visuals.
// THE REGISTRY IS THE FOLDER. Every instrument is one file in skills/brain-viewer/widgets/ that calls
// BV.widgets.register. This page asks the server which files are there (GET /api/widgets), loads each of them, and
// draws whatever registered. Nothing on this page knows the name of a single widget. The layout -- which are on, in
// what order, how wide, which are folded, which are opened out -- is a file per member on the server
// (GET / PUT /api/home/layout); this browser keeps a copy only so the board paints before the network answers. A row
// also carries that instrument's own SETTINGS (0.38.0), so a pick -- which drawing the masthead's slot shows, which
// project its track follows, which form the numbers wear -- travels with the board instead of living in one browser.
// THE BOARD IS TWELVE COLUMNS AND A SIZE IS A COLUMN SPAN, so a widget says how much of the width it takes in the
// same word the grid uses.
const { esc } = BV;
const $ = s => document.querySelector(s);
const CACHE = "bv.home.layout.u20";  // a PAINT CACHE ONLY, keyed by the fine row unit so an old-unit copy is never painted. The file on the server is the truth; this is never read back to it.
const REG = new Map();               // id -> what its file registered
let LAYOUT = [], SIZES = ["4", "6", "8", "12"], ROWS = [1, 2], EDIT = false;
let PALETTE = null;                  // where the add panel was left: {x, y, w, h}, saved beside the widgets (0.40.0)
let VIEWS = [];                      // named views (T-0214): [{id, name, settings}], saved beside the widgets
let MODE = "grid";                   // T-0213: "grid" flows the tiles in order; "free" puts each at its own x, y, w, h
const MODE_CACHE = "bv.home.mode";   // a paint cache, like CACHE
let GRAVITY = false;                 // free mode's "keep closed": close gaps after every drop and resize, saved as `gravity`
let PENDING_COMPACT = false;         // a board converted from the old 158px pitch this load: compacted once its tiles have measured
let COMPACT_UNTIL = 0;               // ... for the first seconds after it is drawn, while the widgets fill in
let SERVER_UNITS = true;             // false when the layout's server predates rowUnit (then save() sends nothing)
// true when a saved layout exists and could not be read at all (2026-09-24, T-0223): the default is drawn, and NOTHING
// is saved over the file until the person presses reset, so a board is never replaced behind their back
let SAVED_UNREADABLE = false;
let SEL = null;                      // edit mode's selection: {kind: "tile", id} or {kind: "band", y, h}; Delete acts on it
const MOUNTED = new Map();           // id -> {api, w}: what is already drawn, so a re-render does not re-run a composer
const SIZE_WORD = { "4": "third", "6": "half", "8": "two thirds", "12": "full width" };
const ROW_WORD = { 1: "one row", 2: "two rows" };
// ---- one instrument saying something the others can hear (0.39.0) ----
// The board is a set of separate files and that is the point, so this is deliberately the smallest thing that works:
// a name, a payload, and whoever asked for that name. The header's day replay uses it to tell the log which minute the
// line is standing on. Cleared on every render, because mount registers again.
const BUS = new Map();               // name -> Map(widget id -> handler)
function emit(name, detail) {
  const subs = BUS.get(name); if (!subs) return;
  for (const fn of Array.from(subs.values())) { try { fn(detail); } catch (e) {} }
}

const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
function when(iso) {
  if (!iso) return "";
  const t = new Date(iso); if (isNaN(t)) return String(iso);
  const mins = Math.round((Date.now() - t.getTime()) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m ago`;
  if (mins < 60 * 24) return `${Math.round(mins / 60)}h ago`;
  return t.toLocaleDateString(undefined, { month: "short", day: "numeric" });

const clip = (s, n) => { s = String(s || "").replace(/\s+/g, " ").trim(); return s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s; };
// the LOCAL day, the way the ledgers write one: toISOString() after 5pm Pacific reads tomorrow
const isoDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

// ---- the contract a widget file writes against ----
// what a widget reads, shown to a person: the endpoint in parentheses is for whoever reads the file, not the board
function plain(src) { return String(src || "").replace(/\s*\((GET|POST|PUT|DELETE)[^)]*\)/g, "").trim(); }
// register({id, title, size, defaultOn, source, card?, head?, expand?, mount(el, api), refresh?(el, api)}). The id must
// equal the filename stem; the server builds the registry from the filenames, so a mismatch simply never draws.
//   size    "4" | "6" | "8" | "12" -- how many of the twelve columns it takes
//   card    true wears the notepad's look; false (the default) is a hairline and the open ground
//   head    false draws no head at all, for an instrument that is its own title
//   expand  true puts an open-out control in the head; the state is saved in the layout beside size and collapsed
//   fillRows for a widget that needs a working height rather than its content's (a message list, a drawing): the height
//           in free-mode units (20px) its tile takes when nobody has fixed one. Every other tile fits its content.
// THE CONTRACT NUMBER (0.48.0). A widget declares `contract: N`, the api version it was written against. This viewer
// implements BV.contract; a widget with no number or a higher one is refused and its tile reddened, never half-drawn.
// A widget a PERSON wrote (viewer/widgets/, origin "user" in /api/widgets) never takes an id the viewer ships.
BV.contract = 1;
const WROWS = new Map();             // id -> its row in /api/widgets: origin, path, url, conflict
const BY_URL = new Map();            // the pathname a widget file is served at -> its row
const CORE_IDS = new Set();
function refusedWidget(w, msg) {

           source: w.source || "", card: false, contract: BV.contract, refused: msg,
           mount() { throw new Error(msg); }, refresh() { throw new Error(msg); } };
}
BV.widgets = {
  register(w) {
    if (!w || !w.id || typeof w.mount !== "function") return;
    let row = null;
    try { const s = document.currentScript; row = s && s.src ? BY_URL.get(new URL(s.src, location.href).pathname) : null; } catch (e) {}
    if (row && row.origin === "user" && (CORE_IDS.has(w.id) || w.id !== row.id)) {
      // a person's file answering to a core id is drawn under its own name, red, and the core widget is untouched
      if (!REG.has(row.id)) REG.set(row.id, refusedWidget({ id: row.id, title: (w.title || row.id) + " (yours)", size: w.size },
                                                            CORE_IDS.has(w.id) ? "id taken by a core widget" : "its id must be its file name, " + row.id));
      return;
    }
    const c = w.contract;
    if (!(Number.isInteger(c) && c >= 1 && c <= BV.contract)) {
      REG.set(w.id, refusedWidget(w, c == null ? "written for a newer viewer (it declares no contract number; this viewer is contract " + BV.contract + ")"
                                               : "written for a newer viewer (contract " + c + "; this viewer is contract " + BV.contract + ")"));
      return;
    }
    REG.set(w.id, w);
  },
  list: () => Array.from(REG.values()),
};

// ---- one read per endpoint per tick ----
// Four instruments want the ledgers and three want the calendar. The board refreshes them all in the same instant, so
// a read is shared for a few seconds: without this the minute tick asks the server for /api/projects four times over.
const GETS = new Map();              // path -> {at, p}
const GET_TTL = 8000;
const GET_TIMEOUT = 20000;           // a read is cut after this and the tile shows the break (see shared)
function shared(path) {
  const hit = GETS.get(path);
  if (hit && Date.now() - hit.at < GET_TTL) return hit.p;
  const p = (async () => {
    // a read that never answers must fail, not hang: a stalled fetch would sit in this cache for the TTL and every tile
    // waiting on it would stay blank with no red edge (2026-09-22, the blank board the owner saw), so it is cut at GET_TIMEOUT
    const ac = new AbortController(), timer = setTimeout(() => ac.abort(), GET_TIMEOUT);
    let r;
    try { r = await fetch(path, { signal: ac.signal }); }
    catch (e) { const err = new Error(e && e.name === "AbortError" ? ("no answer in " + (GET_TIMEOUT / 1000) + "s") : (e && e.message || "the read failed")); err.status = 0; throw err; }
    finally { clearTimeout(timer); }
    let j = null; try { j = await r.json(); } catch (e) {}
    if (!r.ok) { const err = new Error((j && j.error) || ("the server answered " + r.status)); err.status = r.status; throw err; }
    return j;
  })();
  p.catch(() => GETS.delete(path));   // a failure is not cached: the next tick tries again
  GETS.set(path, { at: Date.now(), p });
  return p;
}

// ---- a broken instrument shows it (T-0217) ----
// The owner asked on 2026-09-21 that a breaking widget always be caught and visible. A widget whose mount or
// refresh throws, or whose api.get fails for any reason but the 403 a team copy gives, turns its own tile red-edged:
// the error's first line, the file, and a press that hands the fix to a builder. The break is told to the server ONCE
// per widget and error per page load (POST /api/widgets/broken), which files one finding on the brain-viewer ledger
// and lights the System panel's widgets lamp red. A later run of the same widget that goes through clean mends the tile.
const REPORTED = new Set();          // "id|first line" already sent to the server from this page
const WIDGET_FILE = id => (WROWS.get(id) && WROWS.get(id).path) || ("skills/brain-viewer/widgets/" + id + ".js");
const WIDGET_URL = id => (WROWS.get(id) && WROWS.get(id).url) || ("/static/widgets/" + id + ".js");
function firstLine(e) {
  const s = String((e && (e.message || (typeof e === "string" ? e : ""))) || e || "it failed").split("\n")[0].trim();
  return (s || "it failed").slice(0, 240);
}
function breakTile(w, card, err, where) {
  const msg = firstLine(err);
  card._broke = true;
  card.classList.add("wbroken");
  card.classList.remove("whidden");
  let box = card.querySelector(".wbroke");
  if (!box) { box = document.createElement("div"); box.className = "wbroke"; card.appendChild(box); }
  box.innerHTML = `<p class="wbroke-say">${esc(msg)}</p>
    <p class="wbroke-do"><a href="${esc(WIDGET_URL(w.id))}" target="_blank" rel="noopener" title="${esc(WIDGET_FILE(w.id))}">open the file</a>
    <a href="#" data-fixw="${esc(w.id)}" data-fixmsg="${esc(msg)}" title="start a builder on the Brain Viewer ledger with this file and this error">ask the builder to fix</a></p>`;
  const key = w.id + "|" + msg;
  if (REPORTED.has(key)) return;
  REPORTED.add(key);
  fetch("/api/widgets/broken", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: w.id, file: WIDGET_FILE(w.id), error: msg, where: where || "",
                           stack: String((err && err.stack) || "").slice(0, 2000) }) }).catch(() => {});
}
function mendTile(card) {
  card._broke = false;
  card.classList.remove("wbroken");
  const b = card.querySelector(".wbroke"); if (b) b.remove();
}
// one run of mount or refresh, watched: a throw or a rejected promise breaks the tile, a clean run mends it
function guarded(w, api, fn, where) {
  const card = api.card;
  card._broke = false;
  let out;
  try { out = fn.call(w, api.el, api); }
  catch (e) { breakTile(w, card, e, where); return; }
  Promise.resolve(out).then(() => { if (!card._broke) mendTile(card); }, e => breakTile(w, card, e, where));
}
// the builder, started the way a send-to from the agents page starts one: the chat page reads the handoff and sends it
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest("[data-fixw]");
  if (!a) return;
  e.preventDefault();
  const id = a.dataset.fixw, file = WIDGET_FILE(id);
  const text = `The home widget ${file} is broken on the board. The error: ${a.dataset.fixmsg || "unknown"}. `
    + `Read skills/brain-viewer/widgets/curriculum.md first, then fix that file. It is done when node --check passes on it `
    + `and python skills/brain-viewer/widgets/harness.py ${file} passes. The finding is open on the Brain Viewer ledger `
    + `under a key starting widget-broken:${id}; say its id when you finish.`;
  try { sessionStorage.setItem("bv.handoff", JSON.stringify({ project: "brain-viewer-holon", text })); } catch (x) {}

});
// a throw LATER, from a widget's timer, handler or unawaited promise, is traced to its file by the stack and breaks that tile
function laterBreak(err, where) {
  const m = /\/static\/(?:user-)?widgets\/([a-z0-9_-]+)\.js/.exec(String((err && err.stack) || "") + " " + String(where || ""));
  const hit = m && MOUNTED.get(m[1]);
  if (hit && !(err && err.status === 403)) breakTile(hit.w, hit.el, err, "later");
}
window.addEventListener("error", e => laterBreak(e.error || e.message, e.filename));
window.addEventListener("unhandledrejection", e => laterBreak(e.reason, ""));

// What every widget is handed. Small on purpose: read one endpoint, say a count, draw your own shape in the body.
function widgetApi(w, card, row) {
  const body = card.querySelector(".wbody"), cnt = card.querySelector(".wcount"), ctl = card.querySelector(".wctl");
  const api = {
    esc, plural, when, clip, el: body, card, id: w.id, row,
    // a failed read breaks the tile (T-0217), except the 403 a team copy answers with, which is not a fault
    get: path => shared(path).catch(e => { if (!e || e.status !== 403) breakTile(w, card, e, "GET " + path); throw e; }),
    count(t) { if (cnt) cnt.textContent = t == null || t === "" ? "" : String(t); },
    say(t) { body.innerHTML = `<p class="wsay">${esc(t)}</p>`; },
    // 403 on a team copy is not a failure: those endpoints simply are not part of a copy
    fail(e) { if (!e || e.status !== 403) breakTile(w, card, e, "fail"); api.count(""); api.show(true); api.say(e && e.status === 403 ? "not on this copy" : "could not read it: " + (e && e.message || e)); },
    html(h) { body.innerHTML = h; },
    // an instrument with nothing to report draws NOTHING, rather than an empty card
    show(on) { card.classList.toggle("whidden", !on); },
    // the widget's own control, in its head, left of the edit tools
    head(h) { if (ctl) ctl.innerHTML = h; },
    // ---- the instrument's own choices (0.38.0) ----
    // A small object saved in this widget's row of the layout. Read it in mount, write it when the person picks
    // something, and the pick is there on the next reload and on the next machine. An id may be given to read
    // another instrument's settings (the mantra line asks the masthead for nothing, but the door is open).
    settings(id) {
      const r = !id || id === w.id ? row : rowOf(id);
      return (r && r.settings) || {};
    },
    setSettings(id, obj) {
      if (id && typeof id === "object") { obj = id; id = w.id; }
      const r = !id || id === w.id ? row : rowOf(id);
      if (!r) return {};
      r.settings = Object.assign({}, r.settings || {}, obj || {});
      save();
      return r.settings;
    },
    // ---- saying something the rest of the board can hear ----
    // api.emit(name, detail) from the instrument that knows; api.on(name, fn) in the mount of whoever wants to follow
    // it. One handler per instrument per name, so a re-mount replaces rather than stacks.
    emit,
    on(name, fn) {
      if (typeof fn !== "function") return;
      if (!BUS.has(name)) BUS.set(name, new Map());
      BUS.get(name).set(w.id, fn);
    },
    // opened out to the full width, in place; saved with the layout
    get expanded() { return !!(row && row.expanded); },
    setExpanded(on) {
      if (!row) return;
      row.expanded = !!on;
      card.classList.toggle("wide", !!on);
      save();
      const f = w.resize; if (typeof f === "function") { try { f.call(w, body, api); } catch (e) {} }
    },
    set(o) {
      api.count(o.count);
      const ls = (o.lines || []).slice(0, o.max || 3);
      body.innerHTML = (ls.length ? `<ul class="wlines">${ls.map(l => {
        const inner = `${esc(l.text)}`;
        const tail = l.tail ? `<span class="wt">${esc(l.tail)}</span>` : "";
        const ti = l.title ? ` title="${esc(l.title)}"` : "";
        return `<li${l.cls ? ` class="${esc(l.cls)}"` : ""}>${l.href ? `<a href="${esc(l.href)}"${ti}>${inner}</a>` : `<span class="wl"${ti}>${inner}</span>`}${tail}</li>`;
      }).join("")}</ul>` : "")
        + (o.note ? `<p class="wsay">${esc(o.note)}</p>` : "")
        + (o.link ? `<a class="wmore" href="${esc(o.link.href)}">${esc(o.link.text)}</a>` : "");
    },
    // ---- the one count of what has a day on it (0.37.1) ----
    // Two instruments read the same ledgers and said different numbers: the masthead said "Three decisions due today"
    // off BV.day, which counts every owner and every kind, while Decide said "1 on the clock" off its own filter. One
    // rule, in one place, so they cannot disagree: an OPEN TASK OF THE OWNER carrying a due day, a held one left out
    // until its day comes back. `rows` is everything dated, soonest first; `due` is the part of it on the clock today
    // or already behind it. Both take the rows of one GET /api/projects.
    onTheClock(projects) {
      const today = (projects && projects.today) || isoDay(new Date());
      const rows = [];
      for (const p of (projects && projects.projects) || []) {
        if (!p.exists) continue;
        for (const g of p.groups || []) for (const i of g.items || []) {
          if (i.kind !== "task" || i.mark !== " " || i.owner !== BV.owner || !i.due) continue;
          if (i.until && i.until > today) continue;
          rows.push(Object.assign({}, i, { projectName: p.name || p.id, project: p.id }));
        }
      }
      rows.sort((a, b) => String(a.due).localeCompare(String(b.due)) || String(a.id).localeCompare(String(b.id)));
      return { today, rows, due: rows.filter(r => r.due <= today) };
    },
    // the shape almost every small widget wants: read one endpoint, turn it into what set() takes
    async auto(path, build) {
      try { api.set(build(await api.get(path)) || {}); }
      catch (e) { api.fail(e); }
    },
  };
  return api;
}

// ---- the layout ----
function defaultsFromRegistry() {
  return BV.widgets.list().map(w => ({ id: w.id, on: !!w.defaultOn, size: w.size || "4", rows: w.rows === 2 ? 2 : 1,
                                       collapsed: false, expanded: false, settings: {} }));
}
function rowOf(id) { return LAYOUT.find(r => r.id === id); }
async function loadLayout() {
  let savedUnit = null;
  try {
    const r = await fetch("/api/home/layout");
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || ("the server answered " + r.status));
    savedUnit = Number.isInteger(j.rowUnit) ? j.rowUnit : null;
    SERVER_UNITS = "rowUnit" in j;       // a server that answers no rowUnit key predates the fine unit: see save()
    // THE SAVED-LAYOUT MIGRATION RULE (widgets/readme.md, T-0223): a row whose widget was removed or renamed is
    // dropped, every other row keeps its place, size and settings, and a widget the file does not name arrives off
    // (below). A partial layout is a layout: it is honoured, never swapped for the default.
    LAYOUT = (j.widgets || []).filter(row => REG.has(row.id));
    SAVED_UNREADABLE = !!(j.error && !j.saved && j.updatedAt);
    SIZES = j.sizes || SIZES;
    ROWS = j.rows || ROWS;
    PALETTE = paletteOf(j.palette);
    MODE = j.mode === "free" ? "free" : "grid";
    GRAVITY = j.gravity === true;
    VIEWS = Array.isArray(j.views) ? j.views.filter(v => v && REG.has(v.id) && v.name) : [];
    if (!LAYOUT.length) LAYOUT = defaultsFromRegistry();
    if (j.error) $("#status").textContent = "the saved layout could not be read, so this is the default: " + j.error;
  } catch (e) {
    LAYOUT = defaultsFromRegistry();
    $("#status").textContent = "could not reach the saved layout: " + e.message;
  }
  // every widget the folder has that the layout does not name goes on the end, off, so a new file is never invisible
  for (const w of BV.widgets.list()) if (!rowOf(w.id)) LAYOUT.push({ id: w.id, on: false, size: w.size || "4", rows: w.rows === 2 ? 2 : 1, collapsed: false, expanded: false, settings: {} });
  for (const r of LAYOUT) {
    if (!r.settings || typeof r.settings !== "object") r.settings = {};
    if (ROWS.indexOf(r.rows) < 0) r.rows = (REG.get(r.id) || {}).rows === 2 ? 2 : 1;
  }
  // the fine row unit (2026-09-22): a board saved on the old 158px pitch (no rowUnit on the file) is converted once,
  // here, and carries rowUnit from its next save. Every tile comes up fitting its content, and the board is compacted
  // once they have measured, so it comes up tight.
  if (LAYOUT.some(r => Number.isInteger(r.y))) {
    const cv = convertLayout(LAYOUT, savedUnit);
    LAYOUT = cv.rows;
    if (cv.converted) PENDING_COMPACT = true;
    // a cell saved with no h is an auto tile: it gets a first guess here and measures itself once it is drawn
    for (const r of LAYOUT) if ([r.x, r.y, r.w].every(Number.isInteger) && !Number.isInteger(r.h)) { r.h = heightOf(r); delete r.hFixed; }
    LAYOUT = readHeights(LAYOUT);         // a runaway or untrusted height saved earlier comes back fitting (the cap)
  }
  try { localStorage.setItem(CACHE, JSON.stringify(LAYOUT)); } catch (e) {}
}
// ---- undo (2026-09-22) ----
// The owner asked for ctrl+z or an undo button in the editor. Every change a person makes reaches save(), so the
// stack is kept there: the board as it stood at the last save (BASE) is pushed whenever the new one differs from it by
// more than a tile fitting its content. UNDO_SAID, set by the call sites that know what moved, names the change;
// otherwise describeChange reads it off the difference. The stack lives until the page reloads, and is not saved.
let UNDO = { past: [], future: [] }, BASE = null, UNDO_SAID = "";   // undoEmpty's shape; it is defined further down
const boardState = () => JSON.stringify({ rows: LAYOUT, mode: MODE, gravity: GRAVITY, views: VIEWS });
const titleMap = () => { const o = {}; for (const [id, w] of REG) o[id] = w.title || id; return o; };
function track(said) {
  const cur = boardState(), hint = said || UNDO_SAID;
  UNDO_SAID = "";
  if (BASE === null || cur === BASE) { BASE = cur; return; }
  const words = hint || describeChange(JSON.parse(BASE), JSON.parse(cur), titleMap());
  if (words) UNDO = undoPush(UNDO, BASE, words, UNDO_CAP);
  BASE = cur;
  paintUndo();
}
function paintUndo() {
  const u = $("#undo"), r = $("#redo");
  if (u) { u.disabled = !UNDO.past.length; u.title = UNDO.past.length ? "undo: " + UNDO.past[UNDO.past.length - 1].said + " (Ctrl+Z)" : "nothing to undo"; }
  if (r) { r.disabled = !UNDO.future.length; r.title = UNDO.future.length ? "redo: " + UNDO.future[UNDO.future.length - 1].said + " (Ctrl+Shift+Z)" : "nothing to redo"; }
}
function stepUndo(back) {
  if (BASE !== null) track();              // anything not yet on the stack goes on first
  const step = back ? undoBack(UNDO, boardState()) : undoForward(UNDO, boardState());
  if (!step) { paintUndo(); return; }
  UNDO = step.st;
  const s = JSON.parse(step.state);
  LAYOUT = s.rows; MODE = s.mode === "free" ? "free" : "grid"; GRAVITY = s.gravity === true; VIEWS = s.views || [];
  SEL = null; MOUNTED.clear();
  try { localStorage.setItem(MODE_CACHE, MODE); } catch (e) {}
  render(); paintMode();
  BASE = boardState();                     // the restored board is the new baseline, so this save pushes nothing
  paintUndo();
  const said = `${back ? "undid" : "redid"}: ${step.said}`;
  $("#status").textContent = said;
  save().then(() => { if ($("#status").textContent === "saved") $("#status").textContent = said + " (saved)"; });
}
document.addEventListener("keydown", e => {
  if (!EDIT || !(e.ctrlKey || e.metaKey) || e.altKey) return;
  const t = e.target;
  if (t && ((t.closest && t.closest("input, textarea, select, [contenteditable]")) || t.isContentEditable)) return;
  const k = String(e.key || "").toLowerCase();
  if (k === "z" && !e.shiftKey) { e.preventDefault(); stepUndo(true); }
  else if ((k === "z" && e.shiftKey) || (k === "y" && !e.shiftKey)) { e.preventDefault(); stepUndo(false); }
});
async function save() {
  track();
  try { localStorage.setItem(CACHE, JSON.stringify(LAYOUT)); } catch (e) {}
  // a server older than the fine row unit would drop rowUnit and refuse the taller h, and the next load would convert
  // the cells a second time, so nothing is sent to it until it has been restarted onto the new serve.py
  if (!SERVER_UNITS) { $("#status").textContent = "not saved: the viewer's server predates the finer rows; restart it and this board saves"; return; }
  if (SAVED_UNREADABLE) { $("#status").textContent = "not saved: your saved board could not be read, so it is kept as it is on disk; press reset to start a new one"; return; }
  try {
    const r = await fetch("/api/home/layout", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ widgets: LAYOUT, palette: PALETTE, views: VIEWS, mode: MODE, gravity: GRAVITY, rowUnit: ROW_UNIT }) });
    const j = await r.json();
    $("#status").textContent = r.ok ? "saved" : "not saved: " + (j.error || r.status);
  } catch (e) { $("#status").textContent = "not saved: " + e.message; }
}
async function reset() {
  try {
    const r = await fetch("/api/home/layout", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ reset: true }) });
    const j = await r.json();
    LAYOUT = (j.widgets || defaultsFromRegistry()).filter(r2 => REG.has(r2.id));
    SAVED_UNREADABLE = false;           // the person pressed reset: from here the board saves again
    PALETTE = null;                     // the panel goes back to the right edge with everything else
    MODE = "grid";                      // and the board back to the grid (T-0213)
    GRAVITY = false;
    PENDING_COMPACT = false; SEL = null;
    try { localStorage.removeItem(MODE_CACHE); } catch (e) {}
    paintMode();
    if (Array.isArray(j.views)) VIEWS = j.views.filter(v => v && REG.has(v.id) && v.name);   // a reset keeps the views
    try { localStorage.removeItem(CACHE); } catch (e) {}
    $("#status").textContent = "back to the default board";
    render(); placeRail();
    track("reset to default");            // undo brings the board from before the reset back

  } catch (e) { $("#status").textContent = "could not reset it: " + e.message; }
}

// ---- drawing the board ----
function tile(r) {
  const w = REG.get(r.id);
  const el = document.createElement("section");
  const shape = boxClass(r, w);          // the widget's own shape, unless the tile's style picked another (T-0208)
  el.className = "w " + shape + (r.collapsed ? " folded" : "") + (r.expanded ? " wide" : "");
  el.dataset.w = r.id;
  el.dataset.span = SIZES.indexOf(r.size) >= 0 ? r.size : "4";

// ---- a widget's rules are settings, not code (T-0214) ----
// The owner asked on 2026-09-21 that a user be able to add rules to a widget as needed. A widget declares the
// filters it understands in its register call, `filters: [{key, label, kind, options?, default?, any?, min?, max?,
// step?, zero?}]`, and this draws ONE row for all of them in edit mode, the style panel's twin, writing into that
// widget's `settings` in the layout and re-mounting the tile. A tile whose settings differ from the default can be saved
// as a named view, which the add list offers as its own entry. Anything the filters cannot say goes into the box at the

  owners: { from: "/api/projects", list: j => [["*", "anyone"]].concat(uniq(items(j).map(i => i.owner)).map(o => [o, o])) },
  tags: { from: "/api/projects", list: j => uniq([].concat(...items(j).map(i => i.tags || [])).filter(t => !/^(source|key):/.test(t))).map(t => [t, t]) },
  sources: { from: "/api/projects", list: j => uniq(items(j).map(i => i.source)).map(s => [s, s]) },
  people: { from: "/api/people", list: j => (j.people || []).map(p => [p.slug, String(p.name || p.slug).split("·")[0].trim()])
                                              .sort((a, b) => a[1].localeCompare(b[1])) },

// ---- free mode: every tile at its own cell (T-0213) ----

// This round ships the snapped half. Each on-board row
// carries x and y (column 0 to 11, row index) and w and h (columns 1 to 12, rows), drawn as explicit lines on the same
// twelve columns with a fine row unit (ROW_UNIT, 20px), so the board grows to the last tile and an empty row stays
// empty. A tile's h follows its content unless the person fixed it (hFixed), or its widget declares fillRows.
// The head carries a tile, the eight handles pull its corners and edges, and both land on the cell edges when let go,
// with the snapped place drawn as a dashed ghost while it is in the air. A tile put down on another pushes that one
// down by rows, the way a grid does, so no two share a cell. The first switch to free derives every cell from the grid

// The drag is the Forge's shape (press, three pixels before it counts, one frame per move, the real change on the
// drop), written small here because the Forge's handler is tied to its own drawing and zoom.

// reads no page, no global and nothing but what it is handed.
// THE ROW UNIT (2026-09-22). Rows were 140px with an 18px gap, so every height was a whole 158px step and the masthead,
// whose content needs about 190px, stood 298px with a third of it empty. Rows are now ROW_UNIT (20px) with no gap (the
// tile's bottom margin is the gap), so a tile's h can follow its content. A board saved on the old pitch carries no
// rowUnit and is converted once on load (convertLayout).

const narrow = () => !!(window.matchMedia && window.matchMedia("(max-width: 760px)").matches);
const scrolled = () => ($("#main") ? $("#main").scrollTop : 0) + (window.scrollY || 0);
document.addEventListener("pointerdown", e => {
  if (!EDIT || MODE !== "free" || narrow() || e.button !== 0) return;
  const t = e.target, hd = t.closest && t.closest("#grid .fh");
  const head = !hd && t.closest && t.closest("#grid section.w .whead");
  if (!hd && !head) return;
  if (head && t.closest("button, a, input, select, textarea, label")) return;
  const el = t.closest("section.w"), r = el && rowOf(el.dataset.w);
  if (!r || !hasCell(r)) return;
  e.preventDefault();
  const b = el.getBoundingClientRect();
  FDRAG = { el, r, dir: hd ? hd.dataset.fh : "move", sx: e.clientX, sy: e.clientY, s0: scrolled(), bw: b.width, bh: b.height,
            start: { x: r.x, y: r.y, w: r.w, h: r.h }, p: pitch(), began: false, at: null, raf: 0, id: e.pointerId, cap: t };
  try { t.setPointerCapture(e.pointerId); } catch (x) {}
});
document.addEventListener("pointermove", e => {
  if (!FDRAG || e.pointerId !== FDRAG.id) return;
  FDRAG.at = { x: e.clientX, y: e.clientY };
  edgeScroll(e.clientY);
  if (!FDRAG.raf) FDRAG.raf = requestAnimationFrame(freeFrame);
});
const freeDelta = d => ({ dx: d.at.x - d.sx, dy: d.at.y - d.sy + (scrolled() - d.s0) });
function freeFrame() {
  const d = FDRAG; if (!d) return;
  d.raf = 0;
  if (!d.at) return;
  const { dx, dy } = freeDelta(d);
  if (!d.began) { if (Math.hypot(dx, dy) < 3) return; d.began = true; d.el.classList.add("fmoving"); }
  const st = d.el.style, dir = d.dir;
  if (dir === "move") st.transform = `translate(${dx}px, ${dy}px)`;
  else {
    let w = d.bw, h = d.bh;
    if (dir.includes("e")) w = d.bw + dx;
    if (dir.includes("w")) w = d.bw - dx;
    if (dir.includes("s")) h = d.bh + dy;
    if (dir.includes("n")) h = d.bh - dy;
    w = Math.max(40, w); h = Math.max(40, h);
    st.width = w + "px"; st.height = h + "px";
    st.transform = `translate(${dir.includes("w") ? d.bw - w : 0}px, ${dir.includes("n") ? d.bh - h : 0}px)`;
  }
  showGhost(snapRect(d.start, dir, dx / d.p.x, dy / d.p.y, FREE_MIN_H));
}
const FREE_MIN_H = 2;                // the fewest units (40px) a pull on a height handle leaves a tile
// a pull on the top or bottom edge, or on a corner, fixes the tile's height; the side edges and a move do not
const fixesHeight = dir => dir !== "move" && (dir.includes("n") || dir.includes("s"));
function freeUp(e, cancel) {
  const d = FDRAG; if (!d || (e && e.pointerId !== d.id)) return;
  FDRAG = null; stopEdge();
  if (d.raf) cancelAnimationFrame(d.raf);
  try { d.cap.releasePointerCapture(d.id); } catch (x) {}
  hideGhost();
  d.el.classList.remove("fmoving");
  for (const p of ["transform", "width", "height"]) d.el.style.removeProperty(p);
  if (cancel || !d.at) return;
  const { dx, dy } = freeDelta(d);
  if (!d.began && Math.hypot(dx, dy) < 3) return;   // a press that went nowhere; a fast one no frame saw still counts
  const before = snapshot();
  const to = snapRect(d.start, d.dir, dx / d.p.x, dy / d.p.y, FREE_MIN_H);
  Object.assign(d.r, to);
  // a corner pulled only sideways leaves the height as it was, and so leaves it fitting its content
  if (fixesHeight(d.dir) && to.h !== d.start.h) d.r.hFixed = true;
  const pushed = settle(cellsOf(onRows()), d.r.id);
  writeCells(GRAVITY ? closeGaps(pushed) : pushed);   // "keep closed": no empty row survives a drop or a resize
  const w = REG.get(d.r.id) || {};
  UNDO_SAID = `${d.r.view || w.title || d.r.id} ${d.dir === "move" ? "moved" : "resized"}`;
  const tall = d.r.hFixed ? `${d.r.h * ROW_UNIT}px tall, fixed (double-click the bottom handle to fit it again)`
    : fillOf(d.r) ? "its working height" : "fitting its content";
  const said = `${d.r.view || w.title || d.r.id}: column ${d.r.x + 1}, ${plural(d.r.w, "column")} wide, ${tall}`;
  relayFree(before, said);
  queueFit();
}
// a double-click on the bottom edge handle frees a fixed height: the tile fits its content again (or takes its
// widget's working height, for one that declares fillRows)
document.addEventListener("dblclick", e => {
  const hd = e.target.closest && e.target.closest("#grid .fh[data-fh='s']");
  if (!hd || !EDIT || MODE !== "free") return;
  const el = hd.closest("section.w"), r = el && rowOf(el.dataset.w); if (!r) return;
  e.preventDefault();
  const before = snapshot(), w = REG.get(r.id) || {};
  delete r.hFixed;
  UNDO_SAID = `${r.view || w.title || r.id} height freed`;
  const f = fillOf(r);
  if (f) writeCells(refit(cellsOf(onRows()), r.id, f));
  relayFree(before, `${r.view || w.title || r.id}: the height is ${f ? "back to its working height" : "fitting its content again"}`);
  queueFit();
});
// "keep closed": saved with the board as `gravity`; switched on, it closes what is open now
document.addEventListener("change", e => {
  if (!e.target || e.target.id !== "freegrav") return;
  GRAVITY = !!e.target.checked;
  if (GRAVITY) { compactNow(); return; }
  save();
});
// ---- the selection, and the Delete key (2026-09-22) ----
// The owner asked that a click on empty space plus the Delete key remove it. In edit mode a click on a tile's head
// (anywhere that is not a control, for a tile with no head) selects the tile; a click on empty board space selects the
// band of fully empty rows it lands in. Delete or Backspace takes out what is selected: a band goes and everything
// below it comes up; a tile goes off the board. Escape lets go. Keys typed into a box are never taken.
function pickAt(e) {
  const t = e.target, grid = $("#grid");
  if (!t || !t.closest || !grid.contains(t)) return false;
  if (t.closest("button, a, input, select, textarea, label, [contenteditable]")) return false;
  const card = t.closest("section.w");
  if (card) {
    const r = rowOf(card.dataset.w), w = REG.get(card.dataset.w) || {};
    if (r && (t.closest(".whead") || w.head === false)) {
      SEL = { kind: "tile", id: r.id }; paintSel();
      $("#status").textContent = `${r.view || w.title || r.id} selected: Delete takes it off the board, Escape lets go`;
      return true;
    }
    if (SEL) { SEL = null; paintSel(); }
    return false;
  }
  const b = MODE === "free" ? bandAt(cellsOf(onRows()), cellAt(e.clientX, e.clientY).y) : null;
  SEL = b ? Object.assign({ kind: "band" }, b) : null;
  paintSel();
  if (b) $("#status").textContent = `${b.h * ROW_UNIT}px of empty space selected: Delete takes it out, Escape lets go`;
  return true;
}
const typing = t => !!(t && ((t.closest && t.closest("input, textarea, select")) || t.isContentEditable));
document.addEventListener("keydown", e => {
  if (!EDIT || !SEL || typing(e.target)) return;
  if (e.key === "Escape") { SEL = null; paintSel(); $("#status").textContent = ""; return; }
  if (e.key !== "Delete" && e.key !== "Backspace") return;
  e.preventDefault();
  const s = SEL; SEL = null;
  if (s.kind === "band") {
    const cells = cellsOf(onRows()), b = MODE === "free" && bandAt(cells, s.y);
    if (!b) { paintSel(); return; }
    const before = snapshot();
    writeCells(removeBand(cells, b));
    UNDO_SAID = "empty space taken out";
    relayFree(before, `${b.h * ROW_UNIT}px of empty space taken out, everything below it came up`);
    return;
  }
  const r = rowOf(s.id); if (!r || !r.on) { paintSel(); return; }
  const said = `${r.view || (REG.get(r.id) || {}).title || r.id} is off the board; add it back from the add list`;
  LAYOUT = turnOff(LAYOUT, r.id);
  MOUNTED.delete(r.id);
  render();
  $("#status").textContent = said;
  save().then(() => { if ($("#status").textContent === "saved") $("#status").textContent = said; });
});
document.addEventListener("pointerup", e => freeUp(e, false));
document.addEventListener("pointercancel", e => freeUp(e, true));

// ---- the "?" panel ----
// Every page's "?" shows what that page is, from help.json. This page adds a line per instrument on the board, taken
// from each widget's own `source`, so the panel answers "what am I looking at" without a word of explanation on the page.
BV.help.extra = () => ({
  title: "Instruments on your board",
  rows: LAYOUT.filter(r => r.on && REG.has(r.id)).map(r => ({ name: REG.get(r.id).title || r.id, line: plain(REG.get(r.id).source) })),
});

// ---- boot ----
async function loadWidgetFiles() {
  let reg;
  try { reg = await (await fetch("/api/widgets")).json(); }
  catch (e) { $("#status").textContent = "could not read the widget folder: " + e.message; return; }
  for (const w of reg.widgets || []) {
    WROWS.set(w.id, w);
    if (w.url) BY_URL.set(w.url, w);
    if ((w.origin || "core") === "core") CORE_IDS.add(w.id);
    // a row the server would not load (a person's file under a core id) is still a tile, red, saying why
    if (!w.url && w.conflict) REG.set(w.id, refusedWidget({ id: w.id, title: (w.title || w.id) + " (yours)", size: w.size }, w.conflict));
  }
  // core files first, then the person's: a core id is taken before any user file can ask for it
  const load = rows => Promise.all(rows.map(w => new Promise(res => {
    const s = document.createElement("script");
    s.src = w.url; s.onload = res; s.onerror = () => { $("#status").textContent = `the widget file ${w.file} did not load`; res(); };
    document.head.appendChild(s);
  })));
  const rows = (reg.widgets || []).filter(w => w.url);
  await load(rows.filter(w => (w.origin || "core") === "core"));
  await load(rows.filter(w => (w.origin || "core") !== "core"));
}
async function start() {
  $("#crumb").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  await loadWidgetFiles();
  // paint from this browser's copy first so the board is there immediately, then take the file's word for it
  try { MODE = localStorage.getItem(MODE_CACHE) === "free" ? "free" : "grid"; } catch (e) {}
  try { const c = JSON.parse(localStorage.getItem(CACHE) || "null"); if (Array.isArray(c) && c.length) { LAYOUT = readHeights(c.filter(r => REG.has(r.id))); render(); } } catch (e) {}
  await loadLayout();
  try { localStorage.setItem(MODE_CACHE, MODE); } catch (e) {}
  render();
  paintMode();
  BASE = boardState(); paintUndo();       // the board as loaded is where undo starts
  wireFreeGrid();
  wireRail();
  setInterval(() => { if (!document.hidden) refreshAll(); }, 60000);
  BV.glossary.mount("home");
}
start().catch(e => { $("#grid").innerHTML = `<p class="note">Could not build the board: ${esc(e.message)}</p>`; });
</script>
