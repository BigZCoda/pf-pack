<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today</title>
<link rel="stylesheet" href="/static/viewer-tokens.css">
<link rel="icon" type="image/png" href="/static/sun-favicon.png">
<style>
  /* layout only; every color and font comes from viewer-tokens.css */
  body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .stage { flex: 1; position: relative; min-height: 0; overflow: hidden; display: flex; }
  main { flex: 1; overflow: auto; padding: 26px 34px 90px; }
  .sheet { max-width: 1020px; margin: 0 auto; }
  section.card, details.card { padding: 14px 18px 16px; margin: 0 0 18px; }
  section.card > h2, details.card > summary { margin: 0 0 10px; font-family: var(--font-display); font-size: 21px; font-weight: 400; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  section.card > h2 .meta, details.card > summary .meta { font-family: var(--font-ui); font-size: 12.5px; }
  details.card > summary { cursor: pointer; list-style: none; margin-bottom: 0; }
  details.card[open] > summary { margin-bottom: 10px; }
  details.card > summary::-webkit-details-marker { display: none; }
  details.card > summary::before { content: "▸"; font-size: 11px; color: var(--muted); }
  details.card[open] > summary::before { content: "▾"; }
  /* the two groups of Waiting on you: Blocking first, then the rest (2026-09-16, T-0163). Layout only; the line down the
     blocking group's side is the same --blocked the blocks strip uses, so the two read as one thing. */
  .grp + .grp { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--rule-soft); }
  .grp > h3 { margin: 0 0 8px; font-family: var(--font-ui); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 400; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .grp > h3 .meta { letter-spacing: 0; text-transform: none; font-size: 12px; }
  .grp.blocking { border-left: 2px solid var(--blocked); padding-left: 12px; margin-left: -2px; }
  .grp.blocking > h3 { color: var(--blocked); }
  .grp .none { margin: 0; }
  /* what a question blocks, inside the question's own card, above the answer box */
  .holdsup { margin: 0 0 8px; padding: 4px 8px; border-left: 2px solid var(--blocked); background: var(--blocked-tint); border-radius: var(--radius); font-size: 12.5px; color: var(--ink-soft); }
  .holdsup .kicker { margin-right: 6px; font-size: 10px; }
  /* one entry of Due today or earlier: a task row or a question card, in one order, divided by a line */
  .dueitem + .dueitem { border-top: 1px solid var(--rule-soft); margin-top: 8px; padding-top: 8px; }
  .dueitem ul.items { margin: 0; }
  .btn.nottoday { padding: 1px 8px; font-size: 11px; color: var(--muted); }
  .btn.nottoday:hover { color: var(--ink); }
  /* the three sections that are NOT the ledgers (2026-09-16, T-0150 second stretch): what the app holds for review,
     today's calls, what landed. Layout only; every color comes from viewer-tokens.css. A row here carries no checkbox,
     so it uses its own grid rather than li.item's, whose first column means "tick me". */
  .row { display: grid; grid-template-columns: 20px 1fr; gap: 10px; padding: 7px 0; border-top: 1px solid var(--rule-soft); align-items: start; }
  .row:first-child { border-top: 0; }
  .row .mark { font-size: 12px; line-height: 1.5; color: var(--muted); text-align: center; }
  .row .t { font-size: 14.5px; }
  .row .m { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
  /* Your open tasks (2026-09-18, T-0185, layout A): a row with its two presses in their own column, so the eye runs
     down one line of buttons rather than hunting for a checkbox. Layout only; every color comes from viewer-tokens.css. */
  .mine { position: relative; display: grid; grid-template-columns: 108px 1fr; gap: 12px; padding: 8px 26px 8px 0; border-top: 1px solid var(--rule-soft); align-items: start; }
  .mine:first-child { border-top: 0; }
  .mine .press { display: flex; gap: 6px; padding-top: 1px; }
  .mine .press .btn { padding: 2px 9px; font-size: 11.5px; }
  .mine .press .btn.done:hover { border-color: var(--done); color: var(--done); }
  .mine .press .btn:not(.done) { color: var(--muted); }
  .mine .press .btn:not(.done):hover { color: var(--ink); }
  .mine .t { font-size: 14.5px; }
  .mine .m { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 3px; }
  .mine .keep { margin-top: 3px; }
  .mine.going { opacity: .45; }
  @media (max-width: 560px) { .mine { grid-template-columns: 1fr; gap: 4px; } .mine .press { order: 2; padding-top: 4px; } }
  /* Pending in the app, folded per conversation (2026-09-18, T-0017): 504 items over 61 conversations, so the block is
     one row a conversation and the items live inside it. Layout only; every color comes from viewer-tokens.css. */
  details.conv { border-top: 1px solid var(--rule-soft); padding: 2px 0; }
  details.conv:first-child { border-top: 0; }
  details.conv > summary { cursor: pointer; list-style: none; padding: 8px 0; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-size: 14.5px; }
  details.conv > summary::-webkit-details-marker { display: none; }
  details.conv > summary::before { content: "\25B8"; font-size: 11px; color: var(--muted); }
  details.conv[open] > summary::before { content: "\25BE"; }
  details.conv > summary .n { font-size: 12px; color: var(--muted); }
  details.conv .inside { padding: 2px 0 10px 18px; }
  details.conv .allline { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding: 0 0 6px; }
  .pend { display: grid; grid-template-columns: 148px 1fr; gap: 12px; padding: 8px 0; border-top: 1px solid var(--rule-soft); align-items: start; }
  .pend:first-child { border-top: 0; }
  .pend .press { display: flex; gap: 6px; padding-top: 1px; }
  .pend .press .btn { padding: 2px 9px; font-size: 11.5px; color: var(--muted); }
  .pend .press .btn.yes:hover { border-color: var(--done); color: var(--done); }
  .pend .press .btn.no:hover { border-color: var(--blocked); color: var(--blocked); }
  .pend .t { font-size: 14.5px; }
  .pend .m { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 3px; }
  .pend.going { opacity: .45; }
  .btn.armed { border-color: var(--blocked); color: var(--blocked); }
  /* an approval row in the run-through (0.65.0): one call, its items folded under it */
  .qrow.appr { border-left-color: var(--accent); }
  .qrow .apitems { margin-top: 6px; }
  .qrow .apitems > summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
  .qrow .apitems ul { margin: 6px 0 0; padding: 0; list-style: none; }
  .qrow.focus { outline: 2px solid var(--accent); outline-offset: 2px; }
  .call .prepline .skel { color: var(--blocked); }
  /* the one line the block shows by default (2026-09-18, T-0191): the count, a way into the app, and the press that
     opens the queue. Layout only; every color comes from viewer-tokens.css. */
  .appline { margin: 0; font-size: 13.5px; color: var(--ink-soft); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  @media (max-width: 560px) { .pend { grid-template-columns: 1fr; gap: 4px; } .pend .press { order: 2; padding-top: 4px; } details.conv .inside { padding-left: 6px; } }
  .whereto { margin: 12px 0 0; padding-top: 9px; border-top: 1px solid var(--rule-soft); font-size: 12.5px; color: var(--muted); max-width: 78ch; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  /* a second sentence in the same foot starts on its own line (T-0192's call line under T-0185's app line) */
  .whereto .brk { flex-basis: 100%; height: 0; }
  /* a call: the clock in its own column, the prep one press away */
  .call { display: grid; grid-template-columns: 96px 1fr; gap: 14px; padding: 10px 0; border-top: 1px solid var(--rule-soft); align-items: baseline; }
  .call:first-child { border-top: 0; }
  .call .when { font-family: var(--font-display); font-size: 15.5px; white-space: nowrap; }
  .call .when .to { display: block; font-size: 11.5px; color: var(--muted); }
  .call .title { font-size: 15.5px; font-family: var(--font-display); }
  .call .who { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
  .call .prepline { margin-top: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; }
  .call .ready { color: var(--done); }
  .call.now .when, .call.next .when { color: var(--accent); }
  details.older { margin-top: 10px; }
  details.older > summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  details.older[open] { margin-top: 14px; }
  .lead { color: var(--ink-soft); margin: 0 0 14px; max-width: 76ch; }
  /* the queue (0.58.0, T-0286): one numbered list, its presses under its words. Layout only.
     0.59.2 (2026-10-05): each item is its own card again with a gap between, as the list was before 0.58.0 (the owner:
     "I liked it when each item was separate on the listing rather than one big block"), and the kind column is wide
     enough for QUESTION and DECISION on one line (they were breaking mid-word at 58px). */
  ol.queue { list-style: none; margin: 0; padding: 0; }
  .qrow { position: relative; display: grid; grid-template-columns: 26px 74px 1fr; gap: 10px; padding: 12px 30px 12px 8px; margin: 0 0 10px; align-items: start;
          background: var(--surface); border: 1px solid var(--rule-soft); border-left: 3px solid var(--rule); border-radius: var(--radius); }
  ol.queue > .qrow:last-child { margin-bottom: 0; }
  .qrow > .n { font-family: var(--font-display); font-size: 15px; color: var(--muted); text-align: right; line-height: 1.45; }
  .qrow.due { border-left-color: var(--accent); }
  .qrow.due > .n { color: var(--accent); }
  .qrow.blocking { border-left-color: var(--blocked); background: var(--blocked-tint); }
  .qrow .t { font-size: 14.5px; }
  .qrow .m { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 3px; }
  /* the kind label at the row's left (0.58.1, T-0296): task, question, decision, muted so the rotation is visible but quiet */
  .qrow > .qk { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); line-height: 2.1; white-space: nowrap; }
  .qrow .press { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
  .qrow .press .btn { padding: 2px 10px; font-size: 12px; }
  .qrow .press .btn.done:hover, .qrow .press .btn.choice:hover { border-color: var(--done); color: var(--done); }
  .qrow .holdsup { margin: 5px 0 0; }
  .qrow .keep { margin-top: 4px; }
  .qrow form.qbox { display: flex; gap: 8px; align-items: flex-start; margin-top: 7px; }
  .qrow form.qbox textarea { flex: 1; }
  .qrow .qnote { margin-top: 6px; }
  .qrow.going { opacity: .45; }
  #queueMore > summary { margin-top: 6px; }
  /* the queue's controls (0.60.2): Show, Order, Project, small, in the Projects page's filter-button style; one line at
     desktop width, wrapping at phone width. Layout only; every color comes from viewer-tokens.css. */
  .qctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; margin: -2px 0 12px; font-family: var(--font-ui); font-size: 13px; }
  .qctl .qc-grp { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; min-width: 0; }
  .qctl .qc-lbl { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-right: 3px; }
  .qctl button, .qctl select { font: inherit; font-size: 13px; line-height: 1.3; color: var(--ink); padding: 3px 9px; border-radius: var(--radius); border: 1px solid var(--rule); background: var(--surface); cursor: pointer; }
  .qctl button:hover, .qctl select:hover { background: var(--hover); }
  .qctl button.on { background: var(--selected); box-shadow: inset 0 -2px 0 var(--accent); }
  .qctl select { padding-right: 6px; max-width: 46vw; }
  /* at phone width Show wraps onto its own two lines and Order and Project share the third, their words in the boxes' titles */
  @media (max-width: 560px) { .qctl { gap: 6px 8px; } .qctl .qc-sel { flex: 1 1 0; } .qctl .qc-sel .qc-lbl { display: none; } .qctl .qc-sel select { flex: 1; width: 100%; max-width: none; min-width: 0; } }
  ol.queue > li.qgroup { list-style: none; margin: 14px 0 6px; font-family: var(--font-ui); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  ol.queue > li.qgroup:first-child { margin-top: 0; }
  header.bar .status-line { font-size: 12px; color: var(--muted); }
  @media (max-width: 900px) { main { padding: 18px 16px 80px; } }
</style>
</head>
<body>
<header class="bar">
  <img class="mark" src="/static/sun-mark.png" alt="" width="36" height="28">
  <h1>Today</h1>
  <span class="sub" id="crumb"></span>
  <span class="spacer"></span>
  <nav class="panels" data-page="today"></nav>
</header>
<div class="stage">
  <main id="main">
    <div class="sheet">
      <p class="lead" id="lead">Reading the ledgers…</p>
      <section class="card" id="waitcard">
        <h2>Waiting on you <span class="meta" id="waitSum"></span><span id="outbox"></span></h2>
        <div class="qctl" id="qctl" aria-label="what the queue shows and in what order"></div>
        <p class="whereto" id="intakeLine" hidden></p>
        <div id="waitBody"></div>
        <p class="whereto" id="queueFoot" hidden></p>
      </section>
      <section class="card" id="duecard">
        <h2>Others owe today <span class="meta" id="dueSum"></span></h2>
        <div id="dueBody"></div>
      </section>
      <section class="card" id="callcard">
        <h2>Today's calls <span class="meta" id="callSum">reading the calendar…</span></h2>
        <div id="callBody"></div>
      </section>
      <section class="card" id="landcard">
        <h2>Transcripts landed today <span class="meta" id="landSum">looking in the folders…</span></h2>
        <div id="landBody"></div>
      </section>
      <details class="card" id="closedcard">
        <summary>Closed today <span class="meta" id="closedSum"></span></summary>
        <div id="closedBody"></div>
      </details>
      <p class="status-line meta" id="status"></p>
    </div>
  </main>
  <aside class="drawer" id="drawer" hidden></aside>
</div>
<script src="/static/viewer-common.js"></script>
<script src="/static/attach.js"></script>
<script>BVAttach.watch(document.getElementById("main"));   // pictures on questions and answers: thumbnails, attach, paste (T-0219)</script>
<script>
// ---- the Today page (2026-09-15, ledger T-0150, first stretch) ----
// The owner asked for one place to see the questions that are holding work back. One page composed
// in the browser from GET /api/projects -- the same read /projects makes -- so there is no second copy of the ledgers
// anywhere and nothing new on the server (rules 1 and 2). Every control here is the one /projects uses: the question
// card and its answer box, the task row and its checkbox, the reply box, hold and bring back, all from viewer-common.js
// writing through PUT /api/tasks -> tasks.py (clock-stamped, logged). "Not today" is the hold verb with tomorrow's date.
const { esc, md, isImage, lightbox, fileLink: link, itemRow: row, questionCard: qCard, ledgerAct, refreshBadges, showAll, mountShowAll } = BV;
const $ = s => document.querySelector(s);
let DATA = null, MODEL = null;
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const key = i => i.project + "/" + i.id;

// ---- painting ----
function paint() {
  if (!MODEL) return;
  const all = showAll("today");
  const c = MODEL.counts;
  // the lead is written after the queue is drawn, from the queue itself (below)

  // ---- 1. Waiting on you: one queue of everything open that is yours, questions and tasks alike (0.58.0, T-0286) ----
  const opts = q => ({ project: q.project, today: MODEL.today, showProject: true });
  const queue = paintQueue(all);
  const mineKeys = new Set(queue.map(key));

  // ---- 2. Due today or earlier: any owner, overdue marked plainly, held items whose day has come ----
  const others = MODEL.due.filter(i => !mineKeys.has(key(i)));
  const ledgerRows = queue.filter(r => r.kind !== "approve");
  const nq = ledgerRows.filter(r => r.kind === "question").length, nb = ledgerRows.filter(r => r.tier === 0).length, nd = ledgerRows.filter(r => r.tier === 1).length, na = queue.length - ledgerRows.length;
  $("#lead").textContent = queue.length
    ? `${plural(ledgerRows.length, "thing")} waiting on you: ${plural(nq, "question")} and ${plural(ledgerRows.length - nq, "task")}${nb ? `, ${nb} holding up other work at the top` : ""}${nd ? `, ${nb ? "then " : ""}${nd} due today or earlier${nb ? "" : " at the top"}` : ""}${na ? `, then ${plural(na, "call")} with items to approve in the app` : ""}.`
    : "Nothing is waiting on you or due.";
  $("#crumb").textContent = `${MODEL.today} · ${ledgerRows.length} for you · ${c.closed} closed`;
  $("#duecard").hidden = !others.length;
  $("#dueSum").textContent = others.length ? `${plural(others.length, "item")} on Claude or someone else · oldest first` : "nothing is due";
  $("#dueBody").innerHTML = others.length
    ? others.map(i => `<div class="dueitem" data-key="${esc(key(i))}">${i.kind === "question"
        ? qCard(i, opts(i))
        : `<ul class="items">${row(i, { project: i.project, today: MODEL.today, showProject: true })}</ul>`}</div>`).join("")
    : `<p class="meta" style="margin:0">Nothing is due today or was due earlier, and nothing comes back today.</p>`;
  // a question addressed to the owner that also carries a due date is in both sections, and the shared card names itself
  // `q-<project>-<id>`: the copy down here is renamed so two elements never answer to one id (the answer box, the
  // reopen button and the ledger it writes to are all carried on the form's own data attributes, not on the id)
  for (const el of $("#dueBody").querySelectorAll(".q[id]")) el.id = "due-" + el.id;
  paintDueControls();

  // ---- 3. Closed today, folded at the bottom ----
  const done = MODEL.closed.filter(i => i.kind === "task"), answered = MODEL.closed.filter(i => i.kind === "question");
  $("#closedSum").textContent = c.closed
    ? `${plural(done.length, "task")} done · ${plural(answered.length, "question")} answered`
    : "nothing closed yet today";
  $("#closedBody").innerHTML = c.closed
    ? (done.length ? `<ul class="items">${done.map(i => row(i, { project: i.project, today: MODEL.today, showProject: true })).join("")}</ul>` : "")
      + answered.map(q => qCard(q, opts(q))).join("")
    : `<p class="meta" style="margin:0">Nothing has been closed today.</p>`;
  if (all) $("#closedcard").open = true;
  BV.glossary.scan($("#main"));
}

// ---- 1. Waiting on you: ONE queue, top to bottom (0.58.0, T-0286) ----
// 2026-10-02 18:01: what waits on the owner is not only questions but tasks and everything else on the projects page,
// and the owner works on what is right in front of them. With only questions shown in order here, the other items
// never got reached because of the layout. So this block is every open item that is the owner's on every
// ledger, questions and tasks in ONE order, each with its own presses: a question's named choices (or the box), a
// task's done / hold / note. The order (blocking first since 0.65.1): what holds other work first, most held up first;
// then what is due today or earlier (or back from a hold today), by its date; then everything else oldest first (its due date where it has one, else the day it was
// written); the things to try in the viewer last. A held item, a blocked task and a call's own items are not here: they
// are not the owner's to do today (a call's items live in its prep, T-0192).
const QLIMIT = 15;
const REFS = /\b[TQ]-\d{4}\b/g;
const isTestItem = i => (i.tags || []).some(t => t === "test" || /^test-/.test(t));
// filed by transcript intake and older than fourteen days: it goes through "Clear what's settled" before the queue shows
// it again (0.65.0, Round 1 of the viewer review). SEEN is the sweep's record of what it has read (GET /api/sweep/status).
const INTAKE_DAYS = 14;
let SEEN = {};
const sourceOf = i => (i && i.source) || ((i && i.tags) || []).map(String).filter(t => t.startsWith("source:")).map(t => t.slice(7))[0] || "";
const dayMinus = (iso, n) => { const p = String(iso || "").split("-").map(Number); if (!p[0]) return ""; const d = new Date(p[0], p[1] - 1, p[2] - n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const isOldIntake = (i, today) => sourceOf(i) === "import-checkup" && String(i.created || "") < dayMinus(today, INTAKE_DAYS)
  && !SEEN[i.project + "/" + i.id] && !(i.due && i.due <= today);
// the item another page linked here (`/?item=<ledger>/<id>`): opened at the top of the queue with its presses
let FOCUS = (() => { try { return new URLSearchParams(location.search).get("item") || ""; } catch (e) { return ""; } })();
// the app's calls skipped today, in this browser (a view choice: they are back tomorrow, nothing is written)
const SKIP_KEY = "bv.today.appskip";
const skipRead = () => { try { const v = JSON.parse(localStorage.getItem(SKIP_KEY) || "{}"); return v && v.day === (MODEL && MODEL.today) ? v : { day: MODEL && MODEL.today, ids: [] }; } catch (e) { return { day: MODEL && MODEL.today, ids: [] }; } };
const skipAdd = id => { const v = skipRead(); if (!v.ids.includes(id)) v.ids.push(id); try { localStorage.setItem(SKIP_KEY, JSON.stringify(v)); } catch (e) {} };
const isColdItem = i => /cold storage/i.test(String(i.note || ""));
const notedOn = (i, day) => !!day && (String(i.note || "").includes("note " + day + ":") || String(i.note || "").includes("note (viewer, " + day + "):"));
const mdd = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || "")); return m ? `${+m[2]}/${+m[3]}` : ""; };
function queueModel() {
  const t = MODEL.today, ME = BV.owner, items = MODEL.items;
  const byKey = new Map(items.map(i => [key(i), i]));
  const open = i => i.kind === "task" ? i.mark !== "x" : i.mark === "?";
  const holds = new Map();      // what an open item holds up: open tasks on its own ledger that name it in blocked:
  for (const x of items) {
    if (x.kind !== "task" || x.mark === "x" || !x.blocked) continue;
    for (const id of String(x.blocked).match(REFS) || []) {
      const b = byKey.get(x.project + "/" + id); if (!b || !open(b)) continue;
      if (!holds.has(key(b))) holds.set(key(b), []); holds.get(key(b)).push(x);
    }
  }
  // the click-through tests in the owner's name are one batch on the rating page now (0.65.0), never in this queue

  if (APP) APP.count = Math.max(0, (APP.count || 0) - 1);
  if (c && row && c.count) {
    const all = row.querySelector("[data-all]"); if (all && !all.dataset.busy) all.textContent = `approve all ${c.count}`;
    const s = row.querySelector(".apitems > summary"); if (s) s.textContent = `see the ${plural(c.count, "item")}`;
  } else if (MODEL) paint();
}

// approve all, on one call (0.65.0): one press, one call to the server, which approves each item through the same
// rehearse-then-write route a single press uses and stops at the first refusal, saying how far it got.
async function pendAll(btn) {
  const row = btn.closest("li.qrow.appr"), say = row.querySelector(".allsay");
  const c = APP && (APP.conversations || []).find(x => x.id === row.dataset.conv);
  if (!c || !c.count) return;
  btn.disabled = true; btn.dataset.busy = "1"; btn.textContent = `approving ${c.count}…`;
  let j = {}, ok = false;
  try {
    const r = await fetch("/api/pending/approve-all", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ conversation: c.id }) });
    j = await r.json().catch(() => ({})); ok = r.ok;
  } catch (e) { j = { error: e.message }; }
  delete btn.dataset.busy;
  if (!ok) { btn.disabled = false; btn.textContent = `approve all ${c.count}`; say.textContent = j.error || "the app did not take it"; $("#status").textContent = j.error || ""; return; }
  $("#status").textContent = `${j.done} of ${j.total} approved in the app and logged`;
  if (APP) { APP.conversations = APP.conversations.filter(x => x.id !== c.id); APP.count = Math.max(0, (APP.count || 0) - j.done); }
  paint();
}

// 4. Today's calls. The calendar is only reachable through the Claude Code MCP tool, so the /start-session recap writes
// what it already read into context/today-calendar.json and this draws THAT: no file, one plain line, never a guess.
const hm = t => { const m = /(?:^|T)(\d{1,2}):(\d{2})/.exec(String(t || "")); return m ? (+m[1]) * 60 + (+m[2]) : null; };
const clock = t => { const m = /(?:^|T)(\d{1,2}):(\d{2})/.exec(String(t || "")); if (!m) return String(t || ""); const h = +m[1];
  return `${((h % 12) || 12)}:${m[2]}${h < 12 ? "am" : "pm"}`; };
function paintCalls(d) {
  const sum = $("#callSum"), body = $("#callBody");
  if (!d || d.error) {
    sum.textContent = "not read";
    body.innerHTML = `<p class="note">Could not read the calendar file: ${esc((d && d.error) || "the server did not answer")}</p>`;
    return;
  }
  if (!d.exists || !d.count) {
    sum.textContent = d.exists ? "nothing on the calendar" : "no calendar file yet";
    body.innerHTML = `<p class="meta" style="margin:0">${d.exists
      ? `Nothing was on the calendar for today when the recap last read it.`
      : `No calendar yet today. It appears once a session starts.`}</p>`;
    return;
  }
  const now = new Date().getHours() * 60 + new Date().getMinutes();
  let nextDone = false;
  // a block (therapy, an event with nobody else on it) is listed with its time and title and nothing about a prep
  const nCalls = d.calls ?? d.count, nOther = d.count - nCalls;
  sum.textContent = `${nCalls ? `${plural(nCalls, "call")} · ${d.withPrep} with a prep` : "no calls"}${nOther ? ` · ${plural(nOther, "other event")}` : ""}${d.stale ? " · this is yesterday's calendar" : ""}`;
  body.innerHTML = d.events.map(e => {
    const s = hm(e.start), en = hm(e.end);
    let when = "";
    if (!d.stale && s !== null && en !== null && now >= s && now <= en) when = "now";
    else if (!d.stale && s !== null && now < s && !nextDone) { when = "next"; nextDone = true; }
    const prep = e.preps && e.preps[0];
    if (e.call === false) return `<div class="call ${when}">
      <div class="when">${esc(clock(e.start))}${e.end ? `<span class="to">to ${esc(clock(e.end))}</span>` : ""}</div>
      <div><div class="title">${esc(e.title)}${when ? ` <span class="badge">${when}</span>` : ""}</div></div></div>`;
    return `<div class="call ${when}">
      <div class="when">${esc(clock(e.start))}${e.end ? `<span class="to">to ${esc(clock(e.end))}</span>` : ""}</div>
      <div>
        <div class="title">${esc(e.title)}${when ? ` <span class="badge">${when}</span>` : ""}</div>
        <div class="who">${e.people.filter(p => !p.self).map(p => {
          const org = e.organizer && p.name === e.organizer ? " · organizes" : "";
          return p.slug
            ? `<span class="badge person" data-person="${esc(p.slug)}" title="open ${esc(p.name)} on the People page">${esc(p.name)}${org}</span>`
            : `<span title="nobody in people/ answers to this name — flagged, never created for you">${esc(p.name)}${org} <span class="meta">no card</span></span>`;
        }).join("") || `<span class="meta">no attendees on the invite</span>`}</div>
        <div class="prepline">${e.join && !d.stale ? `<a class="btn primary" href="${esc(e.join)}" target="_blank" rel="noopener" style="text-decoration:none">join</a>` : ""}${prep
          ? `${prep.state === "skeleton" ? `<span class="skel" title="the prep has its people and subjects, and nothing written for this call yet">skeleton, not written yet</span>`
              : prep.state === "held" ? `<span class="meta">held, the notes are in</span>` : `<span class="ready">prep ready</span>`}<a class="btn" href="/call?prep=${encodeURIComponent(prep.path)}" style="text-decoration:none" title="the call page: the prep as boxes to tick, and the notes box">call page</a><span class="filelink" data-open="${esc(prep.path)}" title="${esc(prep.path)}">read it</span>${prep.purpose ? `<span class="meta">${esc(prep.purpose)}</span>` : ""}`
          : `<span class="meta">no prep</span><span class="meta">write one on the People page</span>`}</div>
      </div></div>`;
  }).join("") + (d.stale
    ? `<p class="whereto"><span>This is yesterday's calendar: no session has started today, so nothing here is current.</span></p>` : "");
}

// 5. Transcripts landed today, and whether each has been taken in. "Intaken" means its import-checkup report exists --
// the runbook's retained artifact -- not that a file merely arrived.
function paintLanded(d) {
  const sum = $("#landSum"), body = $("#landBody");
  if (!d || d.error) {
    sum.textContent = "not read";
    body.innerHTML = `<p class="note">Could not read the transcript folders: ${esc((d && d.error) || "the server did not answer")}</p>`;
    return;
  }
  sum.textContent = d.count ? `${plural(d.count, "transcript")} · ${d.intaken} read in` : "nothing landed today";
  body.innerHTML = d.count
    ? `<ul class="items">${d.landed.map(r => `<li class="row"><span class="mark" title="${r.report ? "read in" : "not read in yet"}">${r.report ? "✓" : "◇"}</span><div>
        <div class="t" title="${esc(r.stem)}">${esc(r.title || r.stem)}</div>
        <div class="m">${r.files.map(f => `<span class="filelink" data-open="${esc(f.path)}" title="${esc(f.path)}">.${esc(f.ext)}</span>`).join("")}<span class="badge">${esc(r.mirror ? "app mirror" : "brain")}</span><span>${esc(r.mtime)}</span>${r.report
          ? `<span class="badge done">read in</span><span class="filelink" data-open="${esc(r.report)}" title="${esc(r.report)}">the report</span>${BV.readerLink(r.report, "read it")}`
          : `<span class="badge overdue">not read in yet</span>`}</div>
      </div></li>`).join("")}</ul>`
    : `<p class="meta" style="margin:0">Nothing with today's date landed in ${d.folders.map(f => `<code>${esc(f)}</code>`).join(" or ")}.</p>`;
}

async function outside() {
  const get = async (u, paint) => {
    try { const r = await fetch(u); paint(await r.json()); }
    catch (e) { paint({ error: e.message }); }
  };
  await Promise.all([get("/api/pending", paintApp), get("/api/calls", paintCalls), get("/api/landed", paintLanded)]);
  BV.glossary.scan($("#main"));
}

// ---- one ledger write, then the page reads itself back ----
async function act(project, payload) {
  const res = await ledgerAct(project, payload);
  $("#status").textContent = res.message;
  if (!res.ok) return null;
  await load();
  refreshBadges(); BV.quests.refresh();
  $("#status").textContent = res.message;   // the repaint above clears it: the message is written after, not before
  return res.json;
}

// ---- the read drawer (the same one /projects opens) ----
async function openFile(path, frag) { return BV.drawer.open(path, frag); }   // the one shared drawer, viewer-common.js (0.54.1, T-0152)

document.addEventListener("click", async e => {
  if (e.target.closest("#closeDrawer")) { $("#drawer").hidden = true; return; }
  // the queue's presses (0.58.0): a named choice answers the question, write opens the box, done closes a task, note opens its note box
  const qc = e.target.closest("#waitBody [data-qchoice]");
  if (qc) { e.preventDefault(); qc.closest("li").classList.add("going"); await act(qc.dataset.project, { action: "answer", id: qc.dataset.q, text: qc.dataset.qchoice, by: BV.owner }); return; }
  const qw = e.target.closest("#waitBody [data-qwrite]");
  if (qw) { e.preventDefault(); const f = qw.closest("li").querySelector("form.qbox"); if (f) { f.hidden = !f.hidden; if (!f.hidden) f.querySelector("textarea").focus(); } return; }
  const qd = e.target.closest("#waitBody [data-qdone]");
  if (qd) {
    e.preventDefault(); const li = qd.closest("li"); li.classList.add("going");
    const pend = BV.replies.pending(qd);      // words left in its note box are written before it closes
    if (pend) await BV.replies.act(pend.project, pend.id, pend.text, pend.ledger);
    await act(qd.dataset.project, { action: "done", id: qd.dataset.qdone }); return;
  }
  const qn = e.target.closest("#waitBody [data-qnote]");
  if (qn) { e.preventDefault(); const b = qn.closest("li").querySelector(".qnote"); if (b) { b.hidden = !b.hidden; if (!b.hidden) b.querySelector("textarea").focus(); } return; }
  const ap = e.target.closest("#waitBody [data-pend]");
  if (ap) { e.preventDefault(); const li = ap.closest("li.pend");
            if (li) { const out = await pendPress(li, ap.dataset.pend); $("#status").textContent = out.ok ? out.say + " · written to the app and logged" : "refused: " + out.say; } return; }
  const aa = e.target.closest("#waitBody [data-all]");
  if (aa) { e.preventDefault(); await pendAll(aa); return; }
  const sk = e.target.closest("#waitBody [data-skip]");
  if (sk) { e.preventDefault(); skipAdd(sk.dataset.skip); paint(); $("#status").textContent = "Skipped for today; it is back tomorrow."; return; }
  // the queue's controls (0.60.2): one Show press at a time, remembered in this browser
  const qs = e.target.closest("#qctl [data-qshow]");
  if (qs) { e.preventDefault(); QV.show = qs.dataset.qshow; qvSave(); paint(); return; }
  const qr = e.target.closest("#waitBody [data-qreset]");
  if (qr) { e.preventDefault(); QV.show = "all"; QV.project = "all"; qvSave(); paint(); return; }
  const cb = e.target.closest("input[type=checkbox][data-id]");
  if (cb) {
    e.preventDefault();
    const pend = BV.replies.pending(cb);      // words left in the reply box are written before the item closes (T-0078)
    if (pend && cb.checked) { const r = await BV.replies.act(pend.project, pend.id, pend.text, pend.ledger); if (r.ok) pend.form.querySelector("textarea").value = ""; }
    await act(cb.dataset.project, { action: cb.checked ? "done" : "reopen", id: cb.dataset.id }); return;
  }
  const nt = e.target.closest("[data-not]");
  if (nt) { e.preventDefault(); await act(nt.dataset.project, { action: "hold", id: nt.dataset.not, until: BV.day.tomorrow() }); return; }
  const ro = e.target.closest("[data-reopen]"); if (ro) { await act(ro.dataset.project, { action: "reopen", id: ro.dataset.reopen }); return; }
  const pc = e.target.closest(".badge.person"); if (pc) { location.href = `/people?open=${encodeURIComponent(pc.dataset.person)}`; return; }
  const w = e.target.closest("a.wikilink"); if (w) { e.preventDefault(); const t = w.dataset.wikilink.split("#")[0].trim(); if (t.endsWith(".canvas")) location.href = BV.forgeHref(t); else openFile(t, w.dataset.wikilink.split("#")[1]); return; }
  const o = e.target.closest(".filelink[data-open]"); if (o) { openFile(o.dataset.open, o.dataset.frag); }
});
document.addEventListener("submit", async e => {
  const f = e.target;
  if (f.dataset.reply) return;                 // the reply box is wired once, in viewer-common (BV.replies.wire)
  if (!f.dataset.q) return;
  e.preventDefault();
  await act(f.dataset.project, { action: "answer", id: f.dataset.q, text: f.querySelector("textarea").value, by: BV.owner });
});
document.addEventListener("change", e => {
  const o = e.target.closest("#qctl select[data-qorder]"); if (o) { QV.order = o.value; qvSave(); paint(); return; }
  const p = e.target.closest("#qctl select[data-qproject]"); if (p) { QV.project = p.value; qvSave(); paint(); return; }
});
document.addEventListener("keydown", e => { if (BV.typing(e)) return; if (e.key === "Escape") $("#drawer").hidden = true; });

mountShowAll("today", () => paint(), { liveLabel: "showing today", allLabel: "showing everything" });
BV.replies.wire(document, { status: m => { $("#status").textContent = m; }, onDone: async () => { await load(); refreshBadges(); } });
BV.holds.wire(document, { status: m => { $("#status").textContent = m; }, onDone: async () => { await load(); refreshBadges(); } });

async function load() {
  // the ledgers' short names and order, from the same settings the Projects page reads (read once, cached by BV.prefs)
  const pr = await BV.prefs();
  QSHORT = (pr.project_labels && typeof pr.project_labels === "object") ? pr.project_labels : {};
  QPORDER = Array.isArray(pr.project_order) ? pr.project_order : [];
  DATA = await BV.day.load();
  try { const r = await fetch("/api/sweep/status"); const j = await r.json(); SEEN = (j && j.seen) || {}; } catch (e) { SEEN = {}; }
  MODEL = BV.day.model(DATA);
  paint();
  return MODEL;
}
// Clear what's settled, in the Waiting on you header (0.60.0, renamed 0.60.1 and 0.60.2): a finished check reads the ledgers
// again and the queue is drawn from them. There is no send press since 0.65.0: every press reaches the session on its own.
BV.outbox.mount($("#outbox"), { onSweepDone: async () => { await load(); await mine(); BV.quests.refresh(); } });
load().then(mine)   // the call-items line under the queue
  .catch(e => { $("#lead").textContent = ""; $("#main").innerHTML = `<div class="note">Could not read the ledgers: ${esc(e.message)}</div>`; });
outside();   // the app, the calendar and the transcript folders: painted as each answers, never holding up the ledgers
</script>
</body>
</html>
