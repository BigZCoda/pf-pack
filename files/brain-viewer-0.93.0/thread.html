<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thread</title>
<link rel="stylesheet" href="/static/viewer-tokens.css">
<link rel="icon" type="image/png" href="/static/sun-favicon.png">
<style>
  /* layout only; every color and font comes from the look's tokens */
  body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .stage { flex: 1; position: relative; min-height: 0; overflow: hidden; display: flex; }
  main { flex: 1; overflow: auto; padding: 24px 32px 90px; }
  .sheet { max-width: 1180px; margin: 0 auto; }
  .thead { margin: 0 0 18px; }
  .thead .back { font-size: 12.5px; }
  .thead h2 { margin: 6px 0 8px; font-family: var(--font-display); font-weight: 400; font-size: 28px; line-height: 1.2; }
  .thead .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; font-size: 13px; color: var(--muted); }
  .thead .who { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 22px; align-items: start; }
  section.card { padding: 14px 18px 16px; margin: 0 0 18px; }
  section.card > h3 { margin: 0 0 10px; font-family: var(--font-display); font-size: 19px; font-weight: 400; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  section.card > h3 .meta { font-family: var(--font-ui); font-size: 12.5px; }
  .stands article.md { font-size: 14.5px; }
  .stands .foot { margin: 8px 0 0; font-size: 12.5px; }
  /* what needs to get done: the Today queue's row, its presses under its words */
  .glabel { margin: 14px 0 6px; font-family: var(--font-ui); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .glabel:first-of-type { margin-top: 0; }
  ol.todo { list-style: none; margin: 0; padding: 0; }
  .trow { position: relative; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 11px 30px 11px 8px; margin: 0 0 8px; background: var(--surface);
          border: 1px solid var(--rule-soft); border-left: 3px solid var(--rule); border-radius: var(--radius); }
  .trow.holding { border-left-color: var(--blocked); background: var(--blocked-tint); }
  .trow.late { border-left-color: var(--accent); }
  .trow > .n { font-family: var(--font-display); font-size: 15px; color: var(--muted); text-align: right; line-height: 1.45; }
  .trow .t { font-size: 14.5px; overflow-wrap: anywhere; }
  .trow .body, .side, .cols > div { min-width: 0; }
  .stands article.md, .trow .rel, .trow .keep, .trow .steps { overflow-wrap: anywhere; }
  .trow .m { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 3px; }
  .trow .rel { margin: 5px 0 0; padding: 4px 8px; border-left: 2px solid var(--rule); font-size: 12.5px; color: var(--ink-soft); }
  .trow .rel.frees { border-left-color: var(--blocked); background: var(--blocked-tint); }
  .trow .rel .kicker { margin-right: 6px; font-size: 10px; }
  .trow .keep { margin-top: 4px; }
  .trow .stepsbox { margin-top: 6px; }
  .trow .press { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
  .trow .press .btn { padding: 2px 10px; font-size: 12px; }
  .trow .press .btn.done:hover, .trow .press .btn.choice:hover { border-color: var(--done); color: var(--done); }
  .trow form.qbox { display: flex; gap: 8px; align-items: flex-start; margin-top: 7px; }
  .trow form.qbox textarea { flex: 1; }
  .trow .qnote { margin-top: 6px; }
  .trow.going { opacity: .45; }
  details.fold { margin-top: 10px; }
  details.fold > summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  /* the side column: next call, depends on, files, timeline */
  .side .line { font-size: 13.5px; margin: 0; }
  .side .call .when { font-family: var(--font-display); font-size: 16px; }
  .side .call .what { margin: 2px 0 6px; }
  .side .call .links { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12.5px; }
  .doc { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; border-top: 1px solid var(--rule-soft); font-size: 13px; min-width: 0; }
  .doc:first-child { border-top: 0; }
  .doc { flex-wrap: wrap; }
  .doc a.name { flex: 1 1 100%; min-width: 0; white-space: normal; overflow: visible; font-size: 14px; }
  .doc.page a.name { font-weight: 600; }
  .doc .dir a { font-size: 11px; }
  .doc .dir, .doc .t { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .doc .t { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; }
  .doc.gone a { color: var(--muted); text-decoration: line-through; }
  .tl { display: grid; grid-template-columns: 44px 1fr; gap: 8px; padding: 5px 0; border-top: 1px solid var(--rule-soft); font-size: 13px; }
  .tl:first-child { border-top: 0; }
  .tl .d { font-family: var(--font-mono); font-size: 11px; color: var(--muted); padding-top: 2px; }
  /* the index */
  /* 0.64.0: the focused item: its workspace leads the main column, the row it came from is marked in the list */
  .focus { margin: 0 0 6px; }
  .focusbar { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; margin: 0 0 10px; }
  .focus section.card > h2 { margin: 0 0 10px; font-family: var(--font-display); font-size: 19px; font-weight: 400; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .focus section.card > h2 .meta { font-family: var(--font-ui); font-size: 12.5px; }
  .focus section.card.ws-item { border-left: 3px solid var(--accent); }
  .trow.focused { outline: 2px solid var(--accent); outline-offset: 1px; }
  .todo-card li.trow .t { cursor: pointer; }
  .tix { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 12px 6px; border-top: 1px solid var(--rule-soft); text-decoration: none; color: var(--ink); }
  .tix:first-child { border-top: 0; }
  .tix:hover { background: var(--hover); }
  .tix .nm { font-family: var(--font-display); font-size: 17px; }
  .tix .ppl { grid-column: 1; font-size: 12.5px; color: var(--muted); }
  .tix .num { grid-row: 1 / 3; grid-column: 2; text-align: right; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .tix .num b { font-family: var(--font-display); font-size: 18px; font-weight: 400; color: var(--accent); }
  .none { color: var(--muted); font-size: 13.5px; margin: 0; }
  .sheet-bare { max-width: 980px; }
  .sheet-bare section.card > h2 { margin: 0 0 10px; font-family: var(--font-display); font-size: 20px; font-weight: 400; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .sheet-bare section.card > h2 .meta { font-family: var(--font-ui); font-size: 12.5px; }
  @media (max-width: 980px) { .cols { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 700px) { main { padding: 16px 16px 80px; } .thead h2 { font-size: 23px; } .trow { padding-right: 24px; } }
  /* 0.69.0: the first thread of a fresh brain */
  .first { max-width:72ch; } .first p { margin:6px 0 10px; }
  .first .field { margin:8px 0 0; } .first .field label { display:block; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:3px; }
  .first .field input { width:100%; padding:6px 8px; border:1px solid var(--rule-soft); border-radius:var(--radius); background:var(--surface); box-sizing:border-box; }
  .first .irow { display:flex; gap:10px; align-items:center; margin:10px 0 4px; }
  /* 0.77.0, the workspace page (the workspaces direction W1): each band is visibly its own thing */
  a.btn { display: inline-block; font-size: 13px; padding: 5px 12px; border-radius: var(--radius); border: 1px solid var(--rule); background: var(--surface); color: var(--ink); text-decoration: none; cursor: pointer; }
  a.btn:hover { background: var(--hover); }
  a.btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
  a.btn.primary:hover { background: var(--accent-deep); }
  .crumbs { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
  .crumbs .sep { color: var(--rule); }
  .thead .aside { font-size: 14px; color: var(--muted); margin: -4px 0 8px; }
  /* the thing in progress: framed in the accent, first under the title */
  section.nowband { border: 2px solid var(--accent); background: var(--surface); padding: 16px 20px 16px; }
  .nowband .kicker { color: var(--accent); }
  .nowband .nowname { margin: 4px 0 4px; font-family: var(--font-display); font-weight: 500; font-size: 25px; line-height: 1.2; }
  .nowband .nowline { margin: 0 0 12px; font-size: 15px; color: var(--ink-soft); max-width: 70ch; }
  .nowband .nowpress { display: flex; gap: 8px; flex-wrap: wrap; }
  .nowband .nowpress .btn { padding: 5px 16px; font-size: 14px; text-decoration: none; }
  .nowband .nownext { margin: 12px 0 0; padding: 8px 12px; border-left: 3px solid var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--surface)); font-size: 14.5px; }
  .nowband .nownext .kicker { margin-right: 8px; }
  .nowband .gone { color: var(--muted); font-size: 13px; }
  /* a ledger item named in prose: a small press with its words, never its code */
  a.idpress { display: inline; padding: 0 6px; border: 1px solid var(--rule); border-radius: 999px; background: var(--surface); color: var(--accent); font-size: .9em; text-decoration: none; white-space: normal; }
  a.idpress:hover { border-color: var(--accent); }
  a.idpress.closed { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--rule); }
  a.wslink { color: var(--accent); font-weight: 600; text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); }
  /* how it connects: drawn on the ground color */
  section.mapcard { background: var(--bg); box-shadow: none; border: 1px dashed var(--rule); }
  .map { overflow-x: auto; }
  .map svg { display: block; width: 100%; min-width: 560px; height: auto; margin: 0 auto; }
  .map .mp-line { stroke: var(--rule); stroke-width: 1.5; }
  .map .mp-box { fill: var(--surface); stroke: var(--rule); stroke-width: 1; }
  .map a:hover .mp-box { stroke: var(--accent); }
  .map .mp-box.here { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
  .map .mp-box.gone { stroke-dasharray: 4 3; fill: none; }
  .map .mp-kind { font-family: var(--font-ui); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; fill: var(--muted); }
  .map .mp-name { font-family: var(--font-display); font-size: 15px; fill: var(--ink); }
  .map a .mp-name { fill: var(--accent); }
  .map .mp-here { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: var(--ink); }
  .map .mp-say { font-family: var(--font-ui); font-size: 11px; fill: var(--ink-soft); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
  /* pieces of this: a list of the children, each with its count */
  .piece { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; padding: 9px 4px; border-top: 1px solid var(--rule-soft); }
  .piece:first-of-type { border-top: 0; }
  .piece .pn { font-family: var(--font-display); font-size: 17px; }
  .piece .pc { grid-row: 1 / 3; grid-column: 2; text-align: right; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .piece .pc b { font-family: var(--font-display); font-size: 18px; font-weight: 400; color: var(--accent); }
  .piece .ps { font-size: 13px; color: var(--ink-soft); }
  /* built here: the things themselves, each opening itself */
  .thing { padding: 10px 0; border-top: 1px solid var(--rule-soft); }
  .thing:first-of-type { border-top: 0; padding-top: 2px; }
  .thing .tn { font-family: var(--font-display); font-size: 19px; margin: 0; }
  .thing .tl2 { font-size: 13.5px; color: var(--ink-soft); margin: 2px 0 7px; max-width: 72ch; }
  .thing .tp { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .thing .tp .btn { padding: 3px 12px; font-size: 13px; text-decoration: none; }
  .thing .tp .when { font-size: 11.5px; color: var(--muted); }
  /* documents: a plain list, by name, a small muted date */
  ul.docs { list-style: none; margin: 0; padding: 0; }
  ul.docs li { display: flex; gap: 10px; align-items: baseline; padding: 5px 0; border-top: 1px solid var(--rule-soft); font-size: 14px; }
  ul.docs li:first-child { border-top: 0; }
  ul.docs li a { flex: 1; min-width: 0; text-decoration: none; }
  ul.docs li .d { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  ul.docs li.gone a { color: var(--muted); text-decoration: line-through; }
  /* progress: a fold in the side column that opens to a scrollable column, resized from the handle at its foot */
  section.progress { padding: 0; overflow: hidden; }
  section.progress > details > summary { list-style: none; cursor: pointer; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; padding: 12px 18px; }
  section.progress > details > summary::-webkit-details-marker { display: none; }
  section.progress > details > summary h3 { margin: 0; font-family: var(--font-display); font-size: 19px; font-weight: 400; }
  section.progress > details > summary::before { content: "\25B8"; color: var(--muted); font-size: 12px; }
  section.progress > details[open] > summary::before { content: "\25BE"; }
  section.progress > details[open] > summary { border-bottom: 1px solid var(--rule-soft); }
  .progbody { overflow: auto; height: 420px; min-height: 140px; padding: 4px 18px 10px; }
  .pgrip { height: 12px; cursor: ns-resize; touch-action: none; border-top: 1px solid var(--rule-soft); background: repeating-linear-gradient(90deg, transparent 0 46%, var(--rule) 46% 54%, transparent 54% 100%) center / 40px 3px no-repeat; }
  .pgrip:hover, .pgrip.on { background-color: color-mix(in srgb, var(--accent) 12%, transparent); }
  .phead { margin: 12px 0 4px; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .prow { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 8px; padding: 6px 0; border-top: 1px solid var(--rule-soft); font-size: 13px; }
  .phead + .prow { border-top: 0; }
  .prow .d { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); padding-top: 2px; overflow-wrap: anywhere; }
  .prow.next .d { font-family: var(--font-ui); font-size: 11px; color: var(--accent); }
  .prow.next { cursor: pointer; } .prow.next:hover { background: var(--hover); }
  .prow.done .t { color: var(--ink-soft); }
  .prow .fs { display: block; margin-top: 2px; font-size: 12px; }
  .prow .fs a { margin-right: 8px; }
  .prow .say { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-right: 6px; }
  .tix.sub { padding-left: 28px; border-top-style: dashed; }
  .tix.sub .nm { font-size: 15.5px; }
  /* 0.79.0, the comparison: a pick item's first band, one column per option, side by side on a wide window, stacked on
     a narrow one. The band may run wider than the page; everything else on the page keeps its width. */
  .sheet.wide { max-width: 1840px; }
  .sheet.wide > .thead, .sheet.wide > .cols, .sheet.wide > .pk-rest { max-width: 1180px; margin-left: auto; margin-right: auto; }
  section.pk-band { border: 2px solid var(--accent); }
  .pk-band > h2 { margin: 0 0 6px; font-family: var(--font-display); font-size: 21px; font-weight: 400; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .pk-band > h2 .meta { font-family: var(--font-ui); font-size: 12.5px; }
  .pk-q { margin: 0 0 12px; font-size: 15px; color: var(--ink-soft); max-width: 90ch; overflow-wrap: anywhere; }
  .pk-said { margin: 0 0 12px; font-size: 14px; }
  .pk-cols { display: grid; grid-template-columns: var(--pk-cols, repeat(auto-fit, minmax(260px, 1fr))); gap: 14px; align-items: stretch; }
  .pk-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; padding: 10px; border: 1px solid var(--rule-soft); border-radius: var(--radius); background: var(--bg); }
  .pk-col.chosen { border: 2px solid var(--done); }
  .pk-name { margin: 0; font-family: var(--font-display); font-size: 20px; font-weight: 400; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .pk-mark { color: var(--done); }
  .pk-view { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
  .pk-frame { display: block; width: 100%; height: clamp(420px, 68vh, 920px); border: 0; background: var(--surface); }
  .pk-pic { overflow: auto; max-height: clamp(420px, 68vh, 920px); }
  .pk-pic img { display: block; width: 100%; height: auto; }
  .pk-none { padding: 18px 4px; }
  .pk-tools { display: flex; flex-direction: column; gap: 6px; }
  .pk-tools .pk-full { align-self: flex-start; font-size: 12.5px; padding: 3px 10px; }
  .pk-switch { display: flex; flex-wrap: wrap; gap: 5px; }
  .pk-switch .btn { padding: 2px 9px; font-size: 12px; }
  .pk-switch .btn.on { border-color: var(--accent); color: var(--accent); }
  .pk-press { margin-top: auto; padding-top: 4px; }
  .pk-press .btn { width: 100%; }
  form.pk-box { display: flex; gap: 8px; align-items: flex-start; margin: 12px 0 0; }
  form.pk-box textarea { flex: 1; }
  .pk-say:empty { display: none; }
  @media (max-width: 900px) { .pk-cols { grid-template-columns: minmax(0, 1fr); } .pk-frame { height: 72vh; } }
</style>
</head>
<body>
<header class="bar">
  <img class="mark" src="/static/sun-mark.png" alt="" width="36" height="28">
  <h1 id="title">Thread</h1>
  <span class="sub" id="crumb"></span>
  <span class="spacer"></span>
  <nav class="panels" data-page="threads"></nav>
</header>
<div class="stage">
  <main id="main"><div class="sheet" id="sheet"><p class="none">Reading the thread…</p></div></main>
  <aside class="drawer" id="drawer" hidden></aside>
</div>
<script src="/static/viewer-common.js"></script>
<script src="/static/workspace.js"></script>
<script>
// ---- the thread page (0.62.0, 2026-10-05) ----
// One piece of work across the ledgers: a placement, a partnership, a launch. Its subject file says who it is about and
// the words that name it, and GET /api/thread joins everything else to that at read time: the file's own summary, every
// open ledger item on it in one order with the Today queue's presses, the files it depends on, the files being made for
// it, its next call and its dated lines. /threads lists every subject file. Every write is the same one the rest of the
// app makes (PUT /api/tasks, POST /api/reply), and the page reads itself back after each.
const { esc } = BV;
const $ = s => document.querySelector(s);
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const md = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || "")); return m ? `${+m[2]}/${+m[3]}` : ""; };
const SUBJECT = new URLSearchParams(location.search).get("subject") || "";
let T = null;
// 0.64.0: the page can focus one item in place (?item=<ledger>/<id>): its workspace (workspace.js, read from
// GET /api/work?scope=item) takes the main column, and the thread stays around it
let FOCUS = new URLSearchParams(location.search).get("item") || "", FW = null;
// 0.66.0 (Round 2 of the 10/06 review, the menu folds): the bare Workspace page folded in here. /thread?item=<ledger>/<id>
// with no subject is the "no thread yet" case: the item's whole workspace (GET /api/work, every block), with no thread
// around it. /work?item= redirects here (or to the item's thread when it has one); work.html is gone.
const BARE = !SUBJECT && !!FOCUS && location.pathname !== "/threads";
const INDEX = !BARE && (location.pathname === "/threads" || !SUBJECT);
const focusHref = i => `/thread?subject=${encodeURIComponent(SUBJECT)}&item=${encodeURIComponent(i.project || "")}/${encodeURIComponent(i.id)}`;
const B = BVWork.brief({ ref: () => FOCUS, item: () => FW && FW.item, done: async () => { await loadFocus(); paint(); } });
const whoWord = w => w === BV.owner ? "you" : w === "@claude" ? "Claude" : String(w || "").replace(/^@/, "");
const ago = iso => { const t = new Date(iso); if (isNaN(t)) return ""; const m = Math.round((Date.now() - t) / 60000);
  return m < 60 ? `${Math.max(m, 0)}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : t.toLocaleDateString(undefined, { month: "short", day: "numeric" }); };
// the weekday is computed from the date, never written from memory
const dayWord = iso => { const t = new Date(iso); return isNaN(t) ? "" : t.toLocaleDateString(undefined, { weekday: "short", month: "numeric", day: "numeric" }); };
const timeWord = iso => { const t = new Date(iso); return isNaN(t) ? "" : t.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }).toLowerCase().replace(" ", ""); };

// ---- one item of the thread: the Today queue's row ----
function row(i, n) {
  const p = i.project, isQ = i.kind === "question";
  const meta = [`<span class="badge">${esc(i.label)}</span>`, `<span>${esc(isQ ? "asked of " + whoWord(i.who) : whoWord(i.who))}</span>`];
  const late = i.due && i.due < localDay();
  if (i.due) meta.push(`<span class="badge${late || i.due === localDay() ? " overdue" : ""}">${i.due === localDay() ? "due today" : "due " + esc(md(i.due))}</span>`);
  if (i.until) meta.push(`<span class="badge held">on hold until ${esc(md(i.until))}</span>`);
  meta.push(`<span title="written ${esc(i.created)}">${esc(md(i.created))}</span>`);
  meta.push(BV.personChips(i));
  for (const l of BV.linksBelow(i)) meta.push(linkChip(l));   // 0.89.0: not what the text already links
  meta.push(`<a class="worklink" href="${esc(focusHref(i))}" data-focus="${esc(p + "/" + i.id)}" title="work on this item here: its brief, files, history and notes, with the thread around it">workspace</a>`);

// 0.77.0: a brain path written in an item's words reads as the name of what it is (the ledger's own door then draws it

const PATH_IN_TEXT = /(?<![\w\/.\-\[|])((?:deliverables|people|profiles|projects|transcripts|context|thoughts|procedures|[a-z][a-z0-9-]*-holon)\/[\w.\-\/]*\.(?:md|html?|png|jpe?g|pdf|json|txt|canvas|csv))(?![\w\/\-])/g;

// ---- 0.77.0: the subject's prose, with no ledger code shown and every link a press ----
// The owner's reading of the workspace proposal (2026-10-09): a ledger code in prose should never be visible; it should
// be something to press that opens what it names. The API resolves every id the
// subject's prose names (T.refs: "<ledger> <id>" or the bare id -> the item's first six words and where it opens); here
// each becomes a small press carrying those words, and one that resolves to nothing is dropped from the sentence and
// said in the console. A [[subject]] or a link to a subject file is a press to that workspace; any other [[file]] with
// no label of its own reads as its name. Applies to Where it stands, the in-progress line, the map's lines, the pieces'

  const sub = subjLink(p); if (sub) return `<a class="wslink" href="${esc(sub.href)}" title="the workspace">${esc(sub.name)}</a>`;

  const name = known ? known.name : leafWords(p);

const KIND_WORD = { "part-of": "part of", "piece": "a piece of this", "feeds": "this feeds it", "fed-by": "feeds this", "beside": "beside it", "builds-on": "builds on" };

  const f = $("#progfold"), body = $("#progbody"), grip = $("#pgrip"); if (!f || !body || !grip) return;
  f.addEventListener("toggle", () => store.set(progOpenKey(), f.open ? "1" : "0"));
  grip.addEventListener("dblclick", () => { body.style.height = ""; store.set(PROG_H, ""); });
  grip.addEventListener("pointerdown", e => {
    e.preventDefault(); const y0 = e.clientY, h0 = body.getBoundingClientRect().height; grip.classList.add("on");
    const move = ev => { body.style.height = Math.max(140, Math.min(window.innerHeight * 2, h0 + ev.clientY - y0)) + "px"; };
    const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); grip.classList.remove("on");
      store.set(PROG_H, String(Math.round(body.getBoundingClientRect().height))); };
    window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
  });
}

function sideHTML(t) {
  const nc = t.nextCall;
  const call = nc
    ? `<div class="call"><div class="when">${esc(dayWord(nc.start))} · ${esc(timeWord(nc.start))}</div><div class="what">${esc(nc.title)} <span class="meta">with ${esc(nc.people.join(", "))}</span></div>
        <div class="links">${nc.prep ? `<a href="${esc(nc.prep.href)}">open the prep</a><a href="${esc(nc.prep.reader)}">read it</a>` : `<span class="meta">no prep yet</span>`}${nc.join ? `<a href="${esc(nc.join)}" target="_blank" rel="noreferrer">join</a>` : ""}</div></div>`
    : `<p class="line meta">no call with ${esc(listWords(t.nextCallPeople))} on the calendar</p>`;
  return `<section class="card"><h3>Next call</h3>${call}</section>
    ${progressHTML(t)}
    <section class="card"><h3>People</h3>${(t.people || []).map(p => `<div class="ws-pp"><a href="${esc(p.href)}">${esc(p.name)}</a>${p.stands ? `<p class="st"><span class="d">${esc(md(p.standsDate))}</span>${subjText(p.stands)}</p>` : ""}</div>`).join("") || `<p class="none">The subject file names no one.</p>`}</section>`;
}
const listWords = a => !a.length ? "its people" : a.length === 1 ? a[0] : a.slice(0, -1).join(", ") + " or " + a[a.length - 1];

function paint() {
  const t = T;
  document.title = (t.short || t.name) + " · Thread";
  $("#crumb").textContent = t.status ? t.status : "";
  const ppl = t.people.map(p => `<a class="badge person" href="${esc(p.href)}" title="open ${esc(p.name)} on the People page">${esc(p.name)}</a>`).join("");
  const anc = t.ancestors || [];
  const crumbs = `<nav class="crumbs"><a class="back" href="/threads">every thread</a>${anc.map(a => `<span class="sep">›</span><a href="${esc(a.href)}" title="${esc(a.title)}">${esc(a.name)}</a>`).join("")}${anc.length ? `<span class="sep">›</span><span>this piece</span>` : ""}</nav>`;
  const rest = t.short && t.name !== t.short ? t.name.slice(t.short.length).trim().replace(/^\(|\)$/g, "") : "";
  const ru = t.rollup || {};
  // 0.79.0: a focused pick opens on the comparison, the first band of its workspace, as wide as the window allows
  const pick = FOCUS && FW && !FW.error ? BVWork.pickBlock(FW) : "";
  $("#sheet").classList.toggle("wide", !!pick);
  $("#sheet").innerHTML = `<div class="thead">${crumbs}<h2>${esc(t.short || t.name)}</h2>${rest ? `<p class="aside">${esc(rest)}</p>` : ""}
      <div class="meta"><span class="who">${ppl}</span>${t.ledgers.length ? `<span>on ${esc(t.ledgers.join(", "))}</span>` : ""}${t.gather === "own" ? `<span class="gather" title="This thread's header says gather: own, so it takes in only its own ledger's items and the items that link it, not every item that names its people or words.">takes in only its own items and what links it</span>` : ""}${t.updated ? `<span>updated ${esc(md(t.updated))}</span>` : ""}${ru.inPieces ? `<span>${plural(ru.open, "open item")} counting its pieces</span>` : ""}</div></div>
    ${pick}
    <div class="cols"><div>
      ${focusHTML()}
      ${nowHTML(t)}
      <section class="card stands"><h3>Where it stands <span class="meta">${esc((t.stands.head || "").replace(/^where it stands\s*/i, ""))}</span></h3>
        <article class="md">${t.stands.text ? subjText(t.stands.text, { block: true }) : `<p class="none">The subject file has no summary yet.</p>`}</article>
        <p class="foot"><a href="${esc(t.stands.reader)}">open the subject file in the Reader</a></p></section>
      ${mapHTML(t)}
      ${piecesHTML(t)}
      ${builtHTML(t)}
      ${todoHTML(t)}
    </div><div class="side">${sideHTML(t)}</div></div>`;
  wireProgress();
  BV.glossary.scan($("#main"));
  if (BV.ledger && BV.ledger.prime) BV.ledger.prime();   // the item rows' codes become their words once the ledgers are read (after the paint)
}

// the focused item: its workspace, in this order: the item, its brief, its own files, its history, its note
function focusHTML() {
  if (!FOCUS) return "";
  if (!FW || FW.error) return `<div class="focusbar"><button type="button" class="btn" id="unfocus">back to the thread</button><span class="meta">${esc((FW && FW.error) || "reading the item…")}</span></div>`;
  const w = FW;
  return `<div class="focus" id="focus"><div class="focusbar"><button type="button" class="btn" id="unfocus" title="show the whole thread again">back to the thread</button>
      <a class="worklink" href="${esc(w.item.projectHref)}">on the ${esc(w.item.label)} list</a></div>
    ${BVWork.itemBlock(w, { title: "Working on", focusHref })}${workingSiblingsHTML(w)}${BVWork.briefBlock(w, B.say)}
    ${BVWork.filesBlock(w, { title: "Its files", empty: "The item links no files; the thread's are beside it." })}
    ${BVWork.historyBlock(w)}${BVWork.notesBlock(w)}</div>`;
}
// 0.93.0 (the easy-to-use rules 7 and 16): while a question is answered here, the other open questions to the owner on
// this thread stand right under Working on, each with its presses, so the next one is never found by scrolling the
// thread; once the focused question is answered, the next one takes its place (focusNext). The owner, 10/26: since I am
// working on answering those questions, shouldn't they appear in the working on section?
function workingSiblings(focusRef, kind) {
  if (!T || kind !== "question") return [];
  return (T.items || []).filter(i => i.kind === "question" && i.mark === "?" && i.who === BV.owner && (i.project + "/" + i.id) !== focusRef);
}
function workingSiblingsHTML(w) {
  const s = workingSiblings(w.item.project + "/" + w.item.id, w.item.kind);
  // the last question answered: say so, with the way back to Today, where the task that sent him here sits (the walk of 10/26)
  if (!s.length) return w.item.kind === "question" && w.item.mark !== "?" ? `<section class="card ws-siblings"><p class="none">Every question on this thread is answered. <a href="/">Back to Today</a></p></section>` : "";
  return `<section class="card todo-card ws-siblings"><h3>Also to answer here <span class="meta">${plural(s.length, "open question")} · the next one takes this place when you answer</span></h3><ol class="todo">${s.map((i, k) => row(i, k + 1)).join("")}</ol></section>`;
}
async function focusNext(project, payload) {
  if (!FOCUS || !payload || payload.action !== "answer" || FOCUS !== project + "/" + payload.id) return;
  const nxt = workingSiblings(FOCUS, "question")[0];
  if (nxt) await setFocus(nxt.project + "/" + nxt.id);
}
async function loadFocus() {
  if (!FOCUS) { FW = null; return; }
  try {
    const r = await fetch("/api/work?scope=item&item=" + encodeURIComponent(FOCUS));
    const j = await r.json();
    FW = r.ok ? j : { error: j.error || "could not read the item" };
  } catch (e) { FW = { error: e.message }; }
}
// focus an item, or clear the focus, without leaving the page; the address follows so back and forward work
async function setFocus(ref, push = true) {
  B.stop();
  FOCUS = ref || "";
  if (push) history.pushState({ item: FOCUS }, "", FOCUS ? focusHref({ project: FOCUS.split("/")[0], id: FOCUS.split("/")[1] }) : `/thread?subject=${encodeURIComponent(SUBJECT)}`);
  FW = null; if (FOCUS) paint();
  await loadFocus(); paint();
  const m = $("#main"); if (m) m.scrollTop = 0;
  if (FOCUS) B.status();
}
window.addEventListener("popstate", () => setFocus(new URLSearchParams(location.search).get("item") || "", false));

function paintIndex(d) {
  document.title = "Threads";
  $("#title").textContent = "Threads";
  $("#crumb").textContent = d.count ? plural(d.count, "thread") : "";
  // 0.77.0: a piece sits under the thread it is a piece of, indented; a parent's counts include its pieces'
  const all = d.threads || [], have = new Set(all.map(r => r.subject)), kids = {};
  for (const r of all) if (r.parent && have.has(r.parent)) (kids[r.parent] = kids[r.parent] || []).push(r);
  const order = [], walk = (r, depth, seen) => { if (seen.has(r.subject)) return; seen.add(r.subject); order.push([r, depth]); for (const k of kids[r.subject] || []) walk(k, depth + 1, seen); };
  const seen = new Set(); for (const r of all) if (!(r.parent && have.has(r.parent))) walk(r, 0, seen);
  for (const r of all) walk(r, 0, seen);
  $("#sheet").innerHTML = `<section class="card"><h3>Every thread <span class="meta">one per subject file, the newest dated line first; a piece of a thread sits under it</span></h3>
    ${order.map(([r, depth]) => `<a class="tix${depth ? " sub" : ""}" href="${esc(r.href)}"${depth > 1 ? ` style="padding-left:${28 * depth}px"` : ""}><span class="nm">${esc(r.name)}</span>
        <span class="num"><b>${r.forOwner}</b> for you<br>${plural(r.open, "open item")}${r.own != null && r.own !== r.open ? `, ${r.open - r.own} in its pieces` : ""}${r.last ? ` · ${esc(md(r.last))}` : ""}</span>
        <span class="ppl">${depth ? "a piece of the thread above · " : ""}${esc(r.people.map(p => p.name).join(", "))}${r.status && r.status !== "live" ? ` · ${esc(r.status)}` : ""}</span></a>`).join("")
      || firstThreadBox(d.first || {})}</section>`;
  const f = $("#firstThread");
  if (f) f.addEventListener("submit", async e => {
    e.preventDefault(); const fd = new FormData(f), st = $("#firstStatus"); st.textContent = "starting…";
    const r = await fetch("/api/threads/new", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: fd.get("name"), about: fd.get("about") }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { st.textContent = "refused: " + (j.error || r.status); return; }
    if (j.proposed) { st.textContent = BV.proposedText ? BV.proposedText(j) : "sent as a request"; return; }
    location.href = j.href;
  });
}

// 0.69.0 (the navigation direction, rule 5): a fresh brain has no threads yet; the page says what a thread is and what to
// do next, and starts the first one, named from what setup wrote about the work (context/current-focus.md) when it can
function firstThreadBox(s) {
  return `<div class="first">
    <p>No threads yet. A thread is one page per piece of work: where it stands, who it is with, what is open on it, and its next call. Calls you drop into the brain add to them on their own; the first one you start here.</p>
    <form id="firstThread"><div class="field"><label>the work, in a few words</label><input name="name" required value="${esc(s.name || "")}" placeholder="what you are working on"></div>
      <div class="field"><label>one line on where it stands</label><input name="about" value="${esc(s.about && s.about !== s.name ? s.about : "")}" placeholder="what it is for, who it is with, what comes next"></div>
      <div class="irow"><button class="btn primary" type="submit">Start this thread</button><span class="status-line" id="firstStatus" style="margin:0"></span></div></form>
    <p class="meta">${s.name ? `Named from what your setup wrote about your work. ` : ""}Or ask your Claude: <i>start a thread about what I am working on</i>.</p></div>`;
}

// the "no thread yet" case: what work.html drew, the item and every block around it, in that order
function paintBare() {
  const w = FW;
  document.title = BVWork.clipWords(w.item.text, 60) + " · Thread";
  $("#title").textContent = "No thread yet";
  $("#crumb").textContent = `${w.item.label} · ${w.item.kind}`;
  // 0.79.0: a pick opens on the comparison, its first band, as wide as the window allows; the rest keeps its width
  const pick = BVWork.pickBlock(w);
  $("#sheet").classList.toggle("wide", !!pick);
  $("#sheet").innerHTML = `<div class="thead"><a class="back" href="/threads">every thread</a>
      <p class="meta">${w.thread ? `It belongs to <a href="${esc(w.thread.href)}">${esc(w.thread.name)}</a>, and is worked here on its own.` : "This item names no thread's people or words, so it is worked here on its own."} <a href="${esc(w.item.projectHref)}">on the ${esc(w.item.label)} list</a></p></div>
    ${pick}<div class="pk-rest"><div class="sheet-bare">` + BVWork.itemBlock(w) + BVWork.briefBlock(w, B.say) + BVWork.filesBlock(w) + BVWork.peopleBlock(w.people)
    + BVWork.siblingsBlock(w) + BVWork.callBlock(w.nextCall, w.nextCallPeople) + BVWork.historyBlock(w) + BVWork.notesBlock(w) + `</div></div>`;
  BV.glossary.scan($("#main"));
}

async function load() {
  if (BARE) {
    const r = await fetch("/api/work?item=" + encodeURIComponent(FOCUS));
    const j = await r.json();
    if (!r.ok) { FW = null; $("#sheet").innerHTML = `<p class="none">${esc(j.error || "could not read the item")} · <a href="/threads">every thread</a></p>`; return; }
    FW = j; paintBare(); return;
  }
  if (INDEX) {
    const r = await fetch("/api/threads"); paintIndex(await r.json()); return;
  }
  const r = await fetch("/api/thread?subject=" + encodeURIComponent(SUBJECT));
  const j = await r.json();
  if (!r.ok) { $("#sheet").innerHTML = `<p class="none">${esc(j.error || "could not read the thread")} · <a href="/threads">every thread</a></p>`; return; }
  T = j;
  await loadFocus();
  paint();
}

// ---- the presses: the same writes the Today queue makes, then the page reads itself back ----
async function act(project, payload) {
  const res = await BV.ledgerAct(project, payload);
  if (res.ok) { await load(); BV.refreshBadges(); await focusNext(project, payload); }   // 0.93.0: the next open question takes the answered one's place
  return res;
}
document.addEventListener("click", async e => {
  if (e.target.closest("#closeDrawer")) { $("#drawer").hidden = true; return; }
  const fo = e.target.closest("a[data-focus]"); if (fo && !e.ctrlKey && !e.metaKey && !e.shiftKey) { e.preventDefault(); await setFocus(fo.dataset.focus); return; }
  if (e.target.closest("#unfocus")) { e.preventDefault(); await setFocus(""); return; }
  const bg = e.target.closest("#briefGo"); if (bg) { e.preventDefault(); if (!bg.disabled) await B.go(bg); return; }
  const im = e.target.closest("img.thumb[data-img]"); if (im) { e.preventDefault(); BV.lightbox(im.dataset.img); return; }
  // 0.79.0, the comparison: a screen switch moves its column's frame; an answer press answers, then goes back
  const pg = e.target.closest("[data-pk-go]"); if (pg) { e.preventDefault(); BVWork.pickGo(pg); return; }
  const pa = e.target.closest("button[data-pick]"); if (pa) { e.preventDefault(); if (!pa.disabled) await BVWork.pickAnswer(pa); return; }
  const qc = e.target.closest("[data-qchoice]");
  if (qc) { e.preventDefault(); qc.closest("li").classList.add("going"); await act(qc.dataset.project, { action: "answer", id: qc.dataset.q, text: qc.dataset.qchoice, by: BV.owner }); return; }
  const qw = e.target.closest("[data-qwrite]");
  if (qw) { e.preventDefault(); const f = qw.closest("li").querySelector("form.qbox"); if (f) { f.hidden = !f.hidden; if (!f.hidden) f.querySelector("textarea").focus(); } return; }
  const qd = e.target.closest("[data-qdone]");
  if (qd) {
    e.preventDefault(); qd.closest("li").classList.add("going");
    const pend = BV.replies.pending(qd);
    if (pend) await BV.replies.act(pend.project, pend.id, pend.text, pend.ledger);
    await act(qd.dataset.project, { action: "done", id: qd.dataset.qdone }); return;
  }
  const qn = e.target.closest("[data-qnote]");
  if (qn) { e.preventDefault(); const b = qn.closest("li").querySelector(".qnote"); if (b) { b.hidden = !b.hidden; if (!b.hidden) b.querySelector("textarea").focus(); } return; }
  const pc = e.target.closest(".badge.person[data-person]"); if (pc) { location.href = `/people?open=${encodeURIComponent(pc.dataset.person)}`; return; }
  const w = e.target.closest("a.wikilink"); if (w) { e.preventDefault(); BV.drawer.open(w.dataset.wikilink.split("#")[0].trim(), w.dataset.wikilink.split("#")[1]); return; }
  const o = e.target.closest(".filelink[data-open]"); if (o) { BV.drawer.open(o.dataset.open, o.dataset.frag); return; }
  // 0.77.0: a Next row in Progress focuses its item here, unless the press was on a link inside it
  const pn = e.target.closest(".prow.next[data-key]");
  if (pn && !e.target.closest("a, button")) { await setFocus(pn.dataset.key); return; }
  // pressing an item's words in What needs you focuses it here
  const tw = e.target.closest(".todo-card li.trow");
  if (tw && !e.target.closest("a, button, form, textarea, input, .idtag, details summary")) { await setFocus(tw.dataset.key); }
});
document.addEventListener("submit", async e => {
  const f = e.target;
  if (f.dataset.notebox) { e.preventDefault(); await BVWork.saveNote(f, FW.item, async () => { await load(); }); return; }
  if (f.dataset.reply || !f.dataset.q) return;
  e.preventDefault();
  await act(f.dataset.project, { action: "answer", id: f.dataset.q, text: f.querySelector("textarea").value, by: BV.owner });
});
document.addEventListener("keydown", e => { if (BV.typing(e)) return; if (e.key === "Escape") $("#drawer").hidden = true; });
BV.replies.wire(document, { onDone: async () => { await load(); BV.refreshBadges(); } });
BV.holds.wire(document, { onDone: async () => { await load(); } });
BV.steps.wire(document, { onDone: async () => { await load(); BV.refreshBadges(); } });   // 0.86.0: a tick on a step, here and in the workspace rows
BV.undo.onChange(async () => { await load(); });          // 0.71.0: an undo from the bar or the day's list reads the thread back
// 0.71.0, the Now band: the thread open here is the one Today leads with for the rest of the day (this browser only)
if (SUBJECT) { try { const d = new Date(); localStorage.setItem("bv.now", JSON.stringify({ kind: "thread", subject: SUBJECT,
  day: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}` })); } catch (e) {} }
load().then(() => { if (FOCUS) B.status(); }).catch(e => { $("#sheet").innerHTML = `<p class="none">Could not read the thread: ${esc(e.message)}</p>`; });
</script>
</body>
